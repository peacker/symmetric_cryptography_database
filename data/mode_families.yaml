      rounds: 18
    notes: 'First published as RSA-MD2 in RFC 1115 (1989), section 4.2; later documented separately in RFC 1319 (1992). Not
      a Merkle–Damgård construction. Block=16 bytes=128 bits. State X=48 bytes=384 bits (three 16-byte rows). Per-block: 18
      rounds of mixing using the 256-byte pi-derived S permutation. Preprocessing: PKCS-style padding (1–16 bytes) + 16-byte
      checksum appended. Output = X[0..15] (first 16 bytes = 128 bits). Deprecated.

      '
