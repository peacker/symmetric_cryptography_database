  characteristics:
    state_size_bits: 544
    components:
    - id: nlfsr
      params:
        length: 512
    - id: nonlinear_filter
      params:
        output_bits: 32
        operations: add_mod, mul_mod, xor
    - id: add_mod
      params:
        modulus: 4294967296
    - id: xor
  reference_ids:
  - hawkes_et_al_2008_nlsv2
  process_participations:
