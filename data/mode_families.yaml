  innovative_ideas:
  - id: md2_pi_sbox
    name: 256-byte permutation S derived from the digits of pi
    note: 'MD2 uses a fixed 256-byte random permutation S (constructed from fractional digits of pi) applied in 18 iterative
      rounds to mix the 48-byte state buffer, providing nonlinearity without a key schedule.

      '
  - id: md2_checksum_preprocessing
    name: 16-byte checksum appended before compression
    note: 'MD2 prepends PKCS-style padding (1–16 bytes) and then appends a 16-byte checksum of the padded message before running
      the main compression loop. This binds the final hash to the complete message structure.

      '
  notes: 'MD2 was published in RFC 1115 (1989) as RSA-MD2, with a reference implementation supplied by Ronald Rivest for privacy-enhanced
    Internet mail; RFC 1319 (1992) later documented it separately. It is not a Merkle–Damgård construction. MD2 processes
    16-byte (128-bit) blocks. State X = 48 bytes = 384 bits (initialized to 0). Each block processed in 18 rounds using the
    pi-derived S-table. Output = X[0..15] (128 bits). Designed for 8-bit microprocessors; much slower than MD4/MD5. Deprecated
    for cryptographic use.

    '
  instances:
