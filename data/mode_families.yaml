    note: JH's block cipher generalizes the AES/Rijndael SPN design methodology to a multi-dimensional array, reusing an MDS-code-based
      diffusion layer in place of Rijndael's two-dimensional MixColumns/ShiftRows.
  - source_family_id: serpent
    relations:
    - inspired_by
    note: JH's block cipher is stated to combine the best features of AES (SPN and MDS code) and Serpent (SPN and bit-slice
      implementation), adopting Serpent's bit-slice-friendly SPN structure for efficient software implementation.
  - source_family_id: lucifer
    relations:
    - selection_of_possible_configurations
    note: JH's S-box application uses round-constant bits to select between two S-boxes at each position, a mechanism the
      specification describes as similar to Lucifer, increasing algebraic complexity versus simple constant XOR.
  - source_family_id: cs_cipher
    relations:
    - related_to
    note: JH's design rationale notes that CS-Cipher already realized a three-dimensional instance of the same generalized
      AES design methodology that JH extends to eight dimensions, though CS-Cipher's variant was only efficient on 8-bit platforms.
