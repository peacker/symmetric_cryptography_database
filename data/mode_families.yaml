    stage_ids:
    - submissions
    - finalist
    - winner
    status: winner
  influences:
  - source_family_id: argon
    relations:
    - improvement_of
    - related_to
    note: The joint specification presents Argon as the designers' original PHC submission and Argon2 as its streamlined next
      generation, trading Argon's extreme memory-reduction penalties for faster, parallel memory filling and a simpler design.
  - source_family_id: blake2
    relations:
    - inspired_by
    note: Argon2 directly uses BLAKE2b for its hash H and bases compression permutation P on the BLAKE2b round function. Version
      1.2 modifies the modular additions with BlaMka multiplications, so the round is derived from rather than identical to
      BLAKE2b.
  innovative_ideas:
  - id: argon2_memory_hard_compression
    name: Memory-hard compression function using large memory array
    note: 'Argon2 fills a large array of 1 KB blocks using compression function G, which XORs two existing blocks and applies
      the Blake2b-derived permutation P twice (row-then-column). The data-dependent (Argon2d) or data-independent (Argon2i)
      indexing ensures that time-space tradeoff attacks require memory proportional to the intended cost, making GPU/ASIC
      attacks expensive.

      '
  - id: argon2_three_variants
    name: Three variants for different threat models
    note: 'Argon2d uses data-dependent memory access (best tradeoff resistance, side-channel vulnerable), Argon2i uses data-independent
      access (side-channel safe, weaker tradeoff resistance), and Argon2id (primary recommended variant) uses Argon2i for
      the first half and Argon2d for the second half of each pass.

      '
  notes: 'Argon2 is a memory-hard password hashing function and KDF by Biryukov, Dinu, and Khovratovich (University of Luxembourg).
    PHC winner (2015). Standardised as RFC 9106 (IRTF CFRG, September 2021). Parameters: password P, salt S, parallelism p,
    tag length τ, memory m (KB), iterations t, version v, key K, data X. Three modes: Argon2d (data-dependent indexing), Argon2i
    (data-independent), Argon2id (hybrid). Core: compression function G = Blake2b permutation P applied row-wise and column-wise
    on 1024-byte blocks. Variable-length hash H'' based on BLAKE2b. Argon2id is the recommended variant for password hashing
    and password-based key derivation.

    '
