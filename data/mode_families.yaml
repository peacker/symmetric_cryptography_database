  - ascon_joc_2021
  - sp_800_232
  process_participations: []
  influences:
  - source_family_id: ascon
    relations:
    - used_by
    note: Ascon-AEAD is a duplex-sponge authenticated encryption construction built directly on the Ascon-p permutation, reusing
      its state layout and round function unchanged.
  notes: 'Duplex-sponge AEAD construction family. The 2016/2021 v1.2 submission defines three parameter profiles: Ascon-128
    (64-bit rate, Ascon-p[12]/Ascon-p[6]), Ascon-128a (128-bit rate, Ascon-p[12]/Ascon-p[8]), and Ascon-80pq (64-bit rate,
    160-bit quantum-resistant key, Ascon-p[12]/Ascon-p[6]) — all under big-endian bit ordering with the original v1.2 IV constants.
    NIST SP 800-232 standardizes a single profile, Ascon-AEAD128, which adopts the 128-bit-rate Ascon-p[12]/Ascon-p[8] parameters
    of Ascon-128a under little-endian bit ordering with revised NIST IV constants; Ascon-128 and Ascon-80pq were not carried
    forward into the standard.

    '
  instances:
  - id: ascon_128
    name: Ascon-128
    type: aead
    reference_ids:
    - ascon_caesar_submission_2016
    - ascon_nist_lwc_submission_2021
    - ascon_joc_2021
    characteristics:
      state_size_bits: 320
      key_size_bits: 128
      nonce_size_bits: 128
      tag_size_bits: 128
      block_size_bits: 64
      rounds: 12
    notes: v1.2 CAESAR/NIST LWC submission profile using a 64-bit rate, big-endian bit ordering, and the original v1.2 IV
      constants; uses Ascon-p[12] for initialization/finalization and Ascon-p[6] while processing associated data and plaintext.
      Not carried forward into NIST SP 800-232.
  - id: ascon_128a
    name: Ascon-128a
    type: aead
    reference_ids:
    - ascon_caesar_submission_2016
    - ascon_nist_lwc_submission_2021
    - ascon_joc_2021
    characteristics:
      state_size_bits: 320
      key_size_bits: 128
      nonce_size_bits: 128
      tag_size_bits: 128
      block_size_bits: 128
      rounds: 12
    notes: v1.2 CAESAR/NIST LWC submission profile using a 128-bit rate, big-endian bit ordering, and the original v1.2 IV
      constants; uses Ascon-p[12] for initialization/finalization and Ascon-p[8] while processing associated data and plaintext.
      NIST SP 800-232 restandardizes this exact rate/round profile as Ascon-AEAD128 under little-endian bit ordering with
      revised NIST IV constants (see ascon_aead128).
  - id: ascon_80pq
    name: Ascon-80pq
    type: aead
    reference_ids:
    - ascon_caesar_submission_2016
    - ascon_nist_lwc_submission_2021
    - ascon_joc_2021
    characteristics:
      state_size_bits: 320
      key_size_bits: 160
      nonce_size_bits: 128
      tag_size_bits: 128
      block_size_bits: 64
      rounds: 12
    notes: v1.2 quantum-resistant-key variant with a 160-bit key and a 64-bit rate, otherwise identical to Ascon-128 (Ascon-p[12]/Ascon-p[6],
      big-endian bit ordering, original v1.2 IV constants). Not carried forward into NIST SP 800-232; it has no standardized
      successor.
  - id: ascon_aead128
    name: Ascon-AEAD128
    type: aead
    reference_ids:
    - sp_800_232
    characteristics:
      state_size_bits: 320
      key_size_bits: 128
      nonce_size_bits: 128
      tag_size_bits: 128
      block_size_bits: 128
      rounds: 12
    notes: NIST-standardized authenticated encryption for constrained devices, using little-endian bit ordering and revised
      NIST IV constants. It adopts the 128-bit-rate Ascon-p[12]/Ascon-p[8] profile of the v1.2 Ascon-128a (see ascon_128a),
      while the v1.2 Ascon-128 and Ascon-80pq profiles were not standardized.
