    note: Poseidon is the unkeyed sponge-hash instantiation of the same HADES full/partial-round permutation used as
      the keyed block cipher HadesMiMC, per Grassi, Khovratovich, Rechberger, Roy, and Schofnegger's own split of the
      original design (originally eprint 2019/458, "Starkad and Poseidon").
  notes: 'Poseidon is a sponge-construction hash function over GF(p) built on the HADES permutation (alternating full
    and partial S-box SPN rounds with a power-map non-linearity and Cauchy MDS diffusion), designed to minimize R1CS/Plonk
    constraint counts for zero-knowledge proof systems. Its binary-extension-field sibling Starkad is documented in
    the same original design (see starkad, this file). Widely deployed in ZK-rollup and blockchain
    proof systems. Local copy: references/[2021][hadesmimc,poseidon][][poseidon_usenix].pdf.'
  instances:
