- id: ketje
  name: Ketje
  notes: 'Ketje, by the Keccak team, is a family of four lightweight permutation-based AEAD schemes -- Ketje Jr,
    Sr, Minor, and Major -- built on round-reduced, "twisted" Keccak-p permutations of widths 200, 400, 800, and
    1600 bits respectively (the twist conjugates the standard Keccak-p permutation by a fixed bit-relabeling
    step mapping, cryptographically equivalent to the original permutation applied to a relabeled state, not a
    structural change). The construction is MonkeyDuplex, a duplex-construction variant supporting calls that
    invoke the permutation with different (aggressively reduced) round counts for a speed/security trade-off
    that requires nonce uniqueness; the AEAD mode on top, MonkeyWrap, is functionally equivalent to SpongeWrap.
    Recommended key length is 128 bits. Reached CAESAR round 3 but was not selected for the final portfolio.'
