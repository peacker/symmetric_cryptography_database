    name: Continuously updated large key-dependent tables
    note: 'HC-256 maintains two 1024-entry 32-bit tables P and Q (32 KB total) that are updated every step using nonlinear
      feedback. Every output word depends on the current secret table state, making statistical attacks extremely costly.

      '
  notes: 'HC-256 is a software-efficient synchronous stream cipher by Hongjun Wu (FSE 2004 / eSTREAM). State: two 1024-entry
