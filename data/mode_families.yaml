- id: ocb
  name: OCB
  notes: 'OCB (Offset Codebook Mode) is a single-pass, fully parallelizable, rate-1 block-cipher AEAD mode: a
    per-block "offset" -- derived from an encrypted nonce via a Gray-code-indexed sequence of doublings in
    GF(2^128) -- is XORed into a plaintext block both before and after a single block-cipher encryption call, so
    one block-cipher invocation per block provides both encryption and (via a running plaintext checksum,
    similarly offset-masked and encrypted once more) authentication, unlike a generic encrypt-then-MAC composite
    which needs two passes. Predates CAESAR by over a decade (Rogaway, Bellare, Black, Krovetz, 2001; refined
    through OCB1/OCB2/OCB3) and was already independently standardized as RFC 7253 before its CAESAR submission,
    which is essentially a thin wrapper attaching that RFC. CAESAR''s own final-portfolio report picked it
    (alongside AEGIS-128/128L) for use case 2 (high-performance).'
  construction_ids:
  - block_cipher_based
  - ocb_mode
  target_applications:
  - software
  - hardware
  characteristics:
