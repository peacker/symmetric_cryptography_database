- id: omd
  name: OMD
  notes: 'OMD ("Offset Merkle-Damgard") is an AEAD mode built from a keyed compression function (rather than a
    block cipher or permutation, as most AEAD schemes use) -- security is proved in the standard model from just
    the PRF assumption on the compression function, and Intel''s SHA-extension instructions make it
    competitively fast despite the less common choice of primitive. Recommended instantiations key the
    compression functions of standard SHA-256 (OMD-sha256, the main CAESAR recommendation, for 32-bit
    platforms) or SHA-512 (OMD-sha512, for 64-bit platforms). Reached CAESAR round 2 but was not selected for
    round 3.'
  construction_ids:
  - merkle_damgard
  target_applications:
  - software
  characteristics:
    components:
    - id: add_mod
      params:
        modulus: 4294967296
    - id: xor
