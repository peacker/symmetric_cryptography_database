  - id: cryptmt3_mt_mother_generator
    name: Mersenne Twister as guaranteed-period mother generator
    note: 'CryptMT3 uses the Mersenne Twister LFSR (period ≥ 2^19937−1) as the "mother generator" providing a huge-state linear
      base, while a nonlinear filter with memory using integer multiplication introduces cryptographic nonlinearity without
      losing the period guarantee.

      '
  notes: 'CryptMT3 (version 3) is a stream cipher by Matsumoto et al. submitted to eSTREAM. It combines a large-state LFSR
    (Mersenne Twister recurrence, ~19937-bit state, period ≥ 2^19937−1) with a nonlinear filter with memory using 128-bit
    integer multiplication. The filter state y is updated as y_{i+1} := y_i × (x_i | 1) mod 2^128, output = 8 MSBs of y. 1241-dimensionally
    equidistributed. Optimised for CPUs with SIMD (e.g. Intel Core 2 Duo SSE2). Key and IV setup via the MT initialization
    procedure.

    '
