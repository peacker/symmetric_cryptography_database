- id: hs1_siv
  name: HS1-SIV
  notes: 'HS1-SIV instantiates Rogaway and Shrimpton''s SIV (Synthetic IV) construction with a new PRF, HS1
    ("Hash-Stream 1"): a bespoke almost-universal hash function (HS1-Hash) processes the associated data and
    plaintext, and the hash result XORed into the key feeds Bernstein''s ChaCha stream cipher to generate both
    the synthetic IV/tag and the output keystream. Fully deterministic and nonce-misuse-resistant by
    construction (repeating a (key, AD, plaintext) triple always reproduces the same ciphertext, revealing only
    that a repeat occurred). Reached CAESAR round 2 but was not selected for round 3.'
