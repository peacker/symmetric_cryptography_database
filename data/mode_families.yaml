    name: Word-based NLFSR with nonlinear filter for high-throughput keystream
    note: 'Dragon''s 32×32-bit NLFSR uses a word-level nonlinear feedback function F that maps 6×32 bits → 6×32 bits via three
      mixing layers and an S-box layer, producing 64 bits of keystream per clock. Word-based design achieves gigabits-per-second
