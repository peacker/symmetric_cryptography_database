  process_participations: []
  influences: []
  notes: PANAMA is a combined stream cipher and hash function by Daemen and Clapp (FSE 1998) built from a 17-word (544-bit)
    nonlinear "state" updated each round by gamma (nonlinear), pi (bit-transposition), and theta (linear diffusion) transformations,
    coupled to a 32-stage, 8-word-per-stage linear feedback "buffer" that feeds taps into the state. It produces a 256-bit
    hash or, run in the other direction, an arbitrary-length keystream. Its gamma/pi/theta round structure and belt-and-mill
    architecture were carried forward into RadioGatún and, ultimately, Keccak, by the same designer.
