- id: ghash
  name: GHASH
  construction_ids:
  - polynomial_universal_hash
  round_ids:
  - ghash_round
  target_applications:
  - software
  - hardware
  - tls
  characteristics:
    block_size_bits: 128
    components:
    - id: nonlinear_filter
    - id: xor
  reference_ids:
  - gcm_ref
  process_participations: []
  influences: []
  notes: 'GHASH (McGrew and Viega; standardized as NIST SP 800-38D Sec. 6.4) is the universal hash underlying GCM: it
    compresses an encoding of the additional authenticated data and the ciphertext into one 128-bit block by
    evaluating them, as coefficients of a polynomial, at a secret point H = CIPH_K(0^128) in the binary Galois field
    GF(2^128) (reduction polynomial u^128+u^7+u^2+u+1). GHASH is keyed and bounded-collision-probability but not,
    on its own, a secure MAC or a cryptographic hash function -- NIST''s own standard notes it "is a keyed hash
    function but not, on its own, a cryptographic hash function," approved only for use inside GCM, where its raw
    output is masked (XORed with a GCTR/CTR-mode-encrypted block) before release, per the Carter-Wegman pattern (see
    the carter_wegman mode construction on the aes_gcm family). Not itself modeled as reusing any other tracked
    cipher''s S-box/round structure -- its only touchpoint with the underlying block cipher is generating H by
    encrypting the all-zero block once.'
  instances:
  - id: ghash_v1
    name: GHASH
    type: universal_hash
    reference_ids:
    - gcm_ref
    characteristics:
      block_size_bits: 128
      key_size_bits: 128
      output_size_bits: 128
    notes: Sole parameter set; block size fixed at 128 bits to match GCM's 128-bit-block-cipher requirement.
- id: polyval
  name: POLYVAL
  construction_ids:
  - polynomial_universal_hash
  round_ids:
  - polyval_round
  target_applications:
  - software
  - tls
  characteristics:
    block_size_bits: 128
    components:
    - id: nonlinear_filter
    - id: xor
  reference_ids:
  - rfc_8452
  process_participations: []
  influences:
  - source_family_id: ghash
    relations:
    - variant_of
    note: 'RFC 8452 defines POLYVAL directly in terms of GHASH: "POLYVAL(H, X_1, X_2, ...) is equal to
      ByteReverse(GHASH(ByteReverse(H) * x, ByteReverse(X_1), ByteReverse(X_2), ...))." Same GF(2^128) polynomial-
      evaluation mechanism and (up to the byte-reversal and the extra multiplication by x folded into the "dot"
      operator) the same reduction field, re-oriented purely so software carryless-multiply instructions can be
      used without GHASH''s bit-reflection step -- an explicit, primary-source-confirmed variant relationship, not
      just a shared paradigm.'
  notes: 'POLYVAL (Gueron, Langley, Lindell; RFC 8452) is the universal hash used by AES-GCM-SIV''s authentication
    mechanism, a byte/bit-reversed variant of GHASH designed to avoid the reflection step GHASH needs for efficient
    use of hardware carryless-multiply instructions. It operates in GF(2^128) with reduction polynomial
    x^128+x^127+x^126+x^121+1 (different from GHASH''s x^128+x^7+x^2+x+1, since the field element ordering itself
    differs) and defines dot(a,b) = a*b*x^-128 as its multiplication operator. Used inside AES-GCM-SIV (not itself
    modeled as a separate mode_families entry here) as part of a synthetic-IV (SIV) construction: POLYVAL''s output
    over the AAD/plaintext/length block is XORed with the nonce, has its top bit cleared, and is then encrypted
    (not merely masked) with AES to produce the tag, which doubles as the deterministic CTR-mode starting counter --
    a more involved combination than GCM''s Carter-Wegman masking, so carter_wegman is not tagged on this family.'
  instances:
  - id: polyval_v1
    name: POLYVAL
    type: universal_hash
    reference_ids:
    - rfc_8452
    characteristics:
      block_size_bits: 128
      key_size_bits: 128
      output_size_bits: 128
    notes: Sole parameter set specified in RFC 8452.
- id: poly1305
  name: Poly1305
  construction_ids:
  - polynomial_universal_hash
  - carter_wegman
  round_ids:
  - poly1305_round
  target_applications:
  - software
  - tls
  - messaging
  characteristics:
    components:
    - id: mul_mod
      params:
        modulus: 1361129467683753853853498429727072845819
    - id: xor
  reference_ids:
  - bernstein_2005_poly1305
  - rfc_8439
  process_participations: []
  influences: []
  notes: 'Poly1305 (Bernstein, FSE 2005) is a one-time-key universal-hash-based MAC: it evaluates the message, split
    into 16-byte blocks, as coefficients of a polynomial at a secret point r in the prime field GF(2^130-5), via
    Horner''s rule (Acc = ((Acc+block)*r) mod p), then adds a second secret value s (never multiplied, only added at
    the end) to mask the raw polynomial-hash output -- baking the Carter-Wegman "hash-then-mask" combination directly
    into its own definition, unlike GHASH (see ghash), where the masking step happens one level up in GCM. r and s
    (together the 256-bit one-time key) must be unique and unpredictable per message; Bernstein''s original paper
    derived them by AES-encrypting a nonce, but explicitly generalizes this: "There is nothing special about AES
    here. One can replace AES with an arbitrary keyed function from an arbitrary set of nonces to 16-byte strings" --
    the basis for RFC 8439''s key derivation via a ChaCha20 block instead.'
  instances:
  - id: poly1305_v1
    name: Poly1305
    type: universal_hash
    reference_ids:
    - bernstein_2005_poly1305
    - rfc_8439
    characteristics:
      key_size_bits: 256
      output_size_bits: 128
    notes: Sole parameter set (32-byte one-time key r||s, 16-byte tag); r and s are typically derived per-message
      from a separate PRF/block-cipher output rather than reused directly as a static key.
- id: umac
  name: UMAC
  construction_ids:
  - multiply_add_universal_hash
  - carter_wegman
  round_ids:
  - umac_nh_round
  - umac_hash_layers_round
  target_applications:
  - software
  characteristics:
    components:
    - id: add_mod
    - id: mul_mod
    - id: xor
  reference_ids:
  - rfc_4418
  process_participations:
  - process_id: nessie_competition_european_commission_2000_2003
    stage_ids:
    - submissions_mac
    status: submitted
  influences: []
  notes: 'UMAC (Black, Halevi, Krawczyk, Krovetz, Rogaway, CRYPTO 1999; specified for IETF use in RFC 4418, Krovetz)
    authenticates a message by chaining three hash layers: L1-HASH applies NH -- a multiply-add tree, Y = sum_i
    ((M_i+K_i mod 2^32)*(M_{i+4}+K_{i+4} mod 2^32) mod 2^64) -- to each 1024-byte chunk of the message, producing an
    8-byte digest per chunk; L2-HASH Horner-evaluates those digests as a polynomial mod a 64- or 128-bit prime (the
    same mechanism as GHASH/Poly1305/POLYVAL, just applied one layer up); L3-HASH is a small inner-product hash mod
    prime(36) that compresses L2''s output to the final tag length. The tag is this hash XORed with a pad derived
    from the nonce via a separately-keyed PRF -- textbook Carter-Wegman masking. UMAC trades polynomial evaluation''s
    large-field single multiply per block (GHASH/Poly1305/POLYVAL) for many parallel word-sized multiply-adds
    (NH), aiming for very high software speed on ordinary CPUs (as low as ~1 cycle/byte per the RFC) at the cost of
    a much larger (reused, not one-time) hash key. Submitted to NESSIE as a MAC candidate.'
  authors:
  - John Black
  - Shai Halevi
  - Hugo Krawczyk
  - Ted Krovetz
  - Phillip Rogaway
  year: 1999
  instances:
  - id: umac_default
    name: UMAC
    type: universal_hash
    reference_ids:
    - rfc_4418
    characteristics:
      output_size_bits: 64
    notes: Tag length is a caller-chosen parameter (typically 32, 64, 96, or 128 bits); longer tags run the L1/L2/L3
      chain multiple times in parallel with independent keys/pads.
