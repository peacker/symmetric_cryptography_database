    characteristics:
      block_size_bits: 512
      state_size_bits: 512
      output_size_bits: 256
      rounds: 7
    notes: Default 32-byte BLAKE3 digest; the same construction supports arbitrary-length XOF output, keyed hashing, and key
      derivation.
