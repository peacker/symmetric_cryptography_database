    type: stream_cipher
    characteristics:
      key_size_bits: 128
      nonce_size_bits: 128
      state_size_bits: 32768
      output_word_bits: 32
    notes: 'HC-128 stream cipher with 128-bit key and 128-bit IV. Internal state: two 512-entry 32-bit tables P and Q (32768
      bits total). Outputs one 32-bit word per step. eSTREAM Phase 3 (software). ~3.05 cycles/byte on Pentium M.

      '
