    note: The Isap-K instances instantiate the Isap mode with the unmodified 400-bit Keccak-p[400] permutation (a narrower
      sibling of the Keccak-f[1600] SHA-3 permutation).
  notes: 'ISAP (Dobraunig, Eichlseder, Mangard, Mendel, Mennink, Primas, Unterluggauer; FSE 2017, NIST LWC submission 2019)
    is a family of nonce-based AEAD schemes built for inherent robustness against differential power analysis and fault
    attacks. It is an encrypt-then-MAC design: a sponge-based re-keying function IsapRk derives fresh per-message session
    keys for a keystream-generating IsapEnc and a separate absorbing IsapMac, so no single permutation call ever processes
    two blocks under the same secret state. ISAP defines no permutation of its own -- each instance reuses an existing
    published permutation (Ascon-p or Keccak-p[400]) unmodified, only varying the round counts of the four internal
    permutation calls (sh, sb, se, sk).

