  reference_ids: &id008
  - hkdf_ref
  - krawczyk_eronen_2010_rfc5869
  process_participations: []
  influences:
  - source_family_id: hmac_sha256
    relations:
    - related_to
    note: 'Both of HKDF''s two phases are HMAC invocations, generalized to any underlying hash function rather than
      SHA-256 specifically: extract computes PRK = HMAC(salt, IKM), then expand chains K(i) = HMAC(PRK, K(i-1) ||
      info || i) in feedback mode to stretch PRK to the requested output length.'
  notes: 'General-purpose (not password-specific -- distinguished from a pbkdf like PBKDF2 by having no deliberate
    slowness/memory-hardness) extract-then-expand key derivation function. The extract phase concentrates the
    (possibly non-uniform, e.g. a raw Diffie-Hellman value) entropy of input keying material into a single
    fixed-length pseudorandom key PRK via one HMAC call keyed with an optional non-secret salt; the expand phase
    then stretches PRK into as many output bits as needed (up to 255 times the hash''s output length) via a
    counter-chained sequence of further HMAC calls, each also bound to an optional context/application-specific
    "info" string. Krawczyk''s CRYPTO 2010 paper (hkdf_ref) both introduces this general extract-then-expand
    paradigm (building on his own earlier, less formal use of it in the IKE protocols) and proves HKDF''s security
    down to the extraction/pseudorandomness properties of HMAC itself; RFC 5869 (krawczyk_eronen_2010_rfc5869) is
    the IETF standardization used directly by TLS 1.3''s key schedule, Signal''s X3DH/Double Ratchet, and many other
    protocols.'
  authors:
  - Hugo Krawczyk
  year: 2010
  underlying_primitive_ids:
  - sha256_v1
  instances:
  - id: hkdf_v1
    name: HKDF
    type: kdf
    reference_ids: *id008
    characteristics:
      output_size_bits_min: 8
      output_size_bits_max: 65280
    notes: Characteristics shown for the common HMAC-SHA256 instantiation (RFC 5869's own worked example and test
      vectors) -- output_size_bits_max is 255 times the hash's output length (255*256 for SHA-256), per RFC 5869
      Section 2.3's L <= 255*HashLen bound; a different underlying hash changes this ceiling proportionally.
