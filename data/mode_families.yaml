  notes: 'MICKEY (Mutual Irregular Clocking KEYstream generator) is a hardware-oriented synchronous stream cipher by Babbage
    and Dodd (eSTREAM v1, 2005). Two 80-bit registers R (linear) and S (nonlinear) mutually clock each other irregularly based
    on CONTROL_BIT derived from their combined state. Output: z_i = r_0 ⊕ s_0 per clock. Key=80 bits, IV=0 to 80 bits (variable).
