  process_participations: []
  influences:
  - source_family_id: pasta_pi
    relations:
    - related_to
    note: 'Confirmed directly (Section 7, "Pasta Specification"): "Pasta is a family of stream ciphers which applies
      the Pasta-pi permutation under a nonce N and a block counter i to the secret key, followed by a truncation, to
      produce the final keystream." Enc_sk(m,N): c_i = m_i + left_t(Pasta-pi(sk,N,i)) -- i.e. the same
      encrypt-successive-counter-values-and-combine-with-plaintext shape as Counter Mode (see aes_ctr''s own
      rijndael edge for the same relation pattern), just built from a keyed permutation instead of a block cipher,
      and using field addition (mod p) instead of XOR to combine keystream with plaintext since Pasta operates over
      F_p rather than Z_2.'
  notes: 'Pasta (Dobraunig, Grassi, Helminger, Rechberger, Schofnegger, Walch, "Pasta: A Case for Hybrid
    Homomorphic Encryption," TCHES 2023) is the mode-tier stream cipher built around the Pasta-pi permutation
    (see that family for the permutation''s own internal round structure). Tagged ctr_mode (alongside its
    block_cipher_based root, matching how aes_ctr itself is tagged) even though Pasta-pi is typed `permutation`
    rather than `block_cipher` in this database: Pasta-pi takes the secret key as a direct input (unlike a sponge/
    duplex permutation, which does not), and is invoked once per nonce+counter pair to produce one keystream block,
    truncated and added to the corresponding plaintext block -- functionally identical to Counter Mode''s own
    encrypt-the-counter-and-XOR-with-plaintext shape, just over F_p with field addition standing in for XOR. No new
    mode_constructions.yaml taxonomy was needed to model this. Previously deferred in todo_manual.txt pending this
    tier decision.'
