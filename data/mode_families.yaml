  process_participations: []
  influences:
  - source_family_id: blake2
    relations:
    - improvement_of
    - same_round_function
    note: BLAKE3 derives its compression function from BLAKE2s, reduces it from ten to seven rounds, and replaces the message
      schedule with repeated application of one permutation.
  - source_family_id: blake
    relations:
    - inspired_by
    note: BLAKE3 remains in the BLAKE ARX lineage through BLAKE2 and its ChaCha-derived G function.
  innovative_ideas:
  - id: blake3_binary_tree_mode
    name: Fixed binary tree mode with parallel chunk processing
    note: Independent 1024-byte chunks form leaves; parent compression combines chaining values, enabling SIMD, multithreading,
      incremental verification, and unbounded XOF output.
  notes: BLAKE3 is a 2020 cryptographic hash, keyed hash, KDF, and XOF. It uses a seven-round BLAKE2s-derived compression
    function in a fixed binary tree and normally returns a 256-bit digest.
