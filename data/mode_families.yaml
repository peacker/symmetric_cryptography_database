- id: pi_cipher
  name: pi-Cipher
  notes: 'pi-Cipher (written as the Greek letter π) is a permutation-based AEAD scheme built on its own ARX-based
    "pi function" permutation, via a duplex-sponge variant the designers call the "triplex" construction. Four
    parameter sets vary the internal word size and target security level: Pi16Cipher096 (16-bit words, 96-bit
    security), Pi32Cipher128 (32-bit words, 128-bit security, the representative variant), Pi64Cipher128
    (64-bit words, 128-bit security), and Pi64Cipher256 (64-bit words, 256-bit security). Reached CAESAR round 2
    but was not selected for round 3.'
  construction_ids:
