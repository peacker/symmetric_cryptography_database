    IV). Internal state: 32×32-bit NLFSR (1024 bits) + 2×32-bit memory M (64 bits) = 1088 bits. Each clock step applies the
    invertible F function (initial mixing + S-box + final mixing), updates the NLFSR state, and outputs 64 bits of keystream.
