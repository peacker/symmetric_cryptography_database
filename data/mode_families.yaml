- id: aegis
  name: AEGIS
  notes: 'AEGIS drives an array of 128-bit state words directly with the AES encryption round function (SubBytes
    + ShiftRows + MixColumns + round-key XOR, minus the final-round MixColumns omission -- i.e. the same
    aes_round used to build a full AES instance, reused here as a keyed-permutation building block rather than
    invoking full 10/14-round AES as a black box) applied in parallel across the state each step, XORing in the
    message/associated-data block each step -- authentication and encryption share the same state update, so
    there is no separate MAC pass. AEGIS-128 keeps a 5-word (640-bit) state updated by 5 parallel AES rounds per
    16-byte block; AEGIS-256 a 6-word (768-bit) state via 6 AES rounds per 16-byte block, keyed with a 256-bit
    key for a higher security target; AEGIS-128L an 8-word (1024-bit) state via 8 AES rounds per 32-byte block, roughly doubling
    throughput at the cost of a larger state. CAESAR''s own final-portfolio report picked AEGIS-128 and AEGIS-128L
    for use case 2 (high-performance), with AEGIS-256 as an additional finalist for the same use case.'
  construction_ids:
