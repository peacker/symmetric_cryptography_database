- id: aez
  name: AEZ
  notes: 'AEZ ("Authenticated Encryption by Enciphering") builds a misuse-resistant AEAD by defining a
    tweakable, arbitrary-input-length "enciphering" scheme (a wide-block tweakable PRP keyed and tweaked by the
    nonce/associated-data/requested-expansion) and encrypting the plaintext concatenated with a fixed
    authentication block under it -- decryption failure (bad tag) is then simply "the deciphered redundancy
    block doesn''t match", giving automatic misuse resistance and arbitrary, user-selectable ciphertext expansion
    (including zero). Small messages use AEZ-tiny, a balanced-Feistel scheme; larger ones use an AES4-based
    enciphering core (AES4 = 4 rounds of the AES round function, chained; see the aez_aes4 family''s aes4/aes10
    instances) -- about 10 AES rounds per consecutive block pair, keeping AEZ''s cost close to AES-CTR. Reached
    CAESAR round 3 but was not selected for the final portfolio.'
