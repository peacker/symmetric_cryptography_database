- id: acorn
  name: ACORN
  notes: 'ACORN-128 is a bit-oriented NLFSR-based authenticated stream cipher: six concatenated LFSRs (293 bits
    total state) cross-feed into a nonlinear overall feedback bit (via maj/ch Boolean combining functions, the
    same nonlinear combiners used in SHA-1/SHA-2) and a nonlinear keystream/output-filter bit, so the individually
    linear shift registers are driven nonlinearly overall -- CAESAR''s own final-portfolio report for use case 1
    picked it as the lightweight second choice (after Ascon) specifically for its very low hardware footprint.
    128-bit key, 128-bit nonce, up to 128-bit tag (128 recommended). Encryption, associated-data absorption, and
    tag generation are all just further steps of the same single state-update function, driven by two control
    bits (ca/cb) that select which phase (AD/plaintext/finalization) is active at each step.'
