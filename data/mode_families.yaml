- id: scrypt
  name: scrypt
  notes: scrypt (Percival, BSDCan 2009; RFC 7914) is a sequential memory-hard password-based KDF that first derives a buffer
    via PBKDF2-HMAC-SHA256, expands and mixes it through ROMix (a sequential-memory-hard construction that fills and then
    randomly reads back a large array using BlockMix, itself built from repeated calls to the unmodified Salsa20/8 core
    permutation), and finally derives the output key via a second PBKDF2-HMAC-SHA256 pass over the mixed result.
