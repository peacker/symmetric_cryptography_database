  process_participations: []
  influences:
  - source_family_id: salsa20
    relations:
    - improvement_of
    - variant_of
    note: Forró redesigns the Salsa state update using lessons from differential-linear cryptanalysis and retains a 16-word
      ARX state.
  - source_family_id: chacha
    relations:
    - improvement_of
    - variant_of
    note: Forró targets better diffusion per round and a larger security margin than ChaCha while keeping its 256-bit-key,
      ARX stream-cipher setting.
  innovative_ideas:
  - id: forro_pollination
    name: Pollinating ARX subround schedule
    note: Each subround consumes outputs from the preceding operations so diffusion propagates between word groups more rapidly
      than in Salsa or ChaCha.
  notes: Forró is a 512-bit-state ARX stream cipher proposed at ASIACRYPT 2022. It uses a 256-bit key, 64-bit nonce, 64-bit
    counter, rotations 10/27/8, and recommends Forro14 or the faster Forro10 variant.
