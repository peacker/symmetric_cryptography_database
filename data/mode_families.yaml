    name: Smaller continuously-updated key-dependent tables for 128-bit security
    note: 'HC-128 uses two 512-entry 32-bit tables P and Q (16 KB total, half the HC-256 size), continuously updated via a
      nonlinear feedback function, providing 128-bit security with excellent software performance and a smaller memory footprint
      than HC-256.

      '
  notes: 'HC-128 is a synchronous stream cipher by Hongjun Wu; eSTREAM Phase 3, software profile. It is a 128-bit-security
    variant of HC-256. Internal state: two 512-entry 32-bit tables P and Q (32768 bits total). Each step updates one table
    entry with nonlinear feedback (using f1, f2, g1, g2 functions derived from SHA-256 message schedule operations and XOR/rotation),
    then outputs one 32-bit keystream word. Key=128 bits, IV=128 bits. Initialization expands key/IV into P and Q and runs
    1024 warm-up steps. Performance: ~3.05 cycles/byte on Pentium M.

    '
  instances:
