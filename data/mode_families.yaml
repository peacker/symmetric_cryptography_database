- id: espresso
  name: Espresso
  construction_ids:
  - native_keystream_generator
  round_ids:
  - espresso_round
  target_applications:
  - hardware
  - wireless
  - ultra_low_latency
  characteristics:
    state_size_bits: 256
    components:
    - id: nlfsr
      params:
        length: 256
    - id: and
    - id: xor
    - id: boolean_filter
      params:
        inputs: 20
        degree: 6
  reference_ids:
  - dubrova_hell_2017_espresso
  process_participations: []
  influences: []
  notes: 'Espresso (Dubrova, Hell; Cryptography and Communications 9(2):273-289, 2017, online-first 2015, also IACR
    eprint 2015/241) is a hardware-oriented stream cipher proposed by its authors for 5G wireless communication
    systems. It uses a single 256-bit non-linear feedback shift register (NLFSR) in the Galois configuration --
    rather than the paired LFSR+NLFSR structure of Grain/Trivium -- filtered by a 20-variable, algebraic-degree-6
    non-linear Boolean output function to produce one keystream bit per clock; key size 128 bits, IV size 96 bits.
    The Galois-configuration feedback is constructed (via a transformation method from Dubrova''s own prior work) to
    be equivalent to a maximum-length LFSR, guaranteeing period 2^256-1 while keeping the per-stage feedback small
    and low-propagation-delay for hardware. The paper reports Espresso as the fastest stream cipher below 1500 GE
    among those it compares against, including Grain-128 and Trivium. No lineage-qualifying influence edge to an
    earlier named stream cipher family in this database is recorded: the paper''s own related work was not
    accessible in full text for this entry (both SpringerLink and the IACR eprint mirror blocked automated
    retrieval), so no concrete "based on"/"derived from" language or shared component could be confirmed against
    the criteria this database requires for an influence edge; only benchmark-style comparisons to Grain-128 and
    Trivium were found in available secondary sources, which do not qualify.


    Despite the 5G framing, Espresso has seen very little independent citation or cryptanalytic adoption: Semantic
    Scholar records 73 citing papers as of this entry, while the publisher''s own SpringerLink citation-metrics
    figure is close to zero. The 5G framing itself is the authors'' own proposal for suitability, not evidence that
    Espresso was independently evaluated or adopted by any 5G standards body -- this distinction is recorded here
    as a caveat rather than as fact, since the exact wording of any specific claim in the paper about 5G
    consideration/adoption could not be verified against the paywalled full text.


    Independent analysis that has been carried out points the same way: Yao and Parampalli (2021, journal version
    of a 2019 preprint; see yao_parampalli_2021_espresso_like_cryptanalysis) show that the Galois NLFSR used in
    Espresso -- and in the wider class of "Espresso-like" ciphers built the same way -- can always be transformed
    back into an equivalent Fibonacci-configuration LFSR with a nonlinear output function, after which standard
    algebraic and Rønjom-Helleseth attacks break the transformed cipher; their preprint concludes verbatim that
    "this kind of design should be avoided in the future." Separately, Akhilesh, Singh, and Mishra (2024; see
    akhilesh_singh_mishra_2024_espresso_lstm) train LSTM and CNN models that effectively predict Espresso''s
    keystream, a second and independent cryptanalysis result. Given both results, this database records Espresso as
    a broken/weak design rather than a viable modern stream cipher, notwithstanding its original 5G-oriented
    performance pitch.


    Unconfirmed/not modeled here: the initialization (key/IV loading) clock count analogous to Trivium''s 1152 or
    Grain''s 160 warm-up clocks was not found in the secondary sources available for this entry and is deliberately
    omitted from the instance''s characteristics below rather than guessed.'
  instances:
  - id: espresso_v1
    name: Espresso
    type: enc
    reference_ids:
    - dubrova_hell_2017_espresso
    characteristics:
      key_size_bits: 128
      iv_size_bits: 96
      state_size_bits: 256
      block_size_bits: 1
      output_size_bits: 1
    notes: Baseline Espresso stream-cipher instance. Initialization/warm-up clock count not confirmed from the
      sources read for this entry; omitted rather than guessed.
