    relations:
    - inspired_by
    - variant_of
    note: 'NLSv2''s design traces through the SOBER lineage: Turing evolved from SOBER-t32, SOBER-128 reused Turing''s state-update
      function, and NLS (NLSv2''s immediate predecessor) is an improved, nonlinear-feedback version of SOBER-128.'
  innovative_ideas:
  - id: nlsv2_nlfsr_replaces_lfsr
    name: NLFSR replacing LFSR for improved algebraic security
    note: 'NLSv2 replaces the LFSR of SOBER-128 with a Nonlinear Feedback Shift Register (NLFSR), eliminating the guaranteed
      period but improving resistance to algebraic and distinguishing attacks that exploited the linear LFSR structure.

      '
  notes: 'NLSv2 (Non-Linear SOBER version 2) is a synchronous stream cipher by Hawkes et al., submitted to eSTREAM profile
    1A (software). It is an updated version of NLS, itself descended from the SOBER family (SOBER → SOBER-II → SOBER-t16/t32
    → Turing → SOBER-128 → NLS). Internal state: 512-bit NLFSR + 32-bit register ≈ 544 bits. Key up to 128 bits; nonce support
    for multi-message use. Output: 32-bit keystream words using a nonlinear filter combining addition, multiplication (mod
    2^32), and XOR. Also includes the Mundja MAC primitive for message authentication.

    '
