- id: mersenne_twister
  name: Mersenne Twister
  construction_ids:
  - native_keystream_generator
  round_ids:
  - mt19937_step
  target_applications:
  - software
  characteristics:
    state_size_bits: 19937
    components:
    - id: lfsr
      params:
        length: 19937
        note: twisted generalized-feedback-shift-register (TGFSR) recurrence over GF(2), period 2^19937-1 for the
          MT19937 parameterization
    - id: and
    - id: xor
    - id: shift_fixed
  reference_ids:
  - matsumoto_nishimura_1998_mersenne_twister
  process_participations: []
  influences: []
  notes: 'Mersenne Twister (Matsumoto & Nishimura, ACM TOMACS 1998) is a general-purpose pseudorandom number
    generator, not a cryptographic primitive -- the paper makes no security claims, only statistical-quality ones
    ("It passed several stringent statistical tests, including diehard"). Modeled here (mode tier, type prng) as
    the well-documented core generator that CryptMT3 (see cryptmt3 in this file) wraps with a cryptographic
    nonlinear filter to turn into a stream cipher; included in this database specifically to support that edge, not
    because MT itself is cryptographically secure. "A new algorithm named Mersenne Twister (MT) ... provides a
    super astronomical period of 2^19937-1 and 623-dimensional equidistribution up to 32 bits accuracy, while
    consuming a working area of only 624 words. This is a new variant of the previously proposed generators TGFSR,
    modified so as to admit a Mersenne-prime period." Generation: a linear recurrence x_{k+n} := x_{k+m} XOR
    ((x_k^upper | x_{k+1}^lower) A) over a 624-word (w=32-bit words) state, with a canonical parameter set
    MT19937 = (w,n,m,r) = (32, 624, 397, 31) and twist constant a = 0x9908B0DF. Each raw state word is then passed
    through an invertible linear "tempering" transform (shift/mask/XOR sequence with parameters u=11, s=7,
    b=0x9D2C5680, t=15, c=0xEFC60000, l=18) before being output, improving k-dimensional equidistribution without
    changing the period. Reference C implementation given directly in the paper (credited to Takuji Nishimura, with
    suggestions from Topher Cooper and Marc Rieffel). Local copy: references/1998-mersenne-twister.pdf.'
  instances:
  - id: mt19937
    name: MT19937
    type: prng
    reference_ids:
    - matsumoto_nishimura_1998_mersenne_twister
    characteristics:
      state_size_bits: 19937
      output_word_bits: 32
    notes: The canonical parameterization (w,n,m,r)=(32,624,397,31), twist constant a=0x9908B0DF, period 2^19937-1;
      624 32-bit words of state (19937 bits, i.e. 624*32-31 "wasted" high bits of the last word discounted per the
      paper's own state-size accounting).
