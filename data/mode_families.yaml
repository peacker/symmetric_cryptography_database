    type: hash
    reference_ids:
    - grassi_et_al_2021_poseidon
    characteristics: {}
    notes: Parameterized over the prime field, state width t (rate + capacity), and the numbers of full/partial rounds
      chosen per target security level; commonly instantiated over SNARK-friendly curve scalar fields such as
      BLS12-381 and BN254.
- id: starkad
  name: Starkad
  construction_ids:
  - sponge_construction
  - standard_sponge
  round_ids:
  - hadesmimc_full_round
  - hadesmimc_partial_round
  target_applications:
  - zero_knowledge
  underlying_primitive_ids:
  - hadesmimc_default
  characteristics:
    components:
    - id: power_map_sbox
      params: {exponent: 3}
    - id: cauchy_matrix
    - id: constant
  reference_ids:
  - grassi_et_al_2019_starkad_poseidon
  process_participations: []
  influences:
  - source_family_id: hadesmimc
    relations:
    - used_by
    note: 'Starkad-Hash is Starkad''s own sponge construction "instantiating a sponge construction with
      Starkad-Permutation," where Starkad-Permutation (Starkadπ) is explicitly the GF(2^n) (binary-extension-field)
      instantiation of the same HadesMiMC/HADES strategy permutation used, over GF(p), as Poseidonπ: "HadesMiMC ...
      works with texts of t >= 2 words in Fp or F2n" (Section 2.5-2.6). Same alternating full/partial-S-box-layer
      round structure and MDS diffusion as the keyed HadesMiMC block cipher, just over a binary extension field and
      used unkeyed.'
  notes: 'Starkad (Grassi, Kales, Khovratovich, Roy, Rechberger, Schofnegger, eprint 2019/458, "Starkad and
    Poseidon: New Hash Functions for Zero Knowledge Proof Systems") is Poseidon''s GF(2^n) sibling: a sponge hash
    built on the same HADES-strategy permutation (alternating full and partial power-map-S-box SPN rounds with an
    MDS/near-MDS linear layer) as Poseidon/HadesMiMC, but instantiated over a binary extension field F_2^n rather
    than a prime field, targeting STARK-friendly (AET-cost) proof systems rather than SNARK/R1CS ones: "our
    STARK-friendly hash Starkad wins by a factor of 4 over the hash function Friday by using a much smaller field."
    Uses the same three S-box choices as Poseidon (x^3, x^5, or x^-1), with the constraint that x^3 is only a
    permutation over GF(2^n) for odd n and x^5 only when 2^n != 1 mod 5 -- unlike Poseidon''s x^5 default, the
    paper''s primary Starkad instantiations use x^3 or x^-1. Concrete primary instantiation "Starkad-256": S-box
    x^3, security margin M=127, GF(2^63) via the irreducible polynomial p(x) = x^63+x+1 (n=63), state width t=24
    (N=n*t=1512), RF=8 full rounds + RP=48 partial rounds (R=2*RF+RP=64 total). Starkad was subsequently dropped
    from the final published Poseidon paper (grassi_et_al_2021_poseidon, USENIX Security 2021), which states
    plainly "we advice against using them" regarding Starkad and the x^-1 Poseidon variant -- this database records
    Starkad as originally specified rather than omitting it, since it is a real, citable, distinct design the
    authors themselves later walked back, not a fabricated one; see hadesmimc''s own notes (primitive_families.yaml)
    for that dismissal''s exact wording and context. Local copy: references/[2019][hadesmimc,starkad][][starkad_original_eprint].pdf (fetched
    via the Wayback Machine; eprint.iacr.org itself blocks automated fetching in this environment).'
  instances:
  - id: starkad_256
    name: Starkad-256
    type: hash
    reference_ids:
    - grassi_et_al_2019_starkad_poseidon
    characteristics:
      state_size_bits: 1512
      rounds: 64
    notes: 'Primary Starkad instantiation from Table 2/Section 5: S-box x^3, GF(2^63) (p(x)=x^63+x+1), t=24 words
      (63 bits each, N=1512), security margin M=127, RF=8 full-S-box rounds + RP=48 partial-S-box rounds (R=64
      total, matching R=2*RF+RP).'
