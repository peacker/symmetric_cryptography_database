- id: sha0_hash
  name: SHA-0
  construction_ids:
  - merkle_damgard
  round_ids:
  - sha0_round
  target_applications: []
  characteristics:
    block_size_bits: 512
    state_size_bits: 160
    components:
    - id: add_mod
      params:
        modulus: 4294967296
    - id: xor
    - id: rotation_fixed
    - id: and
    - id: or
    - id: not
    - id: constant
  reference_ids:
  - nist_1993_fips180_sha0
  process_participations: []
  influences:
  - source_family_id: sha0
    relations:
    - used_by
    note: SHA-0 is the Merkle-Damgård iteration of the SHA-0 compression function over arbitrary-length, padded input.
  - source_family_id: md4_hash
    relations:
    - inspired_by
    - improvement_of
    note: Mirrors the relationship between the underlying compression functions -- SHA-0 follows the MD4-style Merkle-Damgård
      lineage while expanding the state and compression function to 160 bits and 80 steps.
  notes: SHA-0 is the retrospective name for the hash function standardized in the original FIPS PUB 180 (1993). SHA-1 changed
    only the message expansion by rotating each newly derived schedule word left by one bit; SHA-0 omits that rotation. SHA-0
    is withdrawn and cryptographically broken.
  instances:
  - id: sha0_v1
    name: SHA-0
    type: hash
    reference_ids:
    - nist_1993_fips180_sha0
    characteristics:
      output_size_bits: 160
      block_size_bits: 512
      state_size_bits: 160
      rounds: 80
    notes: Original FIPS PUB 180 hash function, retrospectively named SHA-0.
- id: a5_1
  name: A5/1
  construction_ids:
  - native_keystream_generator
  round_ids:
  - a5_1_clock_step
  target_applications:
  - mobile
  - gsm
  characteristics:
    state_size_bits: 64
    components:
    - id: lfsr
      params:
        length: 19
    - id: lfsr
      params:
        length: 22
    - id: lfsr
      params:
        length: 23
    - id: and
    - id: or
    - id: xor
  reference_ids:
  - briceno_goldberg_wagner_1999_a5
  - biryukov_shamir_wagner_2000_a5_1
  - shah_mahalanobis_2012_a5_1
  process_participations: []
  influences: []
  innovative_ideas:
  - id: a5_1_majority_clocking
    name: Majority-controlled irregular clocking of three LFSRs
    note: On each cycle, only registers whose clock bit agrees with the majority of the three clock bits advance.
  notes: A5/1 is the stronger original GSM voice-encryption stream cipher, developed in 1987. A 64-bit session key and 22-bit
    frame number initialize three LFSRs of lengths 19, 22, and 23; after warm-up, their output bits are XORed to produce 228
    keystream bits per GSM frame. Its proprietary design became public through reverse engineering in 1999 and is now practically
    breakable.
  instances:
  - id: a5_1_gsm
    name: A5/1
    type: enc
    reference_ids:
    - briceno_goldberg_wagner_1999_a5
    - biryukov_shamir_wagner_2000_a5_1
    - shah_mahalanobis_2012_a5_1
    characteristics:
      key_size_bits: 64
      iv_size_bits: 22
      state_size_bits: 64
    notes: Produces two 114-bit GSM bursts (228 keystream bits) for each initialized frame state.
- id: a5_2
  name: A5/2
  construction_ids:
  - native_keystream_generator
  round_ids:
  - a5_2_clock_step
  target_applications:
  - mobile
  - gsm
  characteristics:
    state_size_bits: 81
    components:
    - id: lfsr
      params:
        length: 19
    - id: lfsr
      params:
        length: 22
    - id: lfsr
      params:
        length: 23
    - id: lfsr
      params:
        length: 17
    - id: and
    - id: or
    - id: xor
  reference_ids:
  - briceno_goldberg_wagner_1999_a5
  - barkan_biham_keller_2003_gsm
  - barkan_biham_keller_2008_gsm_joc
  process_participations: []
  influences:
  - source_family_id: a5_1
    relations:
    - variant_of
    - related_to
    note: A5/2 is a deliberately weakened export-oriented GSM alternative. It shares three register lengths with A5/1 but
      adds a fourth control register and a different nonlinear output function.
  notes: A5/2 was designed in 1992–1993 and completed in March 1993. It uses a 64-bit session key, 22-bit frame number, and
    four LFSRs totaling 81 state bits. It was intentionally designed as a weaker export algorithm. Practical attacks recover
    the session key from very little traffic; 3GPP prohibited its use after 2006.
  instances:
  - id: a5_2_gsm
    name: A5/2
    type: enc
    reference_ids:
    - briceno_goldberg_wagner_1999_a5
    - barkan_biham_keller_2003_gsm
    - barkan_biham_keller_2008_gsm_joc
    characteristics:
      key_size_bits: 64
      iv_size_bits: 22
      state_size_bits: 81
    notes: Deliberately weakened GSM export cipher; prohibited by 3GPP after practical key-recovery and downgrade attacks.
- id: salsa20_stream
  name: Salsa20
  construction_ids:
  - native_keystream_generator
  target_applications:
  - software
  reference_ids:
  - bernstein_2005_salsa20_spec
  - bernstein_2007_salsa20_family
  - bernstein_2008_salsa20_family_published
  - bernstein_2011_xsalsa20
  process_participations:
  - process_id: estream_competition_nist_2004_2008
    stage_ids:
    - phase_1
    - phase_2
    - phase_3
    - portfolio_sw
    status: portfolio
  influences:
  - source_family_id: salsa20
    relations:
    - used_by
    note: Salsa20's encryption function (Bernstein 2005 spec, Section 10) is the counter-mode stream-cipher construction
      built directly on the Salsa20 expansion function, reusing its round function and state layout unchanged.
  notes: 'Salsa20 is the variable-length stream cipher that Bernstein''s 2005 specification calls the "Salsa20 encryption
    function": it repeatedly invokes the Salsa20 expansion function (see the primitive-tier salsa20 family) over successive
    block-counter values and XORs the result with the plaintext, with no chaining between blocks. Salsa20/20 is the recommended
    variant; Salsa20/12 and Salsa20/8 are reduced-round variants that trade confidence for speed. XSalsa20 extends Salsa20
    from a 64-bit nonce to a 192-bit nonce through HSalsa20 subkey derivation.

    '
  instances:
  - id: salsa20_8
    name: Salsa20/8
    type: enc
    reference_ids:
    - bernstein_2005_salsa20_spec
    - bernstein_2007_salsa20_family
    characteristics:
      key_size_bits_min: 128
      key_size_bits_max: 256
      nonce_size_bits: 64
      rounds: 8
      block_size_bits: 512
      output_size_bits: 512
    notes: 8-round reduced variant, recommended by the designer for applications where speed matters more than confidence.
  - id: salsa20_12
    name: Salsa20/12
    type: enc
    reference_ids:
    - bernstein_2005_salsa20_spec
    - bernstein_2007_salsa20_family
    characteristics:
      key_size_bits_min: 128
      key_size_bits_max: 256
      nonce_size_bits: 64
      rounds: 12
      block_size_bits: 512
      output_size_bits: 512
    notes: 12-round reduced variant; eSTREAM's final report recommended Salsa20/12 as offering the best balance of speed
      and security margin.
  - id: salsa20_20
    name: Salsa20/20
    type: enc
    reference_ids:
    - bernstein_2005_salsa20_spec
    - bernstein_2007_salsa20_family
    characteristics:
      key_size_bits_min: 128
      key_size_bits_max: 256
      nonce_size_bits: 64
      rounds: 20
      block_size_bits: 512
      output_size_bits: 512
    notes: Full 20-round variant, recommended by the designer for typical cryptographic applications.
  - id: snuffle_2005
    name: Snuffle 2005
    type: enc
    reference_ids:
    - bernstein_2005_salsa20_spec
    characteristics:
      key_size_bits: 256
      nonce_size_bits: 64
      rounds: 20
      block_size_bits: 512
      output_size_bits: 512
    notes: Snuffle 2005 is the original eSTREAM-submission name for the Salsa20/20 encryption function.
  - id: xsalsa20
    name: XSalsa20
    type: enc
    reference_ids:
    - bernstein_2011_xsalsa20
    characteristics:
      key_size_bits: 256
      nonce_size_bits: 192
      rounds: 20
      block_size_bits: 512
      output_size_bits: 512
    notes: XSalsa20 uses HSalsa20 to derive a subkey, extending Salsa20 to a 192-bit nonce.
- id: gift_cofb
  name: GIFT-COFB
  construction_ids:
  - block_cipher_based
  - block_cipher_based_stream
  round_ids:
  - gift_round
  target_applications:
  - iot
  - constrained_hardware
  characteristics:
    components:
    - id: sbox
      params:
        input_bits: 4
        output_bits: 4
    - id: bit_permutation
    - id: xor
    - id: constant
    - id: field_matrix_mul
      params:
        field: GF(2^64)
        polynomial: x^64+x^4+x^3+x+1
  reference_ids:
  - banik_2019_gift_cofb
  process_participations:
  - process_id: lightweight_crypto_nist_2018_2023
    stage_ids:
    - round_1
    - round_2
    - finalist
    status: finalist
  influences:
  - source_family_id: gift
    relations:
    - used_by
    note: GIFT-COFB is a COFB-mode (COmbined FeedBack) AEAD construction built directly on the unmodified 40-round GIFT-128
      block cipher, a distinct 2019 paper and author team from the original 2017 GIFT design.
  notes: NIST LWC finalist authenticated-encryption mode wrapping the unmodified GIFT-128 block cipher in COFB mode; not a
    modification of GIFT itself.
  instances:
  - id: gift_cofb_v1
    name: GIFT-COFB v1.0
    type: aead
    reference_ids:
    - banik_2019_gift_cofb
    characteristics:
      key_size_bits: 128
      nonce_size_bits: 128
      tag_size_bits: 128
      state_size_bits: 192
    notes: 'Banik et al. 2019. COFB (COmbined FeedBack) mode on GIFT-128 (40-round bit-based SPN). n=128, key κ=128, nonce=128,
      tag τ=128. AEAD state overhead = 1.5n = 192 bits: Y=128 (block output) + Z=n/2=64 (feedback accumulator). Total including
      key: 1.5n+κ=320 bits. GIFT-128: 4-bit SubCells S-box, PermBits (128-bit permutation), AddRoundKey, 40 rounds. Field
      mult in F_2^64 (poly x^64+x^4+x^3+x+1). Inverse-free design.

      '
- id: rc4
  name: RC4
  construction_ids:
  - native_keystream_generator
  round_ids:
  - rc4_ksa
  - rc4_prga
  target_applications:
  - software
  - tls
  - wireless
  characteristics:
    components: []
  reference_ids:
  - rivest_1987_rc4
  process_participations: []
  influences: []
  notes: 'RC4 (Rivest Cipher 4) is a stream cipher using a key scheduling algorithm (KSA) followed by a pseudo-random generation
    algorithm (PRGA). Despite historical use in TLS and WEP, RC4 has known weaknesses and is deprecated for new applications.
    RC4 is not defined by an official standard.  It was originally a proprietary trade secret designed by  Ron Rivest for
    RSA Security in 1987. The algorithm was anonymously leaked to the internet in 1994 and  became broadly known as "Alleged
    RC4" (often abbreviated as ARC4 or ARCFOUR).

    '
  instances:
  - id: rc4_variable
    name: RC4 (Variable Key)
    type: enc
    characteristics:
      key_size_bits_min: 8
      key_size_bits_max: 2048
      block_size_bits: 1
      output_size_bits: 64
    notes: RC4 is a stream cipher with variable key size (1–256 bytes). The fixed_output_bits represents a standard 64-byte
      (512-bit) keystream unit. Output length is typically determined by application needs.
