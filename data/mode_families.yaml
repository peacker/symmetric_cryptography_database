  reference_ids:
  - fowler_1991_fnv1
  process_participations: []
  influences: []
  innovative_ideas:
  - id: fnv1_multiplicative_prime_mixing
    name: Multiply-then-XOR per byte with FNV_prime and non-zero offset_basis
    note: 'FNV-1 multiplies the n-bit accumulator by a carefully chosen prime (FNV_prime) and XOR-s in each input byte. The
      non-zero offset_basis (introduced over FNV-0) prevents trivial all-zero fixed points. 32-bit: FNV_prime=16777619, offset_basis=2166136261;
      64-bit: FNV_prime=1099511628211, offset_basis=14695981039346656037.

      '
  notes: 'FNV-1 is a non-cryptographic, non-Merkle-Damgård hash designed for speed and dispersion in hash tables and checksums.
    Output size n is a parameter (standard: 32, 64, 128, 256 bits); state = n-bit accumulator. Processes one byte at a time.
    FNV-1a is a variant that XOR-s before multiplying (same prime and offset_basis), providing slightly better dispersion
    for short inputs. Public domain.

    '
  instances:
  - id: fnv1_32
    name: FNV-1 (32-bit)
    type: hash
    reference_ids:
    - fowler_1991_fnv1
    characteristics:
      output_size_bits: 32
      state_size_bits: 32
    notes: '32-bit FNV-1: offset_basis=2166136261, FNV_prime=16777619 (2^24 + 2^8 + 0x93). State is a 32-bit accumulator.
      Per-byte step: hash = hash * FNV_prime; hash = hash XOR octet. No traditional block structure (processes one byte at
      a time). Non-cryptographic.

      '
  - id: fnv1_64
    name: FNV-1 (64-bit)
    type: hash
    reference_ids:
    - fowler_1991_fnv1
    characteristics:
      output_size_bits: 64
      state_size_bits: 64
    notes: '64-bit FNV-1: offset_basis=14695981039346656037, FNV_prime=1099511628211 (2^40 + 2^8 + 0xb3). State is a 64-bit
      accumulator. Per-byte step: hash = hash * FNV_prime; hash = hash XOR octet. Non-cryptographic.

      '
  - id: fnv1a_32
    name: FNV-1a (32-bit)
    type: hash
    reference_ids:
    - fowler_1991_fnv1
    characteristics:
      output_size_bits: 32
      state_size_bits: 32
    notes: '32-bit FNV-1a (XOR-then-multiply variant): same offset_basis and FNV_prime as FNV-1 32-bit. Per-byte step: hash
      = hash XOR octet; hash = hash * FNV_prime. Better dispersion than FNV-1 for short inputs. Non-cryptographic.

      '
