- id: stribob
  name: STRIBOB
  notes: 'STRIBOB is a sponge-based AEAD scheme (the BLNK sponge mode) built on a 512-bit permutation pi;
    STRIBOBr2 ("WHIRLBOB") re-derives pi directly from the Whirlpool hash function''s internal round structure
    and key schedule (same SubBytes/ShiftColumns/MixRows layers, renamed S/P/L), extended to 12 rounds (from
    Whirlpool''s own 10) for a larger security margin as an unkeyed permutation. Designed to share
    implementation resources with existing Whirlpool deployments. Reached CAESAR round 2 but was not selected
    for round 3.'
  construction_ids:
  - duplex_construction
  target_applications:
  - software
  - hardware
  characteristics:
