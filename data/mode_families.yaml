    type: stream_cipher
    characteristics:
      key_size_bits: 128
      nonce_size_bits: 128
      state_size_bits: 256
      output_word_bits: 32
    notes: 'LEX-128: AES-based stream cipher using 128-bit AES key and 128-bit IV. Outputs 4 bytes per AES round (leak extraction),
      40 bytes per AES invocation. eSTREAM submission. Key re-setup every 500 AES encryptions in the more secure variant.

      '
