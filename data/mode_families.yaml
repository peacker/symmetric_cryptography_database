- id: poet
  name: POET
  notes: 'POET is an online, nonce-misuse-resistant block-cipher AEAD mode: a plaintext block cipher layer (ECB
    mode) is chained together by two epsilon-AXU (almost-XOR-universal) hash layers, one before and one after,
    rather than the masked-block-cipher-pair approach AES-COPA/ELmD/COLM use. Its recommended instance uses
    full 10-round AES-128 for the block-cipher layer and a faster 4-round AES-128 for the two hashing layers.
    Reached CAESAR round 2 but was not selected for round 3.'
  construction_ids:
