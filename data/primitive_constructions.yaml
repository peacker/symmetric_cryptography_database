version: 1
primitive_constructions:
- id: spn
  name: Substitution-Permutation Network (SPN)
  abbreviation: SPN
  typical_primitive_types:
  - block_cipher
  placeholder_family_names:
  - Serpent
  - SKINNY
  notes: 'A round structure combining non-linear substitution layers with permutation or linear diffusion layers.

    '
- id: full_sbox_layer
  name: Full-State S-box Layer
  abbreviation: Full S-box
  special_case_of: spn
  typical_primitive_types:
  - block_cipher
  placeholder_family_names:
  - Rijndael
  - Serpent
  - PRESENT
  notes: 'An SPN whose substitution layer applies an S-box (or a small set of S-boxes) to every word/nibble/bit of the state
    each round, in contrast to a partial S-box layer. This is the S-box-coverage facet of the SPN taxonomy, orthogonal to
    the linear-layer-type facet (mds_linear_layer / bit_permutation_linear_layer / near_mds_arx_linear_layer) and to the
    tweakable_spn facet -- a family is tagged with one leaf from this facet plus one leaf from the linear-layer facet.

    '
- id: partial_sbox_layer
  name: Partial S-box Layer
  abbreviation: Partial S-box
  special_case_of: spn
  typical_primitive_types:
  - block_cipher
  placeholder_family_names:
  - LowMC
  notes: 'An SPN whose substitution layer applies an S-box to only some of the state''s words per round (not the full state),
    typically to minimize hardware area/gate count or to maximize resistance to algebraic attacks that scale with the total
    number of S-boxes (e.g. LowMC, designed for low multiplicative complexity in MPC/ZK/FHE settings). Orthogonal facet,
    see full_sbox_layer.

    '
- id: mds_linear_layer
  name: MDS Matrix Linear Layer
  abbreviation: MDS
  special_case_of: spn
  typical_primitive_types:
  - block_cipher
  placeholder_family_names:
  - Rijndael
  - SHARK
  notes: 'An SPN whose linear/diffusion layer multiplies the state by a Maximum Distance Separable (MDS) matrix over a finite
    field GF(2^n), guaranteeing an optimal branch number and rapid avalanche. Linear-layer-type facet, orthogonal to the
    S-box-coverage facet (full_sbox_layer / partial_sbox_layer) and to tweakable_spn.

    '
- id: alternating_full_partial_sbox_layer
  name: Alternating Full/Partial S-box Layer
  abbreviation: HADES
  special_case_of: spn
  typical_primitive_types:
  - block_cipher
  - permutation
  placeholder_family_names:
  - HadesMiMC
  - Poseidon
  notes: 'The HADES strategy (Grassi, Luftenegger, Rechberger, Rotaru, Schofnegger, "On a generalization of substitution-permutation
    networks: The HADES design strategy", EUROCRYPT 2020): an SPN whose rounds alternate between full S-box layers (applied
    to the whole state, at the start and end of the permutation, for resistance to statistical attacks analyzable via classical
    SPN theory) and partial S-box layers (applied to a single word of the state in between, to reduce cost while resisting
    algebraic attacks). A third S-box-coverage facet leaf, distinct from full_sbox_layer and partial_sbox_layer since it
    combines both within one design rather than using only one throughout.

    '
- id: bit_permutation_linear_layer
  name: Bit-Permutation Linear Layer
  abbreviation: Bit-perm
  special_case_of: spn
  typical_primitive_types:
  - block_cipher
  placeholder_family_names:
  - PRESENT
  - GIFT
  notes: 'An SPN whose linear/diffusion layer simply rewires bits to new positions with no arithmetic mixing. Offers ultra-low
    latency/gate-count in hardware but requires more rounds to reach a comparable security margin to an MDS-based layer.
    Linear-layer-type facet (see mds_linear_layer); replaces the earlier flat bit_based_spn tag.

    '
- id: near_mds_arx_linear_layer
  name: Near-MDS / ARX-like Linear Layer
  abbreviation: Near-MDS/ARX
  special_case_of: spn
  typical_primitive_types:
  - block_cipher
  placeholder_family_names:
  - FOX
  - IDEA NXT
  notes: 'An SPN whose linear/diffusion layer uses a lighter-weight matrix (branch number below the MDS optimum) or an XOR/rotation-heavy
    mixing layer, striking a middle ground between pure bit-permutation and full finite-field MDS arithmetic. Linear-layer-type
    facet (see mds_linear_layer).

    '
- id: bitslice_friendly_spn
  name: Bitslice-Friendly SPN
  abbreviation: Bitslice SPN
  special_case_of: spn
  typical_primitive_types:
  - permutation
  - block_cipher
  placeholder_family_names:
  - Keccak
  - Ascon
  - Xoodoo
  - Gimli
  notes: 'A third facet, orthogonal to S-box coverage and linear-layer type: an SPN whose small nonlinear layer (Keccak''s
    5-bit chi step, Ascon''s 5-bit S-box, Xoodoo''s 3-bit S-box, Gimli''s 3-input T-function) is defined directly as a
    small Boolean circuit rather than a table lookup. For Keccak/Ascon/Xoodoo/Gimli this coincides with the
    boolean_operator_network tag at the operation level (all four also carry that tag, or its pure_and_rx child where
    strictly AND-only) -- the same few-gate circuit described from two angles, S-box-shaped here and operation-shaped
    there, not competing classifications. Not intended for designs whose S-box merely admits a bitslice
    *implementation* via a complex derived circuit (e.g. AES''s tower-field S-box, ~100+ gates) -- this facet is for
    S-boxes natively defined as a handful of gates.

    '
- id: feistel
  name: Feistel Network
  abbreviation: FN
  typical_primitive_types:
  - block_cipher
  placeholder_family_names:
  - DES
  - Camellia
  notes: 'A structure that updates one half of the state using a round function of the other half and then swaps roles between
    the halves.

    '
- id: balanced_feistel
  name: Balanced (Classical) Feistel Network
  abbreviation: Feistel
  special_case_of: feistel
  typical_primitive_types:
  - block_cipher
  placeholder_family_names:
  - DES
  - Camellia
  - Blowfish
  notes: 'The classical two-branch Feistel network: the state is split into exactly two equal-size halves, and each round
    applies a single round function F to one half and XORs the result into the other before swapping. Formalized as the
    basic case of Feistel[n] by Hoang and Rogaway (''On Generalized Feistel Networks'', CRYPTO 2010), and distinguished
    here from the generalized/unbalanced/alternating variants, all of which depart from this two-equal-branch structure.

    '
- id: algebraic_feistel
  name: Algebraic (Native-Field) Feistel Network
  abbreviation: Alg-FN
  special_case_of: feistel
  typical_primitive_types:
  - block_cipher
  placeholder_family_names:
  - GMiMC
  - MiMC
  notes: 'A Feistel-like network whose branches are elements of a large prime field GF(p) or binary extension field GF(2^n)
    (rather than bit-strings) and whose round function is a low-degree algebraic map (see power_map_sbox) such as x^3,
    designed to minimize multiplicative complexity for MPC/SNARK/STARK/FHE settings rather than gate count. Covers both
    balanced (Feistel-MiMC) and unbalanced/expanding (GMiMC-erf) instantiations described in a single design paper (Albrecht
    et al., "Feistel Structures for MPC, and More", ESORICS 2019); kept as one level-2 leaf rather than mirroring the
    classical balanced/unbalanced split, since the distinguishing feature here is the native-field algebraic round function,
    not the branch-size symmetry.

    '
- id: generalized_feistel
  name: Generalized Feistel Network
  abbreviation: GFN
  special_case_of: feistel
  typical_primitive_types:
  - block_cipher
  placeholder_family_names:
  - CLEFIA
  - CAST-256
  notes: 'A Feistel-like structure with more than two branches or a more general branch-update schedule.

    '
- id: type1_generalized_feistel
  name: Type-1 Generalized Feistel Network
  abbreviation: Type-1 GFN
  special_case_of: feistel
  typical_primitive_types:
  - block_cipher
  placeholder_family_names:
  - CAST-256
  - MacGuffin
  notes: 'Zheng, Matsumoto, and Imai''s Type-1 GFN (CRYPTO ''89), formalized as Feistel1[k, n] by Hoang and Rogaway (''On
    Generalized Feistel Networks'', CRYPTO 2010): the state is split into k > 2 sub-blocks arranged in a cycle, and a single
    round function is applied to one sub-block and XORed into its neighbor before a cyclic shift of the sub-blocks -- only
    one sub-block is transformed per round, so k rounds are needed for every sub-block to be updated once. Hoang and Rogaway
    name CAST-256 as the running example of a cipher using this structure.

    '
- id: type2_generalized_feistel
  name: Type-2 Generalized Feistel Network
  abbreviation: Type-2 GFN
  special_case_of: feistel
  typical_primitive_types:
  - block_cipher
  placeholder_family_names:
  - CLEFIA
  - RC6
  - HIGHT
  notes: 'Zheng, Matsumoto, and Imai''s Type-2 GFN (CRYPTO ''89), formalized as Feistel2[k, n] by Hoang and Rogaway (''On
    Generalized Feistel Networks'', CRYPTO 2010): the state is split into k > 2 sub-blocks, and k/2 independent round functions
    are applied in parallel each round (each covering a pair of sub-blocks), followed by a cyclic shift. Hoang and Rogaway
    name RC6 as the running example of a cipher using this structure.

    '
- id: type3_generalized_feistel
  name: Type-3 Generalized Feistel Network
  abbreviation: Type-3 GFN
  special_case_of: feistel
  typical_primitive_types:
  - block_cipher
  placeholder_family_names:
  - MARS (core)
  notes: 'Zheng, Matsumoto, and Imai''s Type-3 GFN (CRYPTO ''89), formalized as Feistel3[k, n] by Hoang and Rogaway (''On
    Generalized Feistel Networks'', CRYPTO 2010): the state is split into k > 2 sub-blocks, and k-1 round functions are
    applied in parallel each round, each one taking one sub-block as input and XORing its output into the next sub-block,
    followed by a cyclic shift. Hoang and Rogaway name MARS''s cryptographic core as the running example of a cipher using
    this structure.

    '
- id: type4_generalized_feistel
  name: Type-4 Generalized Feistel Network
  abbreviation: Type-4 GFN
  special_case_of: feistel
  typical_primitive_types:
  - block_cipher
  notes: 'Introduced by Hoang and Rogaway (''On Generalized Feistel Networks'', CRYPTO 2010, Fig. 6 of the full/revised
    version) purely as the network whose forward direction has the same NCPA security as the inverse of a Type-1 GFN: a
    single round function is applied to one sub-block and XORed into its neighbor, exactly as in Type-1, but the cyclic
    shift of the k sub-blocks runs in the opposite direction/offset. No block cipher is known to use Type-4 GFN directly
    as its native design structure -- it exists solely as a proof device for characterizing Type-1''s inverse.

    '
- id: type5_generalized_feistel
  name: Type-5 Generalized Feistel Network
  abbreviation: Type-5 GFN
  special_case_of: feistel
  typical_primitive_types:
  - block_cipher
  notes: 'Introduced by Hoang and Rogaway (''On Generalized Feistel Networks'', CRYPTO 2010, Fig. 6 of the full/revised
    version) purely as the network whose forward direction has the same NCPA security as the inverse of a Type-3 GFN: unlike
    Type-3''s k-1 round functions applied in parallel to the unmodified sub-blocks, Type-5 chains them -- each round function
    consumes the previous round function''s just-computed output rather than the original sub-block -- before a cyclic
    shift. No block cipher is known to use Type-5 GFN directly as its native design structure -- it exists solely as a
    proof device for characterizing Type-3''s inverse.

    '
- id: unbalanced_feistel
  name: Unbalanced Feistel Network
  abbreviation: UFN
  special_case_of: feistel
  typical_primitive_types:
  - block_cipher
  placeholder_family_names:
  - Skipjack
  notes: 'A Feistel network whose round function F: {0,1}^n -> {0,1}^m has n != m, so the two halves being combined are
    of different sizes -- described by Schneier and Kelsey (''Unbalanced Feistel Networks and Block Cipher Design'', FSE
    1996) and formalized as Feistel[m, n] by Hoang and Rogaway (''On Generalized Feistel Networks'', CRYPTO 2010), who name
    Skipjack as the running example of a cipher using this structure. The round function is called contracting when n
    > m and expanding when n <= m.

    '
- id: unbalanced_numeric_feistel
  name: Unbalanced Numeric Feistel Network
  abbreviation: UFN#
  special_case_of: feistel
  typical_primitive_types:
  - block_cipher
  notes: 'The numeric variant of an unbalanced Feistel network: instead of splitting a bit-string into two halves, it enciphers
    a number x = aN + b in Z_(MN) using a round function F: Z_N -> Z_M and modular addition in place of xor. Formalized
    as Feistel#[M, N] by Hoang and Rogaway (''On Generalized Feistel Networks'', CRYPTO 2010); used in format-preserving-encryption
    modes of operation such as the NIST FFX proposal and the Thorp-shuffle-based card-shuffling technique, rather than
    in any fixed-width block cipher in this database.

    '
- id: source_heavy_unbalanced_feistel
  name: Source-Heavy Unbalanced Feistel Network
  abbreviation: SUFN
  special_case_of: feistel
  typical_primitive_types:
  - block_cipher
  placeholder_family_names:
  - Skipjack
  notes: 'An unbalanced Feistel network (Schneier/Kelsey) whose round function reads from a larger source block than the
    (smaller) target block it updates, exposing more state to the round function per round at the cost of needing more
    rounds for full diffusion -- equivalent to what Hoang and Rogaway call the contracting case (n > m) of Feistel[m, n].

    '
- id: target_heavy_unbalanced_feistel
  name: Target-Heavy Unbalanced Feistel Network
  abbreviation: TUFN
  special_case_of: feistel
  typical_primitive_types:
  - block_cipher
  placeholder_family_names:
  - MacGuffin
  notes: 'An unbalanced Feistel network (Schneier/Kelsey) whose round function updates a larger target block from a smaller
    source block, mixing more state per round than a balanced Feistel network at the cost of a weaker per-round round-function-to-state
    ratio -- equivalent to what Hoang and Rogaway call the expanding case (n <= m) of Feistel[m, n].

    '
- id: alternating_feistel_network
  name: Alternating Feistel Network
  abbreviation: AFN
  special_case_of: feistel
  typical_primitive_types:
  - block_cipher
  placeholder_family_names:
  - BEAR/LION
  notes: 'A Feistel network whose rounds alternate between a contracting Feistel(m, n) permutation (odd rounds) and an
    expanding Feistel(n, m) permutation (even rounds), described by Anderson and Biham (''Two Practical and Provably Secure
    Block Ciphers: BEAR and LION'', FSE 1996) and by Lucks (''Faster Luby-Rackoff Ciphers'', FSE 1996), and formalized
    as FeIsTeL[m, n] by Hoang and Rogaway (''On Generalized Feistel Networks'', CRYPTO 2010), who name BEAR/LION as the
    running example of a cipher using this structure -- there it wraps a hash function (contracting round) and a stream
    cipher (expanding round) around each other rather than using a small pseudorandom round function.

    '
- id: alternating_numeric_feistel
  name: Alternating Numeric Feistel Network
  abbreviation: AFN#
  special_case_of: feistel
  typical_primitive_types:
  - block_cipher
  notes: 'The numeric variant of an alternating Feistel network: rounds alternate between numeric Feistel (M, N) and (N,
    M) permutations over Z_(MN) instead of bit-strings. Formalized as FeIsTeL#[M, N] by Hoang and Rogaway (''On Generalized
    Feistel Networks'', CRYPTO 2010); used in format-preserving-encryption modes of operation such as the NIST FFX proposal,
    rather than in any fixed-width block cipher in this database.

    '
- id: nested_feistel_network
  name: Nested (Recursive) Feistel Network
  abbreviation: NFN
  special_case_of: feistel
  typical_primitive_types:
  - block_cipher
  placeholder_family_names:
  - MISTY1
  - KASUMI
  notes: 'A Feistel network whose own round function is internally a smaller Feistel network (MISTY''s FO/FI functions),
    giving a provable-security argument via recursive application of Luby-Rackoff-style bounds.

    '
- id: lay_massey
  name: Lay-Massey Scheme
  abbreviation: LM
  typical_primitive_types:
  - block_cipher
  placeholder_family_names:
  - IDEA
  - FOX
  notes: 'A two-branch structure where the same mixing function perturbs both halves in a symmetric manner.

    '
- id: even_mansour
  name: Even-Mansour Construction
  abbreviation: EM
  typical_primitive_types:
  - block_cipher
  - permutation
  placeholder_family_names:
  - PRINCE
  - LED
  notes: 'A key-alternating construction built around one or more public permutations with key addition before and after permutation
    calls.

    '
- id: davies_meyer
  name: Davies-Meyer Construction
  abbreviation: DM
  typical_primitive_types:
  - compression_function
  placeholder_family_names:
  - MDC-2
  - Whirlpool-compression
  notes: 'A one-block-length compression-function construction derived from a block cipher by XORing the block-cipher output
    with the input chaining value.

    '
- id: matyas_meyer_oseas
  name: Matyas-Meyer-Oseas Construction
  abbreviation: MMO
  typical_primitive_types:
  - compression_function
  placeholder_family_names:
  - Miyaguchi-Preneel-variants
  - Snefru-style-compression
  notes: 'A one-block-length compression-function construction derived from a block cipher, closely related to Davies-Meyer
    but using a different assignment of message and chaining value roles.

    '
- id: arx_permutation_network
  name: ARX Network
  abbreviation: ARX-PN
  typical_primitive_types:
  - permutation
  - block_cipher
  - stream_cipher
  placeholder_family_names:
  - Salsa
  - ChaCha
  - RC5
  notes: 'A round-based structure built primarily from modular addition, XOR, and fixed or data-dependent rotations.

    '
- id: data_dependent_rotation_arx
  name: Data-Dependent Rotation ARX
  special_case_of: arx_permutation_network
  typical_primitive_types:
  - block_cipher
  notes: 'The rotation amount depends on the data itself rather than being fixed at compile time -- the defining trait
    RC5 introduced and later designs (Akelarre, Raiden) reused.

    '
- id: fixed_rotation_arx
  name: Fixed-Rotation ARX
  special_case_of: arx_permutation_network
  typical_primitive_types:
  - permutation
  - block_cipher
  - stream_cipher
  notes: 'Rotation amounts are compile-time constants, identical on every invocation regardless of the data -- the majority
    case among ARX designs, and thus a weak lineage signal on its own: treat derived edges on this leaf as lower-confidence
    than data_dependent_rotation_arx, whose rarity makes shared use a much stronger signal.

    '
- id: modadd_key_injection_arx
  name: Modular-Addition Key Injection
  special_case_of: arx_permutation_network
  notes: 'The round subkey (or round message word) is mixed into the state via modular addition rather than XOR.

    '
- id: xor_key_injection_arx
  name: XOR Key Injection
  special_case_of: arx_permutation_network
  notes: 'The round subkey is mixed into the state via XOR rather than modular addition. Designs that deliberately alternate
    both operators by round or branch (e.g. HIGHT) are left untagged on this facet rather than forced onto one side.

    '
- id: pure_arx_no_constants
  name: Constant-Free ARX
  special_case_of: arx_permutation_network
  notes: 'The repeated round function injects no round-index-dependent constant; any constant present is confined to
    one-time key/IV setup rather than the loop body. Constant-free ARX rounds are more exposed to rotational cryptanalysis.

    '
- id: arx_with_round_constants
  name: ARX with Round Constants
  special_case_of: arx_permutation_network
  notes: 'The repeated round function injects a round-index-dependent constant on every iteration, breaking slide and
    rotational symmetry. This is now common enough among ARX designs that shared use is a weak lineage signal on its
    own -- treat derived edges on this leaf as lower-confidence than the other ARX facets.

    '
- id: arx_based_spn
  name: ARX-based SPN
  special_case_of: arx_permutation_network
  notes: 'The ARX analogue of the wide-trail strategy: a keyless, cryptographically strong ARX-box alternated with a
    linear diffusion layer, with provable bounds on differential/linear trails. Explicitly named and defined in the
    SPARX design paper; SPARKLE''s own spec explicitly calls itself SPARX''s descendant.

    '
- id: boolean_operator_network
  name: Boolean-Operator Network
  abbreviation: Bool-Op
  typical_primitive_types:
  - permutation
  - block_cipher
  - aead
  placeholder_family_names:
  - Keccak
  - Ascon
  - Xoodoo
  - NORX
  notes: 'Level-1 root: a round-based structure whose nonlinearity and diffusion are built entirely from elementary
    bitwise Boolean operations (AND/NAND, OR/NOR, XOR, NOT) combined with fixed or data-dependent rotations, plain
    shifts, or bit permutations -- no modular addition (which would make it ARX instead) and no table-lookup S-box
    whose circuit isn''t itself just a handful of these same gates. Deliberately broader than the and_rx/AND-RX
    naming this replaces: several well-known members mix in operations beyond a strict AND+XOR+rotation reading of
    "AND-RX" -- Keccak/Ascon/Xoodoo''s chi step also uses NOT, Gimli''s T-function also uses OR, and NORX''s G
    function uses a fixed shift (not a rotation) in place of ChaCha''s modular addition. See pure_and_rx below for
    the strict subset that really is just AND+XOR+fixed-rotation. Families whose nonlinear layer is also expressible
    as a small S-box (Keccak/Ascon/Xoodoo/Gimli) legitimately carry both this tag and spn''s bitslice_friendly_spn
    facet at once -- the two describe the same few-gate circuit from two different angles (operation-level vs.
    S-box-coverage/linear-layer-type), not competing classifications.

    '
- id: pure_and_rx
  name: Pure AND-RX
  abbreviation: AND-RX
  special_case_of: boolean_operator_network
  typical_primitive_types:
  - permutation
  - block_cipher
  notes: 'A round-based structure built from bitwise AND (or NAND) as its only nonlinear operation, combined with XOR
    and fixed rotations only -- no OR, no NOT beyond incidental linear use, no plain (non-rotating) shifts, no modular
    addition, and no table-lookup S-boxes. The narrow case this database originally called "AND-RX" (e.g. Simon''s
    and Simeck''s round functions); families that add OR, NOT-as-a-listed-operation, or shifts instead of rotation
    (Keccak, Ascon, Xoodoo, NORX, ...) belong at the broader boolean_operator_network root instead.

    '
- id: stream_state_update_generator
  name: Stream State-Update Generator
  abbreviation: SSUG
  typical_primitive_types:
  - stream_cipher
  placeholder_family_names:
  - RC4
  notes: 'A keystream design based on repeated state updates and output extraction, typically with separate key scheduling
    and generation phases.

    '
- id: lfsr_nlfsr_register_network
  name: LFSR/NLFSR Register Network
  abbreviation: LRN
  typical_primitive_types:
  - block_cipher
  - stream_cipher
  placeholder_family_names:
  - KATAN
  - KTANTAN
  notes: 'A bit-oriented structure driven by linear and nonlinear feedback-shift register style state transitions and boolean
    mixing.

    '
- id: key_dependent_table_network
  name: Key-Dependent Table Network
  abbreviation: KDTN
  typical_primitive_types:
  - block_cipher
  placeholder_family_names:
  - FROG
  - HPC
  notes: 'A construction where round behavior is driven by key-derived tables or key-dependent substitution/permutation components.

    '
- id: heterogeneous_round_network
  name: Heterogeneous Round Network
  abbreviation: HRN
  typical_primitive_types:
  - block_cipher
  placeholder_family_names:
  - MARS
  notes: 'A mixed-structure block-cipher design combining distinct round phases and multiple transformation styles within
    one cipher.

    '
- id: tweakable_spn
  name: Tweakable Substitution-Permutation Network
  abbreviation: TSPN
  special_case_of: spn
  typical_primitive_types:
  - tweakable_block_cipher
  placeholder_family_names:
  - BipBip
  - SCARF
  - Blink
  - ChiLow
  notes: 'An SPN-style design with explicit tweak influence in round processing, often optimized for lightweight or memory-encryption
    settings.

    '
- id: coupled_counter_system
  name: Coupled Counter System
  typical_primitive_types:
  - stream_cipher
  notes: >
    A keystream generator whose registers are counters that update or clock
    each other (rather than being independently clocked and only combined
    at the output), so the coupling itself is part of the source of
    non-linearity, distinct from a plain filtered or combined register.
    No family in this database is currently tagged with this leaf.
- id: filtered_fcsr
  name: Filtered FCSR
  typical_primitive_types:
  - stream_cipher
  notes: >
    A single fcsr (Feedback with Carry Shift Register) whose output is
    passed through a nonlinear or linear filtering function of several
    cells, analogous to filtered_lfsr but using carry-propagating (2-adic)
    feedback instead of pure XOR feedback -- providing resistance to the
    Berlekamp-Massey-style algebraic attacks that break a plain filtered
    LFSR. F-FCSR (f_fcsr) is the family currently modeled with this
    mechanism, tagged via its fcsr and linear_filter components.
- id: filtered_lfsr
  name: Filtered LFSR
  typical_primitive_types:
  - stream_cipher
  notes: >
    The classical LFSR-based keystream generator: a single (typically
    maximum-length) LFSR whose state is passed through a fixed nonlinear
    Boolean filtering function of several tap positions to produce each
    output bit, hiding the register's otherwise fully linear/predictable
    sequence. No family in this database is currently tagged with this
    root directly (see filtered_lfsr_with_decimation and its children for
    the decimating variants that are).
- id: filtered_lfsr_with_decimation
  name: Filtered LFSR with Decimation
  typical_primitive_types:
  - stream_cipher
  notes: >
    A filtered-LFSR variant that additionally decimates -- irregularly
    selects, discards, or re-clocks -- its output or a second register's
    output, rather than applying only a static Boolean filter every cycle.
    See shrinking_generator and self_shrinking_generator below for the two
    canonical instances of this idea.
- id: shrinking_generator
  name: Shrinking Generator
  special_case_of: filtered_lfsr_with_decimation
  notes: Coppersmith, Krawczyk, and Mansour (CRYPTO 1993); a control LFSR irregularly decimates the output of a second, data
    LFSR — the data bit is kept only when the corresponding control bit is 1.
- id: self_shrinking_generator
  name: Self-Shrinking Generator
  special_case_of: filtered_lfsr_with_decimation
  notes: Meier and Staffelbach (EUROCRYPT 1994); a single LFSR decimates its own output in pairs, removing the need for a
    second control register used by the two-register Shrinking Generator.
- id: gufn
  name: Generalized Unbalanced Feistel Network (GUFN)
  abbreviation: GUFN
  special_case_of: feistel
  typical_primitive_types:
  - block_cipher
  placeholder_family_names:
  - MacGuffin
  notes: 'A generalized Feistel network (more than two sub-blocks) in which the sub-blocks are not all the same size,
    combining the multi-branch structure of a GFN with the source/target size asymmetry of an unbalanced Feistel network.

    '
- id: irregular_clock_register_pair
  name: Irregular Clock Register Pair
  typical_primitive_types:
  - stream_cipher
  notes: >
    A keystream generator built from two or more LFSRs/registers where one
    register's state (or a majority/threshold function of several
    registers) irregularly controls whether/how the others are clocked,
    producing a nonlinear, variable-rate combination -- the class
    containing designs like the Alternating Step Generator and A5/1's
    majority-clocked registers. No family in this database is currently
    tagged with this leaf.
- id: lfsr_over_extension_field_with_memory
  name: LFSR over Extension Field with Memory
  typical_primitive_types:
  - stream_cipher
  notes: >
    An LFSR defined over a finite extension field GF(2^n) (word-based
    rather than bit-based linear feedback) augmented with extra internal
    memory/state beyond the shift register itself, whose nonlinear update
    is what breaks the LFSR's own linearity -- the class containing
    word-oriented designs like SNOW and Sosemanuk. No family in this
    database is currently tagged with this leaf.
- id: nlfsr_combiner
  name: NLFSR Combiner
  typical_primitive_types:
  - stream_cipher
  notes: >
    A keystream generator combining the outputs of two or more distinct
    NLFSRs (nonlinear feedback shift registers) via a further nonlinear
    Boolean function, rather than filtering taps from a single register
    (see nlfsr_filtered) or combining LFSR and NLFSR taps together (see
    nlfsr_lfsr_filter). No family in this database is currently tagged
    with this leaf.
- id: nlfsr_lfsr_filter
  name: NLFSR/LFSR Filter
  typical_primitive_types:
  - stream_cipher
  notes: >
    A keystream generator combining at least one NLFSR and at least one
    LFSR, filtered through a joint nonlinear Boolean function of taps from
    both -- a hybrid of the pure filtered_lfsr and nlfsr_combiner patterns.
    No family in this database is currently tagged with this leaf.
- id: self_reciprocal_spn
  name: Self-Reciprocal SPN
  special_case_of: spn
  typical_primitive_types:
  - block_cipher
  - tweakable_block_cipher
  placeholder_family_names:
  - MANTIS
  - PRINCEv2
  - 3-Way
  - Anubis
  - Khazad
  notes: >
    An SPN whose overall structure is an involution (or made one via a
    "reflection" construction): decryption reuses the same circuit/round
    sequence as encryption, either because every round component is
    individually self-inverse (3-Way's near-involutive round structure per
    Daemen's own design rationale, and the same "make every component an
    involution" strategy in Anubis, Khazad, NOEKEON, and ICEBERG) or because
    the whole cipher mirrors its rounds around a central reflection layer so
    that decrypting under key k equals encrypting under
    a related key (the PRINCE/MANTIS/PRINCEv2 "reflection cipher" family,
    Borghoff et al., "PRINCE," ASIACRYPT 2012). Halves the implementation
    cost of supporting both encryption and decryption in hardware. A second,
    earlier lineage reaches the same property by building every round
    component itself as an involution rather than reflecting the whole
    cipher around a central layer -- the Wide Trail "involutional cipher"
    tradition (Square, Anubis, Khazad, BKSQ's involutional successor
    Curupira-1, ARIA), where this database's own construction/innovative-
    idea notes for each family already use "involutional"/"self-reciprocal"
    interchangeably with this leaf's own name.
- id: t_function
  name: T-Function
  typical_primitive_types:
  - stream_cipher
  - permutation
  placeholder_family_names:
  - VMPC
  notes: >
    A design built around a "triangular function" in the sense of Klimov
    and Shamir ("A New Class of Invertible Mappings," CHES 2002): output
    bit i depends only on input bits 0..i, which guarantees the whole
    n-bit-word map is a bijection by construction regardless of which
    arithmetic/logical operations (addition, multiplication, AND, OR, XOR)
    are combined to build it, without a separate S-box or explicit
    permutation step. Distinct from (but the namesake of) the
    characteristics-tier `t_function` component, which records a single
    such operation used within a round rather than classifying the whole
    design.
- id: table_driven_prf
  name: Table-Driven PRF
  typical_primitive_types:
  - stream_cipher
  notes: >
    A pseudorandom function/generator whose nonlinearity comes from one or
    more large lookup tables built or keyed at setup time and indexed by
    the running state, rather than a small fixed S-box evaluated every
    round -- e.g. RC4-family designs, whose internal permutation state
    array is itself the "table". No family in this database is currently
    tagged with this specific leaf (see lookup_table in components.yaml for
    the corresponding component-level tag already applied to several
    families).
- id: table_update_stream
  name: Table-Update Stream
  typical_primitive_types:
  - stream_cipher
  notes: >
    A stream cipher whose state is itself a large table/array that is
    continuously permuted/updated as keystream is produced (as in RC4's
    internal S array), rather than a fixed-size register that is filtered
    or combined by a separate function. No family in this database is
    currently tagged with this specific leaf.
- id: nlfsr_filtered
  name: NLFSR with Nonlinear Filter
  typical_primitive_types:
  - stream_cipher
  notes: >
    An NLFSR (nonlinear feedback shift register) whose output is
    additionally passed through a further nonlinear Boolean filtering
    function of several taps, rather than reading a single cell directly --
    stacking the register's own nonlinear feedback with a separate output
    filter. No family in this database is currently tagged with this leaf
    (Grain filters both an LFSR and an NLFSR jointly, which is why it is
    tagged via the boolean_filter component rather than this leaf).
- id: modular_multiplication_network
  name: Modular Multiplication-Based Network
  abbreviation: MMN
  typical_primitive_types:
  - block_cipher
  placeholder_family_names:
  - IDEA
  - MMB
  - MSX
  notes: 'Level-1 root, an orthogonal facet in the same sense as tweakable_spn or arx_permutation_network: for designs
    whose primary (often sole) source of nonlinearity and diffusion is integer multiplication modulo a constant close
    to a power of two, tagged alongside the family''s own primary structural root rather than replacing it -- lay_massey
    for IDEA/PES, spn for MMB, generalized_feistel for MSX, balanced_feistel for DFC; MOE and Nimbus carry no other
    structural root since neither fits feistel/spn/arx (MOE''s own paper explicitly rejects an S-box-based SPN, see
    heterogeneous_round_network''s sibling notes and moe_step in rounds.yaml). Despite the shared structural idea,
    IDEA/PES, MMB, MSX, DFC, Nimbus, and MOE are six independently-motivated designs, not branches of one family tree:
    only MMB -> IDEA (Daemen, Govaerts, Vandewalle designed MMB as an explicit "improved replacement" for IDEA, extending
    its word-multiplication idea to wider words with a worst-case rather than average-case security analysis), MSX -> DFC
    (MSX''s own Design Rationale traces "the basic idea of MSX... back to Vaudenay [Vau03]" and DFC''s decorrelation module),
    and MOE -> LowMC (MOE''s spec explicitly reuses LowMC''s self-shrinking-generator-based matrix/constant-generation
    procedure, tagged on lowmc rather than on any family in this root since LowMC itself is spn/partial_sbox_layer, not
    a modular_multiplication_network member) are citation-backed influence edges in this database. No source ties MSX
    or Nimbus to IDEA or MMB: MSX''s 2026 paper frames its multiplication as an integer reinterpretation of Vaudenay''s
    decorrelation theory and does not cite IDEA or MMB, and Nimbus''s NESSIE submission credits a modified linear
    congruential generator, not IDEA/MMB, as its inspiration. MOE''s own related-work section surveys IDEA, MARS, MESH,
    MMB, WIDEA-m, Nimbus, MultiSwap, xmx, and Shabal as prior modular-multiplication designs in a comparison table without
    singling any one out as its structural basis -- a related-work listing, not a citable influence edge per this
    database''s criteria -- so none of those become edges into MOE either. This root therefore covers a convergent design
    cluster, not a single lineage -- see each leaf below for which exact-modulus pattern groups which subset. Deliberately
    excludes designs where multiplication modulo ~2^n is only one ingredient
    of a larger nonlinear toolkit rather than the round''s defining mechanism: RC6 and MARS both use multiplication modulo
    2^32, but RC6''s nonlinearity is fundamentally the data-dependent-rotation ARX structure it inherited from RC5 (multiplication
    only derives the rotation amounts), and MARS combines it with an 8-to-32-bit S-box inside an already heterogeneous,
    multi-phase round (see heterogeneous_round_network); Tiger, CLAE, and Bleep64 likewise use a mul_mod component as one
    of several arithmetic/table operations rather than as the sole source of round nonlinearity. None of these five are
    tagged with this root.

    '
- id: modulo_2n
  name: Multiplication Modulo 2^n
  abbreviation: Mod 2^n
  special_case_of: modular_multiplication_network
  typical_primitive_types:
  - block_cipher
  placeholder_family_names:
  - MSX
  - Nimbus
  - MOE
  notes: 'Word multiplication reduced modulo a power of two (2^n, matching the native word size), the cheapest form to
    implement since it needs no extra reduction step beyond natural machine-word truncation -- multiplication mod 2^n
    is only a bijection when the multiplier is odd, and members split into two patterns depending on how they use that
    fact. Nimbus (NESSIE submission, 2000) and MOE (Bronchain, Faust, Lallemand, Leander, Perrin, Standaert, "MOE," IACR
    ToSC 2021(1)) both apply the multiplication directly to the *full* state as a self-inverting primitive-level step,
    forcing/fixing an odd multiplier for exactly that reason (Nimbus''s keyed a; MOE''s fixed constant 3, whose inverse
    mod 2^128 undoes an earlier step). MSX instead embeds the multiplication inside a Feistel-style round''s F-function
    (Minematsu, Suzaki, Rahman, Suryawanshi, Isobe, "MSX," IACR Communications in Cryptology, 2026), where invertibility
    of the multiplication itself is unnecessary since only the F-function''s output, not the multiplication in isolation,
    needs to feed a reversible XOR/swap step.

    '
- id: modulo_2n_plus_1
  name: Multiplication Modulo 2^n+1
  abbreviation: Mod 2^n+1
  special_case_of: modular_multiplication_network
  typical_primitive_types:
  - block_cipher
  placeholder_family_names:
  - IDEA
  - PES
  notes: 'Multiplication in the multiplicative group of integers modulo the Fermat-prime-style constant 2^n+1 (order 2^n,
    with the all-zero word conventionally representing 2^n so every non-negative n-bit input has a genuine multiplicative
    inverse), introduced by Lai and Massey''s PES (1990) and carried over unchanged into its revision IDEA (1991) as one
    of three deliberately algebraically-incompatible group operations -- XOR, addition mod 2^n, multiplication mod 2^n+1
    -- combined in the MA-structure for confusion.

    '
- id: modulo_2n_minus_1
  name: Multiplication Modulo 2^n-1
  abbreviation: Mod 2^n-1
  special_case_of: modular_multiplication_network
  typical_primitive_types:
  - block_cipher
  placeholder_family_names:
  - MMB
  notes: 'Multiplication modulo 2^n-1, introduced by Daemen, Govaerts, and Vandewalle''s MMB ("Block Ciphers Based on Modular
    Arithmetic," 3rd Symposium on State and Progress of Research in Cryptography, Fondazione Ugo Bordoni, 1993) as an
    explicitly-named improved replacement for IDEA, extending IDEA''s word-multiplication idea from 16-bit words mod 2^16+1
    to 32-bit words mod 2^32-1 and replacing IDEA''s average-case differential/linear analysis with a worst-case bound
    on the multiplication step. Distinct from modulo_2n_plus_1: 2^32-1 is composite (unlike a Fermat prime), so MMB''s
    multiplicative singularities and inverse structure differ from IDEA''s.

    '
- id: modulo_prime_near_2n
  name: Multiplication Modulo a Prime Near 2^n
  abbreviation: Mod prime~2^n
  special_case_of: modular_multiplication_network
  typical_primitive_types:
  - block_cipher
  placeholder_family_names:
  - DFC
  notes: 'Multiplication modulo a prime chosen simply as the nearest prime to a power of two (DFC''s confusion function
    CO(x) = ((x+K1)*K2 mod (2^64+13)) mod 2^32, per its AES-submission specification and Wikipedia''s summary of it) rather
    than a fixed +-1 offset. Motivated by Vaudenay''s decorrelation theory rather than by the IDEA/MMB line''s incompatible-group-operation
    or worst-case-differential arguments: any sufficiently large prime field supplies the same provable bound, so the
    exact constant 13 is incidental, not structural, unlike modulo_2n_plus_1/modulo_2n_minus_1''s exact +-1 offsets.
    Kept as its own leaf rather than folded into modulo_2n_plus_1 since DFC''s design rationale and lineage (the decorrelation-theory
    line that MSX itself cites) differ from that leaf''s IDEA/PES-specific algebraic trick.

    '
- id: generalized_triangular_dynamical_system
  name: Generalized Triangular Dynamical System (GTDS)
  abbreviation: GTDS
  typical_primitive_types:
  - block_cipher
  - permutation
  placeholder_family_names:
  - Arion
  notes: A round function over GF(p) combining a triangular system of univariate polynomial permutations (the "SPN part",
    determining the worst-case differential/linear security bounds) with feedback between branches reminiscent of a Feistel
    network, so that each branch's output feeds into the evaluation of the next. Introduced by Roy and Steiner ("Generalized
    Triangular Dynamical System", arXiv 2204.01802) and instantiated as the Arion permutation/block cipher (Roy, Steiner,
    Trevisani, "Arion", 2023), explicitly positioned by its authors as reducing to neither the Feistel nor the SPN structure,
    unlike the Gen I/II arithmetization-oriented designs (LowMC/MiMC/HADES/Poseidon/GMiMC/Rescue-Prime) that came before it.
