- id: panda_round_func
  name: PANDA RoundFunc
  notes: 'PANDA''s RoundFunc, by Ye, Wang, Hu, Wang, Xie, Sun, and Wang, is an entirely original (not AES-derived)
    round function operating on seven 128-bit state blocks (w, x, y, z, S0, S1, S2) plus a message block: four
    4-bit-nibble S-box (SubNibbles) applications run in parallel with a linear transformation across the state,
    rather than the usual serial SPN layering, so the round function and its inverse share components
    efficiently. Used as the sole underlying primitive of both the PANDA-s (stream-cipher-plus-MAC) and PANDA-b
    (14-round iterated permutation) AEAD schemes.'
