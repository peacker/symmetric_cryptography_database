    stage_ids:
    - submissions_block_64bit
    status: submitted
  influences:
  - source_family_id: safer
    relations:
    - inspired_by
    note: 'The paper states its diffusion layer reuses a known FFT-graph structure: "The Fast Fourier Transform used
      in the round-encryption function E has been used in several cryptographic designs including Schnorr''s
      FFT-Hashing, FFT Hash II, Schnorr and Vaudenay''s Parallel FFT-Hashing, and Massey''s SAFER. This graph has
      been proved to have very good diffusion properties when done twice." SAFER is the only one of these cited
      designs already tracked as a family in this database (Schnorr''s FFT-Hashing and FFT-Hash II are hash designs
      not yet present here -- see the family notes).'
  notes: 'CS-Cipher (Stern and Vaudenay, FSE 1998, LNCS 1372 pp. 189-204) is a 64-bit block cipher (not a stream
    cipher) with a key of arbitrary length up to 128 bits, padded with trailing zero bits. Encryption applies a
    round-encryption function E eight times, xor-ing one of nine 64-bit subkeys k^0..k^8 before/between/after each
    application (a final xor with k^8 whitens the output after the 8th round). Each application of E itself layers
    the same [xor constant, 4 parallel applications of a 16-bit "multipermutation" M, byte-reordering permutation]
    scheme three times in a row, using the round subkey k^i, then a fixed constant c, then a second fixed constant
    c'' as the three constants (c and c'' come from the binary expansion of e = 2.718...). M is built from an 8-bit
    permutation P (itself generated by a small 3-round Feistel network on two 4-bit halves) combined with an
    AND-based nonlinear map and a fixed rotation; the same P is reused in the key schedule''s Feistel-based
    generation of k^0..k^8 from the two 64-bit key halves. M is proved to be a multipermutation (Schnorr/Vaudenay):
    fixing either 8-bit half of its input still leaves both outputs as permutations of the remaining free input,
    which the paper credits for the cipher needing only 2 applications of its underlying FFT-diffusion graph for
    good diffusion, and for having no efficient differential or linear characteristic beyond 5 rounds. Optimized for
    hardware (an estimated 2Gbps at 30MHz in a dedicated 15mm^2 chip) as well as 8-bit and 32-bit software platforms.'
  instances:
