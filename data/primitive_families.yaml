  - cryptopp_cham
  process_participations: []
  influences:
  - source_family_id: lea
    relations:
    - improvement_of
    note: CHAM was designed explicitly to improve LEA's suitability for resource-constrained 8-bit and 16-bit microcontrollers
      and hardware while keeping LEA's ARX design philosophy; the designers note the resulting structural similarity between
      the two ciphers.
  innovative_ideas:
  - id: cham_four_branch_arx
    name: Four-branch ARX generalized Feistel design
    note: A compact four-word generalized Feistel structure using only modular addition, fixed rotations, XOR, and round counters.
  notes: The original CHAM family comprises CHAM-64/128, CHAM-128/128, and CHAM-128/256. The respective original round counts
    are 80, 80, and 96. CHAM is an S-box-free ARX design optimized for resource-constrained devices.
