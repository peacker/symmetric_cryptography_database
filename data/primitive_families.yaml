    note: 'Between Tiger''s three passes, an invertible key schedule mixes all eight 64-bit message words using XOR with fixed
      constants and 64-bit modular addition/subtraction. This prevents sparse-input attacks and ensures each pass sees a different
      message view without repeating the same linear transformation.

      '
