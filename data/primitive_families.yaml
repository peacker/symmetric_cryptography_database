  influences:
  - source_family_id: ascon
    relations:
    - inspired_by
    note: 'Shamash''s own spec states it "is based on the sponge and duplex constructions... taking advantage of the recent
      improvements in security given by [JLM]", explicitly naming Ascon as the precedent for this design route: it credits
      sponge/duplex as "a design that has been well studied during the last decade... used extensively... by... one of
      the recently proclaimed member[s] of the portfolio for lightweight cryptography, Ascon." The authors state they
      considered a block-cipher-based design first before choosing this Ascon-like permutation route instead.'
  - source_family_id: serpent
    relations:
    - inspired_by
    note: Shamash's spec states its bitsliced approach to the S-box layer ("a single Sbox used in parallel in a bit-wise
      manner") is "a method popularized by Serpent and other ciphers."
  innovative_ideas:
  - id: shamash_sponge_aead_dual
    name: Dual-purpose design covering both AEAD (Shamash) and hash (Shamashash)
    note: 'Shamash is an AEAD with 128-bit key, 128-bit nonce, 128-bit tag, and 320-bit state. Shamashash re-uses Shamash
      as a black box inside the BDPV sponge construction to produce a 256-bit hash with 64-bit rate and 256-bit capacity.
      The 320-bit permutation-based state = five 64-bit words W0..W4.

      '
  - id: shamash_5bit_sbox_layer
    name: 64 parallel 5-bit S-boxes over the 320-bit state
    note: 'The substitution layer applies 64 independent 5-bit-to-5-bit S-boxes across all 320 state bits in parallel. The
      diffusion layer combines fixed rotations, XOR mixing, and a 5×5 GF(2) matrix to provide full inter-word diffusion.

      '
  notes: 'Penazzi 2019. 320-bit permutation (five 64-bit words W0..W4) underlying both the Shamash AEAD and the Shamashash
    hash function; see shamash_and_shamashash_aead and shamash_and_shamashash_hash.

    '
  instances:
  - id: shamash_permutation
    name: Shamash Permutation
    type: permutation
    reference_ids:
    - penazzi_2019_shamash
    characteristics:
      state_size_bits: 320
      rounds: 12
      rounds_min: 9
      rounds_max: 12
      block_size_bits: 320
      output_size_bits: 320
    notes: 320-bit permutation-based state of five 64-bit words W0..W4. Substitution layer applies 64 independent 5-bit-to-5-bit
      S-boxes in parallel across the state; diffusion combines fixed rotations, XOR mixing, and a 5x5 GF(2) matrix. Initialization
      uses 12 rounds; AD/encryption/finalization calls use 9 (finalization totals 9+3=12).
