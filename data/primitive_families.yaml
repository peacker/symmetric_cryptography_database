    Grobner-basis algebraic attack (Albrecht, Cid, Grassi, Khovratovich, Luftenegger, Rechberger, and Schofnegger,
    "Algebraic Cryptanalysis of STARK-Friendly Designs - Application to MARVELlous and MiMC", ASIACRYPT 2019, eprint
