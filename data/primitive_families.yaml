  process_participations: []
  influences: []
  innovative_ideas:
  - id: subterranean_absorb_then_squeeze_precursor
    name: Pre-sponge absorbing and squeezing phases
    note: The Subterranean 2.0 paper says that, with some imagination, the original mode can be viewed as a precursor to the
      2007 sponge construction because it has an absorbing phase followed by a squeezing phase. This is a historical analogy,
      not a claim that the 1992 design instantiated the later formal sponge.
  - id: subterranean_bit_shift_invariant_round
    name: Bit-level shift-invariant chi-based round
    note: Except for constant addition, its operations are bit-level shift-invariant; the round combines chi nonlinearity,
      lightweight mixing with a heavy inverse, and bit transposition. The 2019 paper identifies these as features later adopted
      by Keccak-p and Xoodoo.
