    - inspired_by
    note: 'Confirmed directly: the design rationale states that adopting Rijndael-256-256 unmodified "would be
      problematic" for software performance and RK-attack resistance, so "these considerations drove our design of
      a ''new Rijndael'' with 256- and 512-bit block sizes." An isomorphism between Vistrutah-512 and the AES is
      used directly to reuse AES''s cryptanalysis for Vistrutah-512.'
  - source_family_id: pholkos
    relations:
    - inspired_by
    note: 'Confirmed directly from the related-work section: "Simpira, Haraka, and Pholkos, for instance, employ
      pairs of AES rounds as 128-bit keyed S-boxes. We build on this design philosophy, improving on both security
      and performance."'
  notes: 'Vistrutah (Avanzi, A. Chakraborti, B. Chakraborty, List; IACR ToSC 2025(3), pp. 1-150) is a non-tweakable
    "bricklayer" block cipher with 256- or 512-bit blocks. Each step chains two AES rounds (SubBytes, ShiftRows,
    MixColumns, AddRoundKey) applied in parallel to each 128-bit slice of the state, then applies a state-wide
    cell-shuffle mixing layer (omitted only after the last step) -- the 256-bit version reuses ASURA''s byte shuffle
    verbatim; the 512-bit version uses a dedicated tube-based permutation (neither ASURA nor Simpira/Haraka/AESQ is
    yet separately catalogued in this database). Its "inline" key schedule computes round keys on the fly by
    alternating a fixed round-key value with one updated via fixed permutations each step, avoiding any
    precomputed/stored round-key schedule (mitigating cold-boot key leakage) at the cost of key agility. The paper
    explicitly notes (Remark 1) that its active-cell cryptanalysis under related-key differentials "give[s] an
    indication of the security level achievable in a potential extension of Vistrutah to a tweakable block cipher
    when following the TWEAKEY approach" -- i.e. the design can readily be turned into a tweakable cipher, though
    the published design itself is non-tweakable. Long (full-security) variants: 14-round Vistrutah-256 and
    Vistrutah-512-256, 18-round Vistrutah-512. Short (reduced-round, for Hash-Encrypt-Hash modes like HCTR2 and
    ForkCiphers) variants: 10-round Vistrutah-256 and Vistrutah-512-256, 12-round Vistrutah-512-512.'
  instances:
