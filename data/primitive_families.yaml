    (pure cubing) layer. The paper explicitly frames the concurrent Masta design as independent work, not a
    predecessor Pasta "succeeds" -- Pasta''s own lineage is the Rasta strategy adapted to F_p -- and reports
    outperforming Masta by up to 6x; its S_feistel S-box was later reused directly by the Rubato cipher. The
    mode-tier Pasta stream-cipher family itself (which truncates Pasta-pi''s output under a nonce and block counter)
    is now separately modeled too -- see the mode-tier "pasta" family (data/mode_families.yaml). Local copy: references/[2021][pasta,pasta_pi][][].pdf
    (downloaded from a Semantic Scholar mirror; eprint.iacr.org is behind a Cloudflare challenge that blocked
    automated fetching).'
