- id: newdes
  name: NewDES
  notes: 'NewDES is a 64-bit, 120-bit-key product cipher designed as a simpler alternative to DES. Its own Wikipedia
    article states explicitly: "Despite its name, it is not derived from DES and has quite a different structure" --
    deliberately does not carry a DES influence edge given that. Round structure and byte/key mapping confirmed
    directly against riordan_1990_newdes_reference_implementation (the original Cryptologia 1985 paper itself
    remains paywalled with no free copy found): NewDES has no half-block split/swap and no bit-level permutation at
    all -- see newdes_round_forward/newdes_round_backward (data/rounds.yaml) for the exact, previously-approximated
    byte/key mapping now confirmed from a reference implementation. construction_ids left as an approximate
    spn/full_sbox_layer tag pending a real taxonomy decision: the confirmed structure (two symmetric 4-byte halves,
    alternately updated from each other via 4 parallel per-byte S-box+key-XOR operations, no permutation layer) is
    arguably closer to some kind of Feistel-family network than a classic SPN, but doesn''t cleanly match
    unbalanced_feistel (halves are equal-sized) or alternating_feistel_network (that leaf specifically means
    contracting/expanding halves of different widths, per BEAR/LION -- not NewDES''s case) or any existing
    generalized-Feistel Type-1..5 leaf either; removed bit_permutation_linear_layer, which the confirmed structure
    does not have (no bit-level permutation anywhere in NewDES, only byte-level XOR and S-box substitution).'
