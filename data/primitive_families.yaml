    note: 'Overlapping authorship, not a stated citation: Deukjo Hong is the first author of both HIGHT (2006, CHES)
      and LEA (2013, WISA) -- LEA''s "Comparison with Other Ciphers" section discusses HIGHT only to contrast it as
      unsuitable for 32-bit-CPU fast encryption (8-bit ARX operations), not as a design ancestor, so this is recorded
      on the same same-designer basis as the existing keccak<-aes edge rather than a textual citation. LEA departs
      from HIGHT structurally too (32-bit vs. 8-bit words, 4-branch parallel round vs. HIGHT''s serial Type-2 GFN).'
  - source_family_id: salsa20
    relations:
    - related_to
    note: LEA''s round splits a 4-word state into three adjacent-word pairs, each XORed with a round key, added, and
      rotated by its own fixed amount (9, 5, 3) to produce the next round''s first three words, with the fourth
      simply carried over -- structurally reminiscent of Salsa20''s quarterround (also a 4-word ARX network with
      per-step fixed rotations), but the three LEA computations are independent/parallel within a round (feeding
      only from the previous round''s words) where Salsa20''s four quarterround steps are a strict cascade (each
      depends on the previous step''s just-computed output). Not a stated citation -- LEA''s own paper does not
      mention Salsa20 -- and no closer specific predecessor for this parallel-branch shape was found.
  notes: LEA (Lightweight Encryption Algorithm; Hong et al., WISA 2013) is a 128-bit ARX block cipher with key sizes of 128,
    192, or 256 bits and 24, 28, or 32 rounds respectively. Its round function applies 32-bit modular additions, XORs, and
    fixed rotations to four 32-bit words — no S-boxes are used. Designed for fast software on general-purpose CPUs. Tagged
    type3_generalized_feistel (not the generic generalized_feistel leaf) by structural inspection against Hoang-Rogaway's
    Type-3 GFN, not by citation -- the paper itself never calls its own structure "Feistel" or "generalized"; see
    lea_round's notes (data/rounds.yaml) for the full comparison.
