    each end, R_P partial-S-box rounds in the middle). Grassi, Kales, Khovratovich, Roy, Rechberger, and
    Schofnegger''s original eprint 2019/458 combined it with the unkeyed sponge-hash instantiations Poseidon (native
    GF(p)) and Starkad (GF(2^n) sibling, now modeled separately in mode_families.yaml -- see starkad -- and
    explicitly dismissed -- "we advice against using them" -- in a later updated version of the Poseidon paper
    alongside Poseidon''s own x^(-1) S-box variant); this split is documented in the final published Poseidon paper
    (grassi_et_al_2021_poseidon).
