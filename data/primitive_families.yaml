    - id: permutation
  reference_ids:
  - zcash_protocol_specification_2026
  - pedersen_1991_vss
  process_participations: []
  influences: []
  notes: 'Zcash''s PedersenHash/WindowedPedersenCommit construction, used for Sapling note commitments and the
    Sapling Merkle tree (superseded by Sinsemilla in Orchard, see sinsemilla). Collision-resistant only for
    fixed-length input, reduced to the Discrete Logarithm Problem on the Jubjub curve; the specification explicitly
    does not claim preimage resistance as a property. Important provenance note: despite the common name, the Zcash
    Protocol Specification does NOT cite Torben Pedersen''s 1991 commitment paper (pedersen_1991_vss) anywhere for
    this concrete construction -- it instead attributes it to Chaum/Damgard/van de Graaf (1987), Bos/Chaum/Purdy
    (1988), and Chaum/van Heijst/Pfitzmann (1991), with a tighter Discrete-Log security reduction from Bellare/
    Goldreich/Goldwasser (1995). Pedersen 1991 is cited here only for the generic classical discrete-log commitment
    concept the colloquial name references, not as this construction''s documented source. Mechanism: message split
    into 3-bit chunks, each chunk encoded to a scalar and multiplied by a distinct per-segment generator, summed via
    scalar multiplication. No local PDF copy kept for the Zcash spec (living, continuously-updated document); Pedersen
    1991 itself is Springer-paywalled and was not fetched.'
