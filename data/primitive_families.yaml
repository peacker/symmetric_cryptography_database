    note: Ascon's paper states that its 5-bit substitution layer is an affine equivalent of Keccak's chi mapping. The affine
      input and output transforms raise Ascon's branch number, so the S-boxes are related but not identical.
  notes: 'Ascon-p is a 320-bit permutation operating on five 64-bit words, combining a 5-bit substitution layer with fixed
    linear rotations. It first appeared in the 2016 CAESAR submission and was carried forward, as the same mathematical transformation,
    into the 2021 NIST Lightweight Cryptography submission (both using big-endian bit/byte numbering and the original v1.2
    round constants). NIST SP 800-232 standardizes the identical permutation under the name Ascon-p, re-specifying it with
    little-endian bit/byte numbering and re-encoded round constants; the function computed is equivalent to the v1.2 specification
    up to this bit-ordering convention, not a new design. See ascon_aead, ascon_hash, and ascon_xof for the sponge constructions
    built on top of this permutation.

    '
  instances:
