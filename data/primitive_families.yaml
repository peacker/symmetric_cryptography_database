  - source_family_id: des
    relations:
    - inspired_by
    note: CRISP's round function follows the same expand-mix-substitute structure as the DES round function, and its self-referential
      key schedule follows a proposal to strengthen DES-like ciphers by using the cipher itself as a PRNG for round-key generation.
  - source_family_id: blowfish
    relations:
    - inspired_by
    note: CRISP's key-dependent substitution tables and subkey generation follow Blowfish's approach of using the cipher itself
      as a pseudo-random generator to derive its own S-boxes and round-key material.
  - source_family_id: md5
    relations:
    - inspired_by
    note: An early version of CRISP used MD5 as the PRNG for round-key generation before this was replaced by a self-referential
      CRISP-based generator for compactness.
