    name: Ascon-p Permutation (320-bit)
    type: permutation
    reference_ids:
    - ascon_caesar_submission_2016
    - ascon_nist_lwc_submission_2021
    - ascon_joc_2021
    - ascon_ctrsa_2024
    - sp_800_232
    characteristics:
      state_size_bits: 320
      rounds: 12
      rounds_min: 6
      rounds_max: 12
      block_size_bits: 320
      output_size_bits: 320
    notes: Official NIST SP 800-232 name for the permutation is Ascon-p. The 12-round call (p_a in the literature) is used
      for initialization/finalization across every Ascon mode; a shorter p_b call processes data blocks — 6 rounds in Ascon-128/Ascon-80pq,
      8 rounds in Ascon-128a/Ascon-AEAD128, and 12 rounds in Ascon-Hash/Ascon-Xof/Ascon-Hash256/Ascon-XOF128/Ascon-CXOF128.
      No NIST-standardized mode uses the 6-round call.
