- id: orthros
  name: Orthros
  construction_ids:
  - spn
  - full_sbox_layer
  - near_mds_arx_linear_layer
  round_ids:
  - orthros_round_bit_perm
  - orthros_round_nibble_perm
  target_applications:
  - ultra_low_latency
  - hardware
  - circuit_depth_constrained
  characteristics:
    block_size_bits: 128
    key_size_bits: 128
    components:
    - id: sbox
      params:
        input_bits: 4
        output_bits: 4
    - id: bit_permutation
    - id: word_permutation
      params:
        word_size_bits: 4
    - id: binary_matrix_mul
    - id: xor
    - id: constant
  reference_ids:
  - banik_et_al_2021_orthros
  process_participations: []
  influences:
  - source_family_id: midori
    relations:
    - inspired_by
    note: 'Orthros''s own paper states directly: "The round functions of Orthros are based on Midori. It is already
      suitable to low-latency ciphers, however we performed a thorough study on it and showed that we can further
      improve latency by adopting new permutation layers and S-boxes." Orthros also reuses Midori-128''s 4x4 binary
      near-MDS matrix (branch number 4) unchanged, replacing only the S-box and permutation layers ("we propose a
      hybrid use of bit and nibble permutations... while Midori-128 uses a single linear layer including both").'
  notes: 'Orthros (Banik, Isobe, Liu, Minematsu, Sakamoto, IACR ToSC 2021, issue 1, pp. 37-77) is a 128-bit-block,
    128-bit-key pseudorandom function (PRF), not a block cipher: "The overall structure of Orthros is a sum of two
    SPN-type keyed permutations called Branch1 and Branch2... The 128-bit ciphertext C is an XOR of the outputs of
    Branch1 and Branch2," making the construction non-invertible in general even though each branch alone is an
    invertible 12-round SPN. Modeled here under primitive_types.yaml''s block_cipher category (as this database
    already does for PRINCE/MANTIS-style low-latency designs usable as PRFs) since there is no dedicated
    sum-of-permutations-PRF primitive type and each branch is itself literally a keyed 128-bit SPN block cipher;
    the two-branch XOR-sum wrapper that makes the whole non-invertible is captured in round_ids/notes rather than
    construction_ids, since neither branch''s internal structure changes because of it. Each of Branch1 and Branch2
    is a 12-round keyed permutation over the same 128-bit key K (independent round-key schedules KSF1/KSF2, both
    bit-permutation-based), using an identical 4-bit S-box (non-involutory, unlike Midori/QARMA''s, since Orthros
    never needs to run its branches "in reverse"): rounds 1-4 apply a per-branch bit permutation (Pbr1/Pbr2), rounds
    5-11 switch to a per-branch nibble permutation (Pn1/Pn2), and round 12 is S-box-and-key-addition only (see
    orthros_round_bit_perm / orthros_round_nibble_perm, data/rounds.yaml). This bit-then-nibble-permutation hybrid
    is the paper''s central diffusion-speed claim: "each branch of Orthros achieves the 2.5-round full diffusion and
    attains 64 active S-boxes over 10 rounds, while Midori-128 requires 3 rounds for full diffusion and 13 rounds
    for 64 active S-boxes." Achieves ~2.4ns minimum latency on the STM 90nm library versus 2.56ns (PRINCE), 4.10ns
    (Midori-128), 4.38ns (QARMA9-128) for fully unrolled circuits. Local copy: references/[2021][orthros][][].pdf (fetched
    from tosc.iacr.org; eprint.iacr.org/2021/390 blocks automated fetching).'
  instances:
  - id: orthros_default
    name: Orthros
    type: block_cipher
    reference_ids:
    - banik_et_al_2021_orthros
    characteristics:
      block_size_bits: 128
      key_size_bits: 128
      rounds: 12
      output_size_bits: 128
    notes: Per-branch round count (Branch1 and Branch2 each run all 12 rounds independently and in parallel; the
      two 128-bit branch outputs are then XORed to produce the final 128-bit output, so overall latency is that of
      one branch, not both in series).

