- id: helix
  name: Helix Block Function
  construction_ids:
  - arx_permutation_network
  - fixed_rotation_arx
  - pure_arx_no_constants
  round_ids:
  - helix_round
  target_applications:
  - software
  - hardware
  characteristics:
    state_size_bits: 160
    components:
    - id: add_mod
      params:
        modulus: 4294967296
    - id: xor
    - id: rotation_fixed
  reference_ids:
  - ferguson_et_al_2003_helix
  process_participations: []
  influences:
  - source_family_id: twofish
    relations:
    - related_to
    note: 'Overlapping authorship, not a stated citation: four of Helix''s six authors (Ferguson, Whiting, Schneier,
      Kelsey) co-designed Twofish (1998) five years earlier; Helix''s own reference list cites no earlier cipher
      as a design predecessor (only cryptanalysis-technique papers and competing AEAD-mode proposals). The team''s
      design drifted away from Twofish''s key-dependent S-boxes and MDS matrix entirely, keeping only the
      addition/rotation/XOR operations Twofish also used in its whitening (pseudo-Hadamard transform) -- the same
      overlapping-author, largely-structural-drift basis as the existing keccak<-aes edge.'
  notes: 'Ferguson, Whiting, Schneier, Kelsey, Lucks, and Kohno''s 2003 FSE paper formally defines a single fixed-size
    "Helix block function" operating on a 160-bit (five 32-bit word) state (Fig. 1-2): each round adds or XORs one
    active word into the next and rotates it by a fixed amount, with two words of key material and one word of
    plaintext/ciphertext injected per block (20 rounds). The paper then builds several directly-usable constructions
    on top of that fixed-size primitive -- combined encryption+authentication (its default/eponymous use, Sect. 2),
    a pure stream cipher/PRNG (Sect. 6.2, ignoring the MAC), and a pure MAC (Sect. 6.3) -- all variable-length modes
    that live at the mode tier (see helix_aead). This mirrors the Salsa20/salsa20_stream split already used in this
    database.
    '
  instances:
