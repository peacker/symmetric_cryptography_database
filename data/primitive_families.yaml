      state_size_bits: 512
      rounds: 8
      block_size_bits: 512
      output_size_bits: 512
    notes: Bernstein's original (2008) 8-round ChaCha block function, with a 64-bit nonce and 64-bit block counter matching
      Salsa20's layout, usable with a 128- or 256-bit key.
  - id: chacha14_block_function
    name: ChaCha14 Block Function
    type: update_function
