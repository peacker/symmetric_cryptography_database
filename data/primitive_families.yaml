      params:
        input_bits: 4
        output_bits: 4
    - id: binary_matrix_mul
    - id: xor
    - id: constant
  reference_ids:
  - borghoff_et_al_2012_prince
  process_participations: []
  influences:
  - source_family_id: aes
    relations:
    - inspired_by
    note: The SKINNY/MANTIS paper states that PRINCE's round function basically follows the AES structure, but uses a MixColumns-like
      mapping with branch number 4 instead of AES's branch number 5 and adds reflection symmetry.
  - source_family_id: khazad
    relations:
    - related_to
    note: 'PRINCE''s own primary sources (eprint.iacr.org/2012/529, the ASIACRYPT 2012 proceedings PDF, and a ResearchGate
      mirror) all blocked automated fetching, so this is sourced from a reliable secondary characterization (Beyne
      and Chen, "Provably Secure Reflection Ciphers," CRYPTO 2022): "Many traditional key-alternating ciphers also
      use involutions, i.e. self-inverse functions, as their components in order to keep the hardware implementation
      costs for encryption and decryption similar and to save area. The block ciphers ANUBIS, KHAZAD and NOEKEON are
      early examples of this strategy. [...] At ASIACRYPT 2012, Borghoff et al. introduced the block cipher PRINCE
      as an alternative approach to minimizing the overhead of supporting both efficient encryption and decryption."
      PRINCE pursues the identical goal (cheap encryption/decryption duality) via a reflection construction around
      related keys rather than making every round component individually self-inverse; no concrete mechanism is
      adopted from Khazad, hence related_to rather than inspired_by.'
  - source_family_id: anubis
    relations:
    - related_to
    note: 'Same relationship as the Khazad edge on this family (see that note for the full quote and sourcing caveat):
      PRINCE''s related-work framing groups Anubis with Khazad and Noekeon as the earlier "make every component an
      involution" strategy that PRINCE''s reflection construction offers an alternative to, not a design PRINCE builds
      on.'
  - source_family_id: noekeon
    relations:
    - related_to
    note: 'Same relationship as the Khazad edge on this family (see that note for the full quote and sourcing caveat):
      PRINCE''s related-work framing groups NOEKEON with Anubis and Khazad as the earlier "make every component an
      involution" strategy that PRINCE''s reflection construction offers an alternative to, not a design PRINCE builds
      on.'
