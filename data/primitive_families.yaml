- id: iscream_tbc
  name: iScream
  notes: 'iScream is an involutive-component sibling of Scream (see scream_tbc): the same tweakable LS-design
    structure, but built entirely from involutive S-boxes and an involutive linear layer (L-box) so that
    encryption and decryption share almost all of their circuitry "approximately for free" -- at the cost of a
    weaker differential trail bound (an involutive L-box permits 2-round trails with only 8 active S-boxes,
    versus Scream''s non-involutive L-box).'
