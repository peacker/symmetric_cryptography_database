- id: mambo
  name: Mambo
  notes: 'Mambo, by Watson Ladd, is a bespoke tweakable block cipher operating on a 16-word (512-bit) state of
    32-bit words arranged in a 4x4 square, with an 8-word (256-bit) key and a 16-word (512-bit) tweak. Each round
    applies a substitution-permutation-like layer Q (built from XOR, AND, OR, NAND, NOR, and fixed rotation) to
    every row and then every column of the state, interleaved with key- and round-counter-dependent XOR
    additions; the tweak is XORed in once, midway through the round sequence. Designed as the core primitive of
    the McMambo AEAD mode for the same CAESAR submission.'
