  - knudsen_et_al_2010_printcipher
  process_participations: []
  influences:
  - source_family_id: present
    relations:
    - inspired_by
    - generalization_of
    note: 'The paper states explicitly: "our starting point for the work in this paper will be the block cipher PRESENT
      which appears to offer a range of design/implementation trade-offs. However we will re-examine the structure
      of PRESENT in the particular context of IC-printing." PRINTcipher keeps PRESENT''s SPN skeleton (fixed bit
      permutation feeding parallel small S-boxes) but generalizes the permutation formula for arbitrary S-box arity
      s: "the bit permutation -- or rather its inverse -- used for the block cipher PRESENT is a special case of
      this general result," and replaces PRESENT''s per-round subkey schedule with a single round-invariant subkey
      plus a key-dependent S-box-input permutation, exploiting that IC-printing can bake a unique key straight into
      the printed circuit.'
  innovative_ideas:
  - id: printcipher_key_dependent_permutation
    name: Key-dependent S-box input permutation
    note: In place of a per-round key schedule, part of the key selects -- independently for each S-box, from one of
      four fixed permutations -- how that S-box's 3 input bits are wired, so the effective per-key S-box varies while
      every round reuses the identical fixed subkey and fixed S-box table. This buys back the security a round-invariant
      subkey would otherwise cost, at zero hardware cost for a printed (rather than lithographed) circuit.
  - id: printcipher_lfsr_round_counter
    name: LFSR-based round-constant counter
    note: Round constants are generated by an affine LFSR-driven shift-register counter (t = 1 + x_{n-1} + x_{n-2})
      rather than a binary up-counter, saving gates versus an arithmetic counter -- the same trick the paper credits
      to KATAN/KTANTAN.
  notes: 'PRINTcipher (Knudsen, Leander, Poschmann, Robshaw, CHES 2010) is a family of two lightweight SPN block
    ciphers, PRINTcipher-48 and PRINTcipher-96, designed for IC-printing (silicon-ink-printed circuits) rather than
    conventional lithography. Because a printer can bake a unique key directly into each printed circuit at zero
    marginal cost, the design deliberately foregoes a key schedule: encryption uses a single subkey unchanged in
    every round, with the remaining 2/3 of the key spent on choosing, per S-box, one of four fixed input permutations.
    Each round is xor round-invariant-subkey / PRESENT-style fixed bit permutation / xor LFSR-counter round constant
    / key-dependent 3-bit S-box-input permutation / layer of parallel 3-to-3-bit S-boxes. The number of rounds equals
    the block size (48 or 96).'
  instances:
  - id: printcipher_48
    name: PRINTcipher-48
    type: block_cipher
    reference_ids:
    - knudsen_et_al_2010_printcipher
    characteristics:
      block_size_bits: 48
      key_size_bits: 80
      rounds: 48
      output_size_bits: 48
    notes: 80-bit key = 48-bit round-invariant subkey sk1 + 32 key-dependent-permutation bits sk2 (5/3 x 48).
  - id: printcipher_96
    name: PRINTcipher-96
    type: block_cipher
    reference_ids:
    - knudsen_et_al_2010_printcipher
    characteristics:
      block_size_bits: 96
      key_size_bits: 160
      rounds: 96
      output_size_bits: 96
    notes: 160-bit key = 96-bit round-invariant subkey sk1 + 64 key-dependent-permutation bits sk2 (5/3 x 96).
- id: sea
  name: SEA
  construction_ids:
  - feistel
  - balanced_feistel
  round_ids:
  - sea_round
  target_applications:
  - embedded
  - constrained_hardware
  - microcontrollers
  characteristics:
    components:
    - id: sbox
      params:
        input_bits: 3
        output_bits: 3
    - id: add_mod
    - id: xor
    - id: rotation_fixed
    - id: word_permutation
  reference_ids:
  - standaert_et_al_2005_sea
  process_participations: []
  influences: []
  notes: 'SEA_n,b (Standaert, Piret, Gershenfeld, Quisquater, CARDIS 2006) is a Scalable Encryption Algorithm: a
    parametric Feistel block cipher, scalable in plaintext/key size n and processor word size b (n must be a multiple
    of 6b), targeted at 8-/16-/32-bit microcontrollers with minimal RAM, code size and instruction-set requirements.
    Its round function combines a word rotation, xor and modular (2^b) addition of the subkey, a small recursively-defined
    3-bit S-box, and a bit rotation tuned to the S-box''s bitslice layout. The key schedule reuses the same round
    function (parameterised by a round counter instead of a subkey) run half-forward/half-backward so encryption and
    decryption share identical key-expansion code. The paper motivates SEA by naming TEA and Yuval''s TREYFER as the
    only prior lightweight-cipher examples, but only to note that neither offers provable resistance to linear/differential
    cryptanalysis -- SEA''s own design (Feistel + a from-scratch 3-bit S-box exhaustively searched for optimal
    lambda/delta bias) adopts no concrete mechanism from either, so no influence edge is recorded. Likewise, the
    paper''s remark that its round-key sequence "is the same as the one of ICEBERG" appears only in the security-analysis
    section (to reuse ICEBERG''s existing slide-attack proof), with no accompanying adoption language, so that
    similarity is also left unrecorded per this database''s influence standard.'
  instances:
  - id: sea_96_8
    name: SEA_96,8
    type: block_cipher
    reference_ids:
    - standaert_et_al_2005_sea
    characteristics:
      block_size_bits: 96
      key_size_bits: 96
      output_size_bits: 96
