  process_participations: []
  influences:
  - source_family_id: rijndael
    relations:
    - generalization_of
    note: 'Confirmed directly from the abstract: "Pholkos is no novel round-function design, but utilizes the AES
      round function, following design ideas of Haraka and AESQ ... It extends them to build a family of primitives
      with state and key sizes of 256 and 512 bits." Each Pholkos step chains two unmodified AES rounds unchanged,
      generalizing Rijndael''s SPN to wider states with a TWEAKEY-style tweakey schedule and a 128-bit tweak input.'
  notes: 'Pholkos (Bossert, List, Lucks, Schmitz; CT-RSA 2022) is a family of tweakable block ciphers with 256- or
    512-bit states, reusing the unmodified AES round function (SubBytes, ShiftRows, MixColumns, AddRoundKey) applied
    in parallel to two or four 128-bit substates per step, followed by a fixed byte permutation across substates for
    full-state diffusion. Following design ideas of Haraka and AESQ (not yet separately catalogued in this
    database), Pholkos targets exceptionally high AES-NI/AVX2 throughput (1-2 cycles/byte) together with
    beyond-birthday-bound ("bigger birthday") security for large-block encryption/authentication modes such as SCT,
    ThetaCB3, and ZAE. Its TWEAKEY-style schedule derives round tweakeys from parallel word-permutation-plus-update
    key and tweak lanes (kappa, tau) combined by XOR (gamma) each round. The public reference implementation
    additionally defines an experimental 1024-bit-state Pholkos-1024 variant not described in the published CT-RSA
    2022 paper; this database records only the two published 256- and 512-bit variants.'
  instances:
