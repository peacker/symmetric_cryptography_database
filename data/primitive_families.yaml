- id: speck
  name: SPECK
  notes: SPECK is a software-oriented family of lightweight ARX Feistel ciphers, parameterized for multiple word, block, and
    key sizes.
  construction_ids:
  - feistel
  - balanced_feistel
  - arx_permutation_network
