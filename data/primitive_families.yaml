    non-linear layer over GF(2) each round, followed by a freshly-generated random invertible affine (binary matrix)
    layer and round-constant XOR -- a new random matrix is derived deterministically per round from the public key/IV,
    unlike LowMC''s reuse of one style of random matrix in a partial S-box layer. The aggressive round-reduced variant
    Agrasta is defined in the same paper. An A-S-A-S-...-A (ASASA) topology, per the paper''s own citation: "Generic
    substitution-permutation designs which interleave a key-dependent affine layer with key-dependent S-boxes have
    been studied since SASAS" -- Rasta''s own "twist" is that the S-box (chi) is fixed/public while the affine layers
    are nonce/counter-derived rather than key-dependent. Local copy: references/[2018][rasta][][rasta_agrasta].pdf.'
