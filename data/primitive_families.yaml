      closely related but not identical S-boxes.
  - source_family_id: simon
    relations:
    - inspired_by
    - related_to
    note: SKINNY was designed as an SPN competitor to SIMON and is described as lying between an SPN and a SIMON-like AND-rotation-XOR
      function, combining cheap components with SPN-style active-S-box bounds.
  - source_family_id: led
    relations:
    - related_to
    note: SKINNY uses the same cheap six-bit affine-LFSR recurrence as LED to generate its round counter, requiring one XNOR
      gate per update.
  - source_family_id: aes
    relations:
    - related_to
    note: SKINNY uses a 4-by-4 cell array and an AES-style ShiftRows step, with rightward rather than AES's leftward rotations.
      Its binary MixColumns is deliberately much sparser and has branch number 2 rather than an MDS layer.
  innovative_ideas:
  - id: skinny_locally_nonoptimal_components
    name: Security from iterating locally non-optimal lightweight components
    note: SKINNY pushes the lightweight trend of combining a compact S-box, a very sparse diffusion layer, and a light key
      schedule while obtaining strong global differential and linear bounds. The paper does not attribute the start of this
      broad trend to one cipher.
  - id: skinny_sparse_binary_diffusion
    name: Three-XOR sparse binary MixColumns layer
    note: The branch-number-2 binary matrix was selected jointly with ShiftRows for strong multi-round diffusion and can be
      implemented with at most three XOR operations per column.
