    relations:
    - inspired_by
    note: 'The g-function''s F-function reuses FEAL''s S-box arithmetic (Si(x,y) = ROL2(x+y+i mod 256)) almost verbatim,
      just extended from FEAL''s two 32-bit words to four; Biham and Shamir''s cryptanalysis paper describes it as "similar
      to the one of Feal."

      '
  notes: 'No official specification is available online. Modeled from Biham and Shamir, "Differential Cryptanalysis of
    Feal and N-Hash" (EUROCRYPT ''91), which diagrams the construction (Figures 2-4) while cryptanalyzing it -- the original
    specification (Miyaguchi, Ohta, Iwata, "128-bit hash function (N-Hash)," SECURICOM ''90) is cited there but not independently
