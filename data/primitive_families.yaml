      schedule with repeated application of one fixed permutation instead of BLAKE2's per-round constant schedule.
  - source_family_id: blake
    relations:
    - inspired_by
    note: BLAKE3 remains in the BLAKE ARX lineage through BLAKE2 and its ChaCha-derived G function.
  notes: 'The BLAKE3 (2020) compression function works on 32-bit words: a 7-round keyed permutation (BLAKE2s'' G-function,
    reduced from 10 to 7 rounds) is applied to a 16-word state seeded from the input chaining value, the IV constants,
    a 64-bit counter, the input byte count, and domain-separation flags, keyed by the message block. The output feeds
    the permuted state forward against the original chaining value (h''[8..15] = v''[8..15] XOR h[0..7]), the same feedforward
    pattern as Davies-Meyer, enabling the full 16-word output to be used for extendable-output/tree-chaining purposes.
