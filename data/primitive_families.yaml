      Helix. In fact, the block functions of the two ciphers are identical, except for the keystream output
      function." Phelix carries four extra 32-bit "old" state words (nine words/288 bits total) alongside the same
      five "active" words the identical round function operates on; the old words are read only by the downstream
      keystream-extraction step, which is a mode-tier (AEAD) concern -- see phelix_aead''s own improvement_of edge
      to helix_aead for that part of the redesign.'
