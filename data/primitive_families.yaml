      (applied to only part of the state) for a full-state quadratic non-linear layer plus a freshly-generated random
      affine layer every round, per Dobraunig, Eichlseder, Grassi, Lallemand, Leander, List, Mendel, and Rechberger's
      own comparison (CRYPTO 2018).
