  - id: haval_variable_passes
    name: Variable pass count (3, 4, or 5) over each 1024-bit block
    note: 'Each 1024-bit block is processed 3, 4, or 5 times (passes), each pass using a different Boolean function and word
      permutation. This provides a security-performance tradeoff: 3 passes (96 steps/block) is fastest; 5 passes (160 steps/block)
      is most secure. Five Boolean functions f1..f5 are defined; passes 1..5 use f1..f5 in order.

      '
  - id: haval_variable_output
    name: Variable output length (128, 160, 192, 224, 256 bits)
    note: 'The final 256-bit chaining variable is optionally folded to produce shorter digests by XOR-combining groups of
      32-bit words. Pass count and digest length are both embedded in the padding to prevent extension attacks.

      '
  notes: 'Fixed-length compression functions (one per pass count: 3, 4, or 5 passes of 32 word-operations each over a 1024-bit
    block) underlying HAVAL. Chaining variable = 8 × 32-bit words (256 bits). See haval_hash for the iterated hash function
    and its variable-output-length variants.

    '
