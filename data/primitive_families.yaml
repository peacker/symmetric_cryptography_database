- id: spook
  name: Spook (Clyde-128 / Shadow-512)
  notes: 'Spook''s S1P mode of operation (see spook_aead) is built from two distinct primitives, both modeled as instances
    here: Clyde-128, a 128-bit tweakable block cipher (an LS-design in the SCREAM/Fantomas/Robin lineage) used for tag
    generation, and Shadow-512, a 512-bit unkeyed permutation (a "multiple LS-design", mLS-design, mixing four 128-bit
    LS-design bundles with an added diffusion layer) used as the sponge/duplex permutation. Despite sharing an LS-design
    heritage, the two are structurally distinct (keyed tweakable cipher vs. unkeyed wide permutation) and are used for
    different roles in the mode.

    '
  construction_ids:
  - boolean_operator_network
  round_ids:
  - spook_permutation_round
  target_applications:
  - iot
  - software
  characteristics:
    components:
    - id: xor
    - id: and
    - id: not
    - id: rotation_fixed
    - id: constant
  reference_ids:
  - spook_2019
  process_participations: []
  influences:
  - source_family_id: skinny
    relations:
    - variant_of
    note: Clyde-128's 4-bit S-box is explicitly a variant of SKINNY's S-box, obtained by replacing SKINNY's NOR gates with
      AND gates in the circuit representation while keeping the same 4-bit size.
  - source_family_id: midori
    relations:
    - related_to
    note: Shadow-512's diffusion layer directly reuses the near-MDS 4x4 binary matrix from Midori as its mixing layer.
  - source_family_id: fantomas_robin
    relations:
    - generalization_of
    - improvement_of
    note: Clyde-128 and Shadow-512 are simple extensions of the LS-design framework introduced in the Fantomas/Robin paper,
      adding resistance to invariant attacks and word-level rather than table-based L-boxes.
  - source_family_id: scream_tbc
    relations:
    - variant_of
    note: Clyde-128 is built from the Tweakable LS-design framework introduced as part of the SCREAM CAESAR candidate and
      directly reuses SCREAM's lightweight tweakey scheduling algorithm.
