- id: armadillo
  name: ARMADILLO
  construction_ids:
  - data_dependent_permutation_network
  round_ids:
  - armadillo_round
  target_applications:
  - rfid
  - embedded
  - hardware
  - side_channel_resistant
  characteristics:
    components:
    - id: bit_permutation
    - id: xor
  reference_ids:
  - badel_et_al_2010_armadillo
  - abdelraheem_et_al_2011_armadillo2_cryptanalysis
  - naya_plasencia_peyrin_2012_armadillo2_practical_cryptanalysis
  process_participations: []
  influences: []
  notes: 'Titled "ARMADILLO: a Multi-Purpose Cryptographic Primitive Dedicated to Hardware" (CHES 2010). Its sole
    nonlinear-ish mechanism is data-dependent bit transposition (permutation) of the whole state -- at each of
    J=k steps, selecting between two fixed base permutations sigma_0/sigma_1 based on the data itself -- related to
    the Zemor-Tillich group-based hash construction (a semi-group homomorphism from {0,1}* to a permutation group).
    There is no algebraic S-box at all, unlike LowMC/Zorro''s partial-S-box-layer pattern this database''s SPN
    taxonomy models elsewhere -- ARMADILLO genuinely does not fit that pattern. Genuinely multi-purpose, per the
    paper''s own Section 2: a FIL-MAC, a hash/signature scheme (via strengthened Merkle-Damgard chaining), and a
    PRNG/PRF/stream cipher. An updated variant, ARMADILLO2, is introduced in the same paper''s Section 6 (not
    separately modeled here). Local copy: references/[2010][armadillo][][].pdf (downloaded from the EPFL Infoscience
    institutional repository, not Springer).


    Construction taxonomy decision (previously deferred, todo_manual.txt): tagged data_dependent_permutation_network
    (new level-1 root, primitive_constructions.yaml), added specifically for this mechanism after confirming no
    existing root/leaf fits -- including group_exponentiation_hash (special_case_of advanced_protocol_friendly_
    construction), considered and rejected as too specific to elliptic-curve-style scalar-multiplication/
    exponentiation designs (Zémor-Tillich itself, ARMADILLO''s closest analogue, is a matrix/permutation-group walk
    driven by input bits, not a scalar exponentiation, so even that leaf''s own family would not fit it), and
    key_dependent_table_network, rejected because ARMADILLO''s two permutations sigma_0/sigma_1 are fixed at design
    time (public), with the *data* -- not the key -- selecting between them at each step; KDTN''s FROG/HPC-style
    placeholder families instead derive their tables/permutations from the key once at setup and then apply them
    uniformly. The new root generalizes the mechanism to the actually-named external paradigm it belongs to:
    "data-dependent permutations" (DDP) via "controlled permutation boxes," per Moldovyan et al.''s CP-box cipher
    family (SPECTR-H64, CIKS-1, COBRA-H64/H128 -- none yet modeled in this database), so the new root is reusable if
    any of those get added later rather than being ARMADILLO-specific.


    Cryptanalysis of ARMADILLO2 (the paper''s own recommended variant, Section 6): Abdelraheem, Blondeau,
    Naya-Plasencia, Videau, and Zenner ("Cryptanalysis of ARMADILLO2," ASIACRYPT 2011) give the first published
    attacks, a meet-in-the-middle "parallel matching" technique that inverts the ARMADILLO2 building block for a
    chosen public input given part of the output, yielding key-recovery attacks on the FIL-MAC and stream-cipher
    (PRNG) modes and a (second)-preimage attack on the hash mode, all faster than exhaustive search though still
    close to the generic bound (e.g. the 256-bit-output hash preimage attack needs "either 2^208 computations and
    2^205 memory, or 2^249 computations and 2^45 memory"). Naya-Plasencia and Peyrin ("Practical Cryptanalysis of
    ARMADILLO2," FSE 2012) then found a much cheaper break: a parity-bit invariant preserved through every
    ARMADILLO2 internal permutation gives "a cheap distinguisher" for the stream-cipher mode, weak diffusion under
    attacker-controlled Hamming weight gives a practical free-start collision attack on the compression function,
    and a new "local-linearization" technique (which the authors note "seems to be very efficient on data-dependent
    bit transpositions designs" generally, i.e. plausibly relevant beyond ARMADILLO2) gives a practical semi-free-
    start collision attack on the full hash function -- both experimentally verified, requiring "at most 2^10.2
    operations for 256-bit output version and negligible memory," i.e. under one second on ordinary hardware, plus
    a related-key recovery attack in the stream-cipher mode. Neither attack was independently re-verified in this
    session; both are recorded as read directly from the cited papers. Local copies:
    references/[2011][armadillo][][armadillo2+cryptanalysis].pdf, references/[2012][armadillo][][armadillo2+practical+cryptanalysis].pdf.'
  instances:
  - id: armadillo_default
    name: ARMADILLO
    type: compression_function
    reference_ids:
    - badel_et_al_2010_armadillo
    characteristics: {}
    notes: 2k-bit register (k = c+m, chaining bits c plus message-block bits m); J=k transposition steps per
      invocation. Concrete parameter sizes not confirmed from the sources read for this database.

