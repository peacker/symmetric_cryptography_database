  name: STRIBOBr2 pi Permutation
  notes: 'STRIBOBr2 ("WHIRLBOB")''s 512-bit unkeyed permutation pi, re-derived directly from the Whirlpool hash
    function''s internal round structure and key schedule (same SubBytes/ShiftColumns/MixRows layers, renamed
    S/P/L), extended to 12 rounds (from Whirlpool''s own 10) for a larger security margin now that it is used
    unkeyed as a sponge permutation rather than as Whirlpool''s own Miyaguchi-Preneel compression function.
