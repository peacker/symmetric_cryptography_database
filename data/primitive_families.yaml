      rounds: 20
      block_size_bits: 512
      output_size_bits: 512
    notes: Bernstein's original (2008) 20-round ChaCha block function, with a 64-bit nonce and 64-bit block counter matching
      Salsa20's layout, usable with a 128- or 256-bit key. Superseded in practice by the RFC 7539/8439 profile (chacha20_block_function),
      which fixes the key to 256 bits and changes the nonce/counter split to 96/32 bits.
  - id: chacha20_block_function
    name: ChaCha20 Block Function
    type: update_function
    reference_ids:
