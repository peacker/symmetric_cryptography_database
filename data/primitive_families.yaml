    the Discrete Logarithm Problem on the Pallas curve; the specification explicitly does not claim preimage
    resistance as a property at all ("No other security properties commonly associated with hash functions are
    needed"). Mechanism: message split into 10-bit pieces, each selecting one of 1024 precomputed per-window
    generators, accumulated via incomplete elliptic-curve point addition. No local PDF copy kept (living,
    continuously-updated specification; cite the pinned URL/version in the reference entry).'
