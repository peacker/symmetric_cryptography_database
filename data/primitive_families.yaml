  name: AESQ
  notes: 'AESQ ("Quadrupled AES") is a 512-bit permutation viewed as four parallel 128-bit registers, each round
    essentially applying the AES round function across all four in parallel (4 rounds of AESQ are equivalent to
    4 rounds of AES minus the key additions and the very last round''s MixColumns) -- 20 rounds total, chosen
    for a 256-bit security target. Built as the concrete instantiation of the generic PPAE mode underlying PAEQ.'
