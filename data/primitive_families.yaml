- id: spook
  name: Spook (Clyde-128 / Shadow-512)
  notes: 'Spook''s S1P mode of operation (see spook_aead) is built from two distinct primitives, both modeled as instances
    here: Clyde-128, a 128-bit tweakable block cipher (an LS-design in the SCREAM/Fantomas/Robin lineage) used for tag
    generation, and Shadow-512, a 512-bit unkeyed permutation (a "multiple LS-design", mLS-design, mixing four 128-bit
    LS-design bundles with an added diffusion layer) used as the sponge/duplex permutation. Despite sharing an LS-design
    heritage, the two are structurally distinct (keyed tweakable cipher vs. unkeyed wide permutation) and are used for
    different roles in the mode.

    '
