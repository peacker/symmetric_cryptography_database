  process_participations: []
  influences: []
  notes: 'GOST R 34.11-2012 ("Streebog"/"Stribog", RFC 6986) defines a compression function g_N(h, m) = E(LPS(h XOR
    N), m) XOR h XOR m over a 512-bit chaining value and 512-bit message block -- a Miyaguchi-Preneel-style
    feedforward (the transformed chaining value keys an internal cipher E applied to the message block, with both
    the old chaining value and the message XORed back in). E itself is a 12-round byte-oriented SPN, X[K13] LPS
    X[K12] ... LPS X[K1](m): each round applies the nonlinear substitution Pi to all 64 bytes of the state (S), a
    fixed byte transposition (P), and a GF(2^8) linear diffusion layer (L), with a 512-bit round key XORed in (X).
    The key schedule reuses the same LPS-round structure with fixed round constants C_1..C_12. Two hash-code
    lengths are defined (256 and 512 bits, differing only in IV and truncation); see streebog_hash for the
    variable-length Merkle-Damgard-strengthened iteration (which also accumulates a running checksum Sigma mod
    2^512 of every message block, XORed in at finalization) built on this primitive.'
  instances:
