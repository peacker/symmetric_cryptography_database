  - id: tiger_sbox_8to64
    name: Four S-boxes mapping 8 bits to 64 bits for 64-bit processor speed
    note: 'Tiger''s four S-boxes (t1..t4) each map 8 bits to 64 bits (4 × 256 entries × 8 bytes ≈ 8 KB total). On 64-bit processors,
      one table lookup provides the full nonlinear mixing for one round step, producing a 64-bit output in a single memory
      access.

      '
