- id: gimli
  name: Gimli
  notes: Gimli is a 384-bit permutation operating on a 3x4x32 array of 32-bit words -- not ARX (no modular addition
    anywhere), and not pure_and_rx either, since its T-function uses OR alongside AND (unlike Keccak/Ascon/Xoodoo's
    AND/NOT-only nonlinearity) -- so it carries the broader boolean_operator_network root plus the bitslice_friendly_spn
    facet, rather than the strict pure_and_rx child. Designed as a compact cross-platform foundation for hashing,
    authenticated encryption, and other modes.
  construction_ids:
  - bitslice_friendly_spn
  - boolean_operator_network
  round_ids:
  - gimli_permutation_round
  target_applications:
  - iot
  - software
  characteristics:
    state_size_bits: 384
    components:
    - id: xor
    - id: and
    - id: or
    - id: rotation_fixed
    - id: shift_fixed
    - id: constant
  reference_ids:
  - gimli_2017
  process_participations:
  - process_id: lightweight_crypto_nist_2018_2023
    stage_ids:
    - round_1
    - round_2
    status: candidate
  influences:
  - source_family_id: tea
    relations:
    - related_to
    note: Gimli's round constant is described by its designers as essentially the golden-ratio constant 0x9e3779b9 used in
      TEA, adopted specifically to break the permutation's round-slide symmetry.
  - source_family_id: norx
    relations:
    - improvement_of
    note: 'Gimli''s own design rationale (Sect. 4.2, "Logic operations and shifts"): "The pattern of Gimli operations
      improves upon NORX in three ways. First, Gimli uses a third input c for a⊕b⊕((c∧b)≪1), removing the need for a
      separate xor operation. Second, Gimli uses only two rotations for three of these operations... Third, Gimli varies
      the 1-bit shift distance, improving diffusion compared to NORX." Both replace ARX''s modular addition with an
      AND/XOR/shift approximation; Gimli''s three-input T-function is presented as a direct refinement of NORX''s
      two-input version.'
  - source_family_id: keccak
    relations:
    - inspired_by
    note: 'Gimli''s own design rationale repeatedly frames itself against Keccak''s design philosophy rather than ARX
      designs'' (Sect. 4.7): "Gimli is like Keccak in that it breaks all symmetries within the permutation, rather than
      (as in Salsa, ChaCha, etc.) relying on attention from the mode designer to break symmetries" and (Sect. 4.6) "Like
      Keccak and Ascon, Gimli has degree just 2 in each round." Its 3x4x32 state view (a parallelepiped of lanes, diffused
      column-wise then row-wise) mirrors Keccak''s own 3D lane/sheet/plane state model, though the two permutations'' inner
      nonlinear layers differ (Keccak: 5-bit chi row transform; Gimli: 3-input column T-function).'
  instances:
  - id: gimli_permutation_384
    name: Gimli Permutation (384-bit)
    type: permutation
    characteristics:
      state_size_bits: 384
      rounds: 24
      block_size_bits: 384
      output_size_bits: 384
- id: norx
  name: NORX Permutation
  notes: 'NORX''s G permutation operates on a 4x4 matrix of 32-bit (NORX32) or 64-bit (NORX64) words in column/diagonal
    steps named "as in BLAKE2". Not ARX despite the family resemblance to ChaCha''s quarterround: NORX''s own paper
    (Aumasson, Jovanovic, Neves, "NORX: Parallel and Scalable AEAD") states "The function G of NORX is inspired by the
    quarterround function of the stream cipher ChaCha... NORX adopts this core function almost one-to-one, with the
    only difference being the replacement of the integer addition by z=(x⊕y)⊕((x∧y)≪1)" -- replacing ChaCha''s modular
    addition with an AND/XOR/shift approximation "with the aim to simplify differential cryptanalysis and improve
    hardware efficiency" (the paper''s own abstract: "based on ARX primitives, yet not using modular additions"). Uses
    a plain 1-bit shift rather than a rotation in that AND/XOR term, alongside separate fixed rotations elsewhere in G,
    so it carries the broader boolean_operator_network root rather than the strict pure_and_rx child. See norx_aead
    for the Parallel Duplex Construction built on top of this permutation.

    '
