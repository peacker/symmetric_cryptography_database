  process_participations: []
  influences: []
  notes: 'MiMC (Albrecht, Grassi, Rechberger, Roy, Tiessen, ASIACRYPT 2016) is a family of block ciphers, permutations,
    and a sponge-based hash function (MiMCHash) built by iterating the cube map F(x) = x^3 over a single field element
    of GF(2^n) (n odd) or GF(p), XORing/adding the (repeated) round key and a round constant before each application.
    MiMC-n/n uses r = ceil(n/log2(3)) rounds; MiMC-2n/n embeds the same round function in a balanced Feistel network at
    double the rounds to process larger blocks. Revives and generalizes the 1990s Knudsen-Nyberg cipher (broken by
    Jakobsen and Knudsen''s interpolation attack), surviving by using a much larger number of rounds. Motivated by
    settings (SNARKs, MPC, FHE) where the total number of field multiplications, not circuit depth, is the bottleneck.
    Named as the foundational "Gen I" arithmetization-oriented design alongside LowMC in Roy, Steiner, and Trevisani''s
    3-generation classification (Arion, 2023).'
