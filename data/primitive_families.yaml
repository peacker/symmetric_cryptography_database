    relations:
    - improvement_of
    - same_round_function
    innovative_idea_ids:
    - salsa_arx_quarterround
    - salsa_column_diagonal_mixing
    note: 'ChaCha reorganises the Salsa quarterround to achieve better diffusion per round, improving resistance to differential
      cryptanalysis.

      '
  instances:
  - id: chacha8_block_function
    name: ChaCha8 Block Function
    type: update_function
    reference_ids:
    - bernstein_2008_chacha
    characteristics:
      key_size_bits_min: 128
      key_size_bits_max: 256
      nonce_size_bits: 64
      block_count_bits: 64
      state_size_bits: 512
      rounds: 8
      block_size_bits: 512
      output_size_bits: 512
    notes: Bernstein's original (2008) 8-round ChaCha block function, with a 64-bit nonce and 64-bit block counter matching
      Salsa20's layout, usable with a 128- or 256-bit key.
  - id: chacha12_block_function
    name: ChaCha12 Block Function
    type: update_function
    reference_ids:
    - bernstein_2008_chacha
    characteristics:
      key_size_bits_min: 128
      key_size_bits_max: 256
      nonce_size_bits: 64
      block_count_bits: 64
      state_size_bits: 512
      rounds: 12
      block_size_bits: 512
      output_size_bits: 512
    notes: Bernstein's original (2008) 12-round ChaCha block function, with a 64-bit nonce and 64-bit block counter matching
      Salsa20's layout, usable with a 128- or 256-bit key.
  - id: chacha20_block_function_orig
    name: ChaCha20 Block Function (original)
    type: update_function
    reference_ids:
    - bernstein_2008_chacha
    characteristics:
      key_size_bits_min: 128
      key_size_bits_max: 256
      nonce_size_bits: 64
      block_count_bits: 64
      state_size_bits: 512
      rounds: 20
      block_size_bits: 512
      output_size_bits: 512
    notes: Bernstein's original (2008) 20-round ChaCha block function, with a 64-bit nonce and 64-bit block counter matching
      Salsa20's layout, usable with a 128- or 256-bit key. Superseded in practice by the RFC 7539/8439 profile (chacha20_block_function),
      which fixes the key to 256 bits and changes the nonce/counter split to 96/32 bits.
  - id: chacha20_block_function
    name: ChaCha20 Block Function
    type: update_function
    reference_ids:
    - rfc_7539
    - rfc_8439
    characteristics:
      key_size_bits: 256
      nonce_size_bits: 96
      block_count_bits: 32
      state_size_bits: 512
      rounds: 20
      block_size_bits: 512
      output_size_bits: 512
    notes: The RFC-defined update function transforms a 512-bit ChaCha state through 20 rounds and adds the initial state
      to produce one 512-bit keystream block. RFC 7539/8439's profile, distinct from Bernstein's original ChaCha20 (see
      chacha20_block_function_orig), which used a 64-bit nonce and 64-bit block counter.
