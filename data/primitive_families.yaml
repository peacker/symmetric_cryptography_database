  - cheon_cho_kim_kim_2021_cryptodarkmatter_attacks
  process_participations: []
  influences: []
  notes: 'Titled "Exploring Crypto Dark Matter: New Simple PRF Candidates and Their Applications." Confirmed directly:
    this is a general TECHNIQUE ("mixing linear functions over different small moduli"), not a single named PRF --
    the paper presents several distinctly-named candidates built on it (see instances below), all implementable in
    low ACC0 circuit depth and explicitly framed as a "deterministic variant of Learning Parity with Noise." No
    algebraic S-box at all, and no evidence read confirms any candidate is length-preserving/invertible, so each is
    modeled here as an update_function rather than a block_cipher. "CryptoDarkMatter++" is not a real paper title --
    the closest real citable 2020/2021 follow-up is Cheon, Cho, J.H. Kim, and J. Kim''s "Adventures in Crypto Dark
    Matter" (PKC 2021 / eprint 2020/783; see cheon_cho_kim_kim_2021_cryptodarkmatter_attacks), an attacks-and-fixes
    paper reporting non-trivial-advantage attacks against the basic and alternative Mod-2/Mod-3 weak PRF candidates
    below, not separately modeled here as its own family (a cryptanalysis paper, not a new design). Local copy:
    references/[2018][cryptodarkmatter][][].pdf.'
  instances:
  - id: cryptodarkmatter_construction_3_1
    name: Crypto Dark Matter Construction 3.1 (basic Mod-2/Mod-3 weak PRF)
    type: update_function
    reference_ids:
    - boneh_et_al_2018_cryptodarkmatter
    characteristics: {}
    notes: 'The paper''s main weak-PRF candidate, F_A(x):=map(Ax): a secret mod-2 linear map followed by a public
      mod-3 linear map, depth-2 ACC0[2,3]. Remark 3.2 generalizes this to arbitrary primes p != q.'
  - id: cryptodarkmatter_construction_6_3
    name: Crypto Dark Matter Construction 6.3 (alternative weak PRF)
    type: update_function
    reference_ids:
    - boneh_et_al_2018_cryptodarkmatter
    characteristics: {}
    notes: 'F_k(x) = sum(k_i*x_i mod 2) + sum(k_i*x_i mod 3) (mod 2), a deterministic-LPN-style variant motivated by
      two-party garbled-circuit efficiency; a special case of LWR with constant composite modulus.'
  - id: cryptodarkmatter_construction_7_9
