  reference_ids:
  - blaze_1996_turtle
  process_participations: []
  influences: []
  notes: 'Turtle (Matt Blaze, AT&T Laboratories, "Efficient Symmetric-Key Ciphers Based on an NP-Complete
    Subproblem," preliminary draft, 3 October 1996) is a recursively-structured, variable-block-length Feistel
    block cipher built on top of a "random Feistel network" (RFN) primitive: a standard 4-round Luby-Rackoff
    construction "R = R + f1(L); L = L + f2(R); R = R + f3(L); L = L + f4(R)" whose four round functions f1..f4
    are, at the base case, literal keyed random functions/lookup tables on w-bit words (the paper shows recovering
    the internal state of a 3-round RFN from input/output pairs is NP-complete, via a reduction from Numerical
    Matching with Target Sums). Turtle extends this to arbitrary block lengths by recursion: for an n-bit block
    with n > w, each of the 4 round functions is itself a full Turtle instance on an (n/2)-bit half-block, "so that
    the algorithm''s recursive structure provides a natural mechanism for extending its block length to whatever is
    required." Turtle w/n (word size w, block size n) requires w * 2^w * (n/w)^2 bits of key material; the paper''s
    headline instance, Turtle 8/64 (w=8, n=64), uses 64 random functions and 131,072 bits (16KB) of key material,
    and its reference implementation "encrypts approximately 60,000 blocks per second on a 100MHz Pentium." The
    same paper also describes Hare, a keystream generator built from a single pass through a 4-RFN with active/
    inactive RFN-swapping for extended period, not separately modeled here. Explicitly marked "PRELIMINARY DRAFT -
    DO NOT DISTRIBUTE OR CITE" on its own title page and never located in a separate peer-reviewed published form,
    but it is the exact document Tortuga''s own PHC spec cites as "the Turtle algorithm originally designed by Matt
    Blaze" (see tortuga, mode_families.yaml) and remains the only locatable primary source for Turtle -- read here
    via page-image OCR since the archived PDF''s Type 3 bitmap fonts have no ToUnicode map (pdftotext produces
    garbage). Local copy: references/[1996][turtle][][].pdf (mirrored from the author''s own mattblaze.org; the paper''s
    original crypto.com/papers/turtle.pdf URL, cited by Tortuga''s spec, is dead).'
  instances:
  - id: turtle_8_64
    name: Turtle 8/64
    type: block_cipher
    reference_ids:
    - blaze_1996_turtle
    characteristics:
      block_size_bits: 64
      key_size_bits: 131072
      rounds: 4
      output_size_bits: 64
    notes: 'w=8 (word size), n=64 (block size); 64 keyed 8-bit random functions, 131,072 bits (16KB) of key
      material total, per the paper''s formula w*2^w*(n/w)^2. "rounds: 4" counts the outer Feistel rounds at this
      recursion level only -- the round functions f1..f4 are themselves base-case random-function lookups (w=n/2=32
      would instead recurse into another 4-round Turtle instance per branch).'
