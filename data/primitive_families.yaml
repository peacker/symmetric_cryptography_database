- id: desl
  name: DESL
  notes: 'DESL (DES Lightweight; Leander, Paar, Poschmann, Schramm, FSE 2007, LNCS 4593 pp. 196-210) keeps DES''s
    Feistel round shape, key schedule, and internal per-round P-permutation unchanged. It makes two changes: (1)
    DES''s eight distinct 6-to-4 S-boxes are replaced by a single redesigned S-box (Table 2 of the paper) reused in
    all eight positions -- chosen to satisfy Kim et al.''s design criteria for resistance to differential/linear
    cryptanalysis and the Davies-Murphy attack despite losing S-box diversity; and (2) DES''s outer Initial
    Permutation IP and its inverse IP^-1 are dropped entirely, since the paper states they "do not provide additional
    cryptographic strength, but at the same time require area for wiring" -- "the design of our DESL algorithm is
    exactly the same as for the DES algorithm, except for the (IP) and (IP^-1) wiring and the sbox module." DESL-56
    synthesizes to 1848 GE at 144 clock cycles per block (Table 3 of the paper), 20% less area and 25% less current
    than the paper''s own DES baseline implementation.'
  construction_ids:
  - feistel
  - balanced_feistel
  round_ids:
  - desl_round
  target_applications:
  - constrained_hardware
  - rfid
  characteristics:
    block_size_bits: 64
    components:
    - id: sbox
      params:
        input_bits: 6
        output_bits: 4
    - id: bit_permutation
    - id: xor
  reference_ids:
  - leander_paar_poschmann_schramm_2007_desl
  process_participations: []
  influences:
  - source_family_id: des
    relations:
    - variant_of
    note: DESL keeps DES's Feistel round shape, internal P-permutation, and key schedule entirely unchanged; its two
      differences (one shared S-box instead of eight distinct ones, and dropping the outer IP/IP^-1 wiring) are
      hardware-area optimizations, not fixes to a security weakness, so this is a variant rather than an
      improvement/successor relationship.
  innovative_ideas:
  - id: desl_single_shared_sbox
    name: Single shared S-box
    note: One redesigned 6-to-4 S-box (satisfying strengthened versions of Kim et al.'s criteria) replaces all eight
      of DES's distinct S-boxes, cutting the S-box hardware area at the cost of S-box diversity.
  - id: desl_dropped_initial_permutation
    name: Dropped Initial Permutation (IP/IP^-1)
    note: DES's outer Initial Permutation and its inverse contribute no cryptographic strength (a known fact about
      DES, included purely for 1970s-era hardware wiring convenience); DESL omits both entirely to save the wiring
      area they cost, leaving the internal per-round P-permutation untouched.
  instances:
  - id: desl_56
    name: DESL-56
    type: block_cipher
    reference_ids:
    - leander_paar_poschmann_schramm_2007_desl
    characteristics:
      block_size_bits: 64
      key_size_bits: 56
      rounds: 16
      output_size_bits: 64
    notes: 1848 GE, 144 clock cycles per block encryption, per the paper's own hardware synthesis results.
