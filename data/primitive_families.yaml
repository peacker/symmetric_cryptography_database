    the paper: SNEIKEN128/192/256 (AEAD algorithms, the primary member being SNEIKEN128), SNEIKHA256/384 (cryptographic
    hash functions), and SNEIGEN128/192/256 (an "Entropy Distribution Function" XOF, informational -- limited cryptographic
    security by itself, used e.g. in the R5SNEIK variant of the Round5 post-quantum scheme). The database currently
