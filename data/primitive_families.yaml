    type: update_function
    reference_ids:
    - boneh_et_al_2018_cryptodarkmatter
    characteristics: {}
    notes: 'F''_A(x):=F_A(bin(G*x)) (Remark 7.14), a depth-3 ACC0[2,3] strong-PRF candidate built from the paper''s
      Encoded-Input PRF/Protected EI-PRF framework (Definitions 7.1-7.2), combining the Construction 3.1 weak PRF
      with a linear error-correcting code over Z_3 as the "encoding" step.'

- id: legendre_prf
  name: Legendre PRF
  construction_ids:
  - advanced_protocol_friendly_construction
  - mpc_sharing_friendly
  round_ids:
  - legendre_prf_round
  target_applications:
  - mpc
  characteristics:
    components: []
  reference_ids:
  - grassi_et_al_2016_mpc_friendly
  - beullens_beyne_udovenko_vitto_2020_legendre_prf_cryptanalysis
  process_participations: []
  influences: []
  notes: 'Tier/type decision (previously deferred in todo_manual_revised.txt): modeled as a primitive-tier family,
    type update_function, the same pattern already used for cryptodarkmatter''s own weak-PRF candidates immediately
    above -- a keyed function that is neither a block cipher (not confirmed invertible/length-preserving; in fact
    it is drastically output-compressing, mapping a full field element down to one of three symbols) nor a
    permutation, with no state to update across invocations (a single algebraic evaluation, not an iterated
    construction -- hence round_ids: []). No mode-tier taxonomy extension needed. Confirmed directly (slide deck,
    references/[2020][legendre_prf][][legendre_prf_cryptanalysis].pdf): L_k(x) = ((x+k)/p) in {-1,0,1}, the Legendre symbol of (x+k)
    modulo a prime p, keyed by an additive shift k -- "a pseudorandom function proposed by Grassi et al. (2016)"
    (see grassi_et_al_2016_mpc_friendly), whose own paper analyzes it (alongside the Naor-Reingold PRF and a new
    design, MiMC, already modeled separately in this database) for secret-sharing-based MPC evaluation, motivating
    the mpc_sharing_friendly tag. Documented applications: Ethereum 2.0''s proof-of-custody design, and LegRoast
    signatures (an asymmetric signature scheme citing it as a building block, itself out of scope for this
    database per its own symmetric-primitives-only scope). Cryptanalysis: Beullens, Beyne, Udovenko, and Vitto
    ("Cryptanalysis of the Legendre PRF and Generalizations," ToSC 2020(1)) present key-recovery attacks against
    the Legendre PRF and generalizations (Frobenius PRFs, higher-degree residues); the paper''s own public
    challenge site (legendreprf.org) recorded the 64-bit and 74-bit challenge instances broken using this work''s
    methods.'
