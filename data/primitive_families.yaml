  - id: crisp_hardened_keyschedule_feedback
    name: Hardened feedback key schedule
    note: Uses CRISP itself in feedback mode as a PRNG to derive round subkeys.
  - id: crisp_key_dependent_s2_tables
    name: Key-dependent S2 tables
    note: Generates five 8x32 S2 tables from key-dependent feedback outputs.
  notes: 'CRISP is a 6-round Feistel cipher with 128-bit block and key sizes in the evaluated design. The round function uses
