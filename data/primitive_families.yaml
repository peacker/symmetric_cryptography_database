  notes: Kalyna (competition design, 2007) was submitted by JSC Institute of Information Technologies (Kharkiv) to the Ukrainian
    National Public Cryptographic Competition. It is an SPN cipher in the Rijndael lineage with 128-, 256-, or 512-bit blocks
    and keys of equal or double the block size. The competition variant uses mod-2^32 word addition for key injection and
    10/14/30 rounds (128/256/512-bit blocks). A slight modification — switching to mod-2^64 addition and reducing the 512-bit
    variant to 18 rounds for performance — was standardised as DSTU 7624:2014 (see kalyna_dstu family).
