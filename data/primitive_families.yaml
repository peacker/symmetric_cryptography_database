- id: serpent
  name: Serpent
  notes: Serpent is a conservative 32-round, 128-bit bitsliced SPN and AES finalist, supporting 128-, 192-, and 256-bit keys
    with eight reused 4-bit S-boxes.
  construction_ids:
  - spn
  - full_sbox_layer
  - near_mds_arx_linear_layer
  round_ids:
  - serpent_round
  target_applications:
  - software
  characteristics:
    block_size_bits: 128
    components:
    - id: sbox
      params:
        input_bits: 4
        output_bits: 4
    - id: binary_matrix_mul
    - id: xor
    - id: constant
  reference_ids:
  - anderson_biham_knudsen_1998_serpent
  process_participations:
  - process_id: aes_competition_nist_1997_2000
    stage_ids:
    - round_1
    - round_2
    status: finalist
  influences:
  - source_family_id: square
    relations:
    - related_to
    note: 'Same-team continuation, not a structural derivation: Lars Knudsen co-designed SQUARE
      (1997, with Daemen and Rijmen) the year before co-designing Serpent (1998, with Anderson and
      Biham). Serpent departs sharply from SQUARE''s (and SHARK''s) byte-oriented, 8-bit-S-box
      wide-trail approach, instead combining a full SP-network with dedicated bijective 4-bit
      S-boxes -- a combination not seen in any prior published SPN; 4-bit S-boxes had so far
      appeared only in Feistel designs (e.g. GOST 28147-89). The paper''s own historical account
      (Sect. Appendix A.7) says its linear transformation was likewise not adapted from an earlier
      cipher but arrived at through the authors'' own iterative experimentation (bit-rotations
      first, found avalanche too slow, then a custom transformation refined with their own
      differential/linear search tools). The one externally credited idea is Biham''s software
      bitslicing technique (demonstrated on DES, FSE''97), which shaped Serpent''s goal of an
      SP-network efficiently bitsliceable for a single block. Serpent is thus best read as an
      original combination of these elements rather than a direct descendant of any one prior
      cipher.'
