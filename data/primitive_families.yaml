    note: 'Per the Zcash Protocol Specification: "The motivation for introducing a new discrete-logarithm-based hash
      function (rather than using PedersenHash) is to make efficient use of the lookups available in recent proof
      systems including Halo 2." The security argument is shown to reduce to PedersenHash''s own by "a correspondence
      between Sinsemilla and a vector Pedersen hash."'
