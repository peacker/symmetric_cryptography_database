  - embedded
  characteristics:
    components:
    - id: add_mod
      params:
        modulus: 4294967296
    - id: xor
    - id: rotation_fixed
  reference_ids:
  - beaulieu_et_al_2013_simon_speck
  process_participations: []
  influences:
  - source_family_id: threefish
    relations:
    - inspired_by
    note: 'Directly stated in SPECK''s own paper (Sect. 4.1, p.14): "The SPECK round functions are similar to the
      mixing functions found in the THREEFISH [FLS+10] block cipher," with a footnote detailing the differences:
      "SPECK differs from Threefish in various ways, e.g., it uses fixed vs. round-dependent rotation amounts, employs
      two rotations per round vs. one for the mixing functions, adds key using XOR and does not use word permutations.
      These and other important differences make SPECK significantly lighter and faster than Threefish in both
      hardware and software." (Threefish''s own MIX(x0,x1) = (x0+x1, ROTL(x1,R) XOR (x0+x1)) predates SPECK by five
      years.) The paper otherwise gives no rationale for SPECK''s remaining design choices (SPARX/LAX, Dinu et al.,
      ASIACRYPT 2016, fn. 2: "For SPECK, we can only guess [the rationale] as the designers have not published [it]").
      A similar add-rotate-XOR pairing recurs in ChaCha''s quarterround (a += b; d ^= a; d = ROTL(d, 16); ...) and
      Salsa20''s (b ^= ROTL(a + d, 7); ...), and RC5 established the general "highly flexible, scalable ARX" approach
      earlier still -- noted here as the same broader lineage but too generic on their own to record as separate
      edges. SPECK''s key schedule explicitly reuses its own round function to generate round keys (Sect. 4.2), a
      trait Blowfish''s key schedule had already explored (deriving subkeys by running the cipher itself), though
      SPECK''s paper does not cite Blowfish.'
