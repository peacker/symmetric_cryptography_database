  notes: ADE (Kozhedub Air Force University, Kyiv/Kharkiv) is a Rijndael-based cipher with key-dependent substitution, permutation,
    and linear layers. It supports 128, 192, 256, 320, 512-bit blocks/keys (scalable by 32 bits). The key-dependent operations
    were intended to defeat algebraic attacks, but independent analysis showed that certain round-key values cause synchronous
    ShiftRows shifts across all rows, partitioning the 128-bit block into 4 independent 32-bit streams — a class of weak keys.
