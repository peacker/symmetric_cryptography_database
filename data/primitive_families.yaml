version: 1
primitive_families:
- id: uknit_bc
  name: uKNIT-BC
  construction_ids:
  - spn
  - full_sbox_layer
  - near_mds_arx_linear_layer
  round_ids:
  - uknit_bc_round
  target_applications:
  - ultra_low_latency
  - hardware
  - circuit_depth_constrained
  characteristics:
    block_size_bits: 64
    components:
    - id: sbox
      params:
        input_bits: 4
        output_bits: 4
    - id: binary_matrix_mul
    - id: bit_permutation
    - id: lfsr
      params:
        length: 4
    - id: xor
  reference_ids:
  - hu_et_al_2026_uknit_bc
  process_participations: []
  influences:
  - source_family_id: mantis
    relations:
    - inspired_by
    note: Each 4-bit uKNIT-BC S-box uses the MANTIS S-box as its nonlinear core, composed with independently selected input
      and output bit transpositions. MANTIS matrices were also used as starting points for the genetic search.
  - source_family_id: skinny
    relations:
    - inspired_by
    - related_to
    note: The L_LFSR operation applies the SKINNY-64 4-bit LFSR independently to each nibble of one 64-bit key half before
      the remaining generalized Superposition-Tweakey linear mixing and permutation.
  - source_family_id: prince
    relations:
    - inspired_by
    - related_to
    note: PRINCE matrices were used, together with MANTIS matrices, as starting points for the genetic search that produced
      the uKNIT-BC linear layers.
  innovative_ideas:
  - id: uknit_round_non_alignment
    name: Round-by-round non-aligned SPN construction
    note: All twelve substitution layers and eleven linear layers may differ, replacing repetition of one aligned round function
      with a genetically optimized sequence.
  - id: uknit_gstk_key_schedule
    name: Generalized Superposition-Tweakey key schedule
    note: gSTK generalizes STK to bit-oriented ciphers and derives thirteen 64-bit round keys from two 64-bit master-key halves
      using sparse matrices, a nibble permutation, and a 4-bit LFSR.
  notes: uKNIT-BC is a 64-bit-block, 128-bit-key, 12-round ultra-low-latency SPN. It contains twelve distinct substitution
    layers, eleven distinct sparse 64-by-64 binary linear layers, and thirteen round-key additions. The last round omits the
    linear layer. Unlike conventional iterative ciphers, its components are optimized independently round by round under the
    uKNIT design framework.
  instances:
  - id: uknit_bc_64_128
    name: uKNIT-BC
    type: block_cipher
    reference_ids:
    - hu_et_al_2026_uknit_bc
    characteristics:
      block_size_bits: 64
      key_size_bits: 128
      output_size_bits: 64
      rounds: 12
    notes: Concrete uKNIT ultra-low-latency block cipher with 12 substitution layers, 11 sparse binary linear layers, and
      13 round-key additions.
- id: sha0
  name: SHA-0 Compression Function
  construction_ids:
  - davies_meyer
  round_ids:
  - sha0_round
  target_applications: []
  characteristics:
    block_size_bits: 512
    state_size_bits: 160
    components:
    - id: add_mod
      params:
        modulus: 4294967296
    - id: xor
    - id: rotation_fixed
    - id: and
    - id: or
    - id: not
    - id: constant
  reference_ids:
  - nist_1993_fips180_sha0
  process_participations: []
  influences:
  - source_family_id: md4
    relations:
    - inspired_by
    - improvement_of
    note: SHA-0 follows the MD4-style Merkle–Damgård lineage while expanding the state and compression function to 160 bits
      and 80 steps.
  innovative_ideas:
  - id: sha0_160_bit_md4_lineage
    name: 160-bit, 80-step MD4-derived compression function
    note: SHA-0 introduced the five-word state and four-phase 80-step structure later retained by SHA-1.
  notes: Fixed-length compression function hashing a 512-bit block plus 160-bit chaining value to a new 160-bit chaining value
    in 80 steps. See sha0_hash for the iterated, variable-length hash function.
  instances:
  - id: sha0_compression
    name: SHA-0 Compression Function
    type: compression_function
    reference_ids:
    - nist_1993_fips180_sha0
    characteristics:
      output_size_bits: 160
      block_size_bits: 512
      state_size_bits: 160
      rounds: 80
    notes: Fixed-length compression step mapping a 512-bit message block and 160-bit chaining value to a new 160-bit chaining
      value; iterated by the SHA-0 hash function over arbitrary-length input.
- id: tcast
  name: tCAST
  construction_ids:
  - feistel
  - balanced_feistel
  round_ids:
  - tcast_round
  target_applications: []
  characteristics:
    components:
    - id: sbox
      params:
        input_bits: 8
        output_bits: 32
    - id: xor
  reference_ids:
  - rijmen_preneel_1997_tcast_tloki
  - wu_bao_deng_ye_1998_trapdoor_cryptanalysis
  process_participations: []
  influences:
  - source_family_id: cast128
    relations:
    - variant_of
    - inspired_by
    - related_to
    note: tCAST modifies CAST-family round-function S-boxes to share a hidden linear relation. The base construction is a
      64-bit CAST-style Feistel cipher.
  innovative_ideas:
  - id: hidden_linear_sbox_trapdoor
    name: Secret linear approximations embedded in large S-boxes
    note: Knowledge of hidden S-box construction parameters reveals strong linear approximations, while the full linear approximation
      tables are intended to be impractical to inspect exhaustively.
  notes: tCAST is a research family of deliberately trapdoored CAST variants proposed by Rijmen and Preneel in 1997. The 64-bit
    form uses four 8-to-32-bit S-boxes sharing a secret linear approximation. The paper also gives an explicit 16-round, 80-bit-block
    example using four 10-to-40-bit S-boxes, and discusses natural extensions to 128-bit blocks. It is not intended for deployment.
  instances:
  - id: tcast_64
    name: tCAST-64
    type: block_cipher
    reference_ids:
    - rijmen_preneel_1997_tcast_tloki
    - wu_bao_deng_ye_1998_trapdoor_cryptanalysis
    characteristics:
      block_size_bits: 64
      output_size_bits: 64
    notes: CAST-style research construction using four trapdoored 8-to-32-bit S-boxes; round count and key schedule depend
      on the selected CAST variant.
  - id: tcast_80_16
    name: tCAST-80/16
    type: block_cipher
    reference_ids:
    - rijmen_preneel_1997_tcast_tloki
    characteristics:
      block_size_bits: 80
      output_size_bits: 80
      rounds: 16
    notes: Explicit example from the paper using four trapdoored 10-to-40-bit S-boxes.
- id: tloki
  name: tLOKI
  construction_ids:
  - feistel
  - balanced_feistel
  round_ids:
  - tloki_round
  target_applications: []
  characteristics:
    block_size_bits: 64
    components:
    - id: sbox
      params:
        input_bits: 12
        output_bits: 8
    - id: bit_permutation
    - id: xor
  reference_ids:
  - rijmen_preneel_1997_tcast_tloki
  - wu_bao_deng_ye_1998_trapdoor_cryptanalysis
  process_participations: []
  influences:
  - source_family_id: loki
    relations:
    - variant_of
    - inspired_by
    note: tLOKI embeds correlated nonlinear relations across the four expanded LOKI91 S-box inputs while retaining its 64-bit
      Feistel framework.
  innovative_ideas:
  - id: tloki_round_function_trapdoor
    name: Round-level trapdoor hidden across expanded S-box inputs
    note: The trapdoor is not visible in an individual 12-to-8-bit S-box; it emerges from nonlinear relations coordinated
      across all four S-box applications in the LOKI91 expansion structure.
  notes: tLOKI is the deliberately trapdoored LOKI91 variant defined by Rijmen and Preneel in 1997. It uses the LOKI91 64-bit
    block, 64-bit key, 16-round Feistel structure and four applications of a 12-to-8-bit S-box. The trapdoor is embedded in
    the complete round function and is not intended for deployment.
  instances:
  - id: tloki_64
    name: tLOKI
    type: block_cipher
    reference_ids:
    - rijmen_preneel_1997_tcast_tloki
    - wu_bao_deng_ye_1998_trapdoor_cryptanalysis
    characteristics:
      block_size_bits: 64
      key_size_bits: 64
      output_size_bits: 64
      rounds: 16
    notes: Trapdoored LOKI91 research variant with a round-level hidden correlation.
- id: bea1
  name: BEA-1
  construction_ids:
  - spn
  - full_sbox_layer
  - near_mds_arx_linear_layer
  round_ids:
  - bea1_round
  target_applications: []
  characteristics:
    block_size_bits: 80
    components:
    - id: xor
    - id: sbox
      params:
        input_bits: 10
        output_bits: 10
    - id: word_permutation
      params:
        word_size_bits: 10
    - id: binary_matrix_mul
    - id: constant
  reference_ids:
  - bannier_filiol_2017_bea1
  - bannier_filiol_2017_partition_trapdoor
  process_participations: []
  influences:
  - source_family_id: aes
    relations:
    - inspired_by
    - related_to
    note: BEA-1 deliberately mirrors the AES sequence of key addition, parallel substitution, row shifting, and column mixing,
      but operates on eight 10-bit bundles.
  - source_family_id: paterson_trapdoor_cipher
    relations:
    - inspired_by
    - generalization_of
    - related_to
    note: The partition-based approach underlying BEA-1 explicitly generalizes Paterson's hidden-block-system trapdoor from
      a DES-like Feistel cipher to an AES-like substitution-permutation network.
  innovative_ideas:
  - id: bea1_partition_backdoor
    name: Partition-based mathematical backdoor
    note: The round components preserve a hidden partition that enables key recovery for an attacker who knows the trapdoor
      while remaining resistant to ordinary differential, linear, and statistical screening.
  notes: BEA-1 (Backdoored Encryption Algorithm version 1) is an explicitly malicious research cipher, not a deployable primitive.
    It encrypts 80-bit blocks under 120-bit keys using eleven AES-like rounds, four 10-bit S-boxes, and a hidden partition-based
    trapdoor. Its authors state that it is absolutely unsuitable for protecting information.
  instances:
  - id: bea1_80_120
    name: BEA-1
    type: block_cipher
    reference_ids:
    - bannier_filiol_2017_bea1
    characteristics:
      block_size_bits: 80
      key_size_bits: 120
      output_size_bits: 80
      rounds: 11
    notes: Explicitly backdoored research cipher with twelve 80-bit round keys and eleven rounds; unsuitable for real protection.
- id: paterson_trapdoor_cipher
  name: Paterson trapdoor cipher
  construction_ids:
  - feistel
  - balanced_feistel
  round_ids:
  - paterson_trapdoor_round
  target_applications: []
  characteristics:
    block_size_bits: 64
    components:
    - id: linear_transform
    - id: xor
    - id: sbox
      params:
        input_bits: 6
        output_bits: 4
        count: 8
    - id: bit_permutation
  reference_ids:
  - paterson_1999_imprimitive_trapdoor
  process_participations: []
  influences:
  - source_family_id: des
    relations:
    - variant_of
    - inspired_by
    note: Paterson retains DES's 64-bit Feistel layout, expansion E, permutation P, and eight 6-to-4-bit S-box positions,
      but substitutes specially designed S-boxes, doubles the rounds to 32, and proposes an 80-bit session key.
  innovative_ideas:
  - id: imprimitive_group_trapdoor
    name: Hidden imprimitive-group block-system trapdoor
    note: The round functions preserve a concealed nontrivial block system. Knowing it permits plaintext recovery and, with
      a suitable key schedule, divide-and-conquer recovery of the full key despite conventional linear and differential screening.
  notes: This deliberately weak 1999 research cipher is a concrete DES-like example, not a deployable primitive. Its paper
    specifies the round function and S-boxes but deliberately leaves selection of the 80-bit-to-round-key schedule open.
  instances:
  - id: paterson_trapdoor_64_80
    name: Paterson trapdoor cipher
    type: block_cipher
    reference_ids:
    - paterson_1999_imprimitive_trapdoor
    characteristics:
      block_size_bits: 64
      key_size_bits: 80
      output_size_bits: 64
      rounds: 32
    notes: Concrete DES-like research cipher with a hidden imprimitive block system; the paper leaves the exact key schedule
      unspecified.
- id: parity_check_des_variants
  name: Parity-check DES/Triple-DES variants
  construction_ids:
  - feistel
  - balanced_feistel
  round_ids:
  - parity_check_des_round
  target_applications: []
  characteristics:
    block_size_bits: 64
    components:
    - id: linear_transform
    - id: xor
    - id: sbox
      params:
        input_bits: 6
        output_bits: 4
        count: 8
    - id: bit_permutation
  reference_ids:
  - angelova_borissov_2013_parity_check_des
  process_participations: []
  influences:
  - source_family_id: des
    relations:
    - variant_of
    - related_to
    note: The experiments modify DES and Triple-DES only by replacing each S-box's fourth output coordinate with a parity
      check of the other three; the standard Feistel structure and surrounding permutations remain.
  innovative_ideas:
  - id: parity_check_sbox_backdoor
    name: Non-surjective parity-check S-box backdoor
    note: Every modified S-box maps into an eight-element affine parity subspace. This preserved structure enables ciphertext-only
      recovery of redundant plaintext without recovering the encryption key.
  notes: This descriptive family represents the deliberately damaged DES and Triple-DES instances evaluated by Angelova and
    Borissov; their paper does not assign them a standalone cipher name.
  instances:
  - id: parity_check_des
    name: Parity-check DES
    type: block_cipher
    reference_ids:
    - angelova_borissov_2013_parity_check_des
    characteristics:
      block_size_bits: 64
      key_size_bits: 56
      output_size_bits: 64
      rounds: 16
    notes: Deliberately modified DES using non-surjective parity-check S-boxes.
  - id: parity_check_3des
    name: Parity-check Triple-DES
    type: block_cipher
    reference_ids:
    - angelova_borissov_2013_parity_check_des
    characteristics:
      block_size_bits: 64
      output_size_bits: 64
      rounds: 48
    notes: Triple-DES experiment using the same deliberately modified parity-check S-boxes; the paper studies ciphertext-only
      plaintext recovery in ECB mode.
- id: cham
  name: CHAM
  construction_ids:
