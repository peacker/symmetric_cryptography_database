  reference_ids:
  - kuznyechik_ref
  process_participations: []
  influences:
  - source_family_id: streebog
    relations:
    - inspired_by
    note: 'Concrete component reuse, not a stated citation (RFC 7801 names no predecessor anywhere): Kuznyechik''s
      8-bit substitution π is byte-for-byte identical to the Pi substitution in Streebog (GOST R 34.11-2012, RFC
      6986), the sibling Russian hash standard approved three years earlier by the same design effort -- confirmed
      directly against both RFCs'' own published S-box tables (both begin 252, 238, 221, 17, 207, 110, 49, 22, 251,
      196, 250, 218, ...), and independently documented by Biryukov, Perrin, and Udovenko ("Reverse-Engineering the
      S-Box of Streebog, Kuznyechik and STRIBOBr1", EUROCRYPT 2016), who reverse-engineered the shared S-box''s
      undisclosed internal structure (a 2-round Feistel-like construction over GF(2^4)).'
  - source_family_id: khazad
    relations:
    - related_to
    note: 'Vidali, Nikolic, and Pieprzyk ("Are the XTEA and Kuznyechik ciphers vulnerable to the differential
      equivalence attack?", 2015, eprint.iacr.org/2015/096) note: "It is interesting to note that Kuznyechik bares
      a lot of resemblance with one of the AES predecessors, Khazad. In particular, both ciphers employ an iterative
      SPN structure for updating the input block state, where the adopted linear transformation has an optimal
      diffusion properties. Also, they both use Fiestel network for the round keys generation. While in Kuznyechik,
      two round keys are generated after eight rounds of execution, only one round of execution separates
      consecutive round keys in Khazad. They also differ in that Khazad employs involution Sboxes and linear
      transformation, and it does not use a linear transformation in the last round." This is a documented,
      specific side-by-side structural comparison (not a bare "both are SPN" claim), but the paper stops short of
      claiming Kuznyechik was actually derived from Khazad -- recorded as related_to rather than inspired_by.'
  notes: 'Kuznyechik (Grasshopper; GOST R 34.12-2015) is the Russian national 128-bit block cipher standard with a 256-bit
    key and 10 rounds. Its SPN structure applies an 8-bit S-box (π), a bit-permutation (τ), a linear transform (λ) over GF(2)^128
    based on a self-dual [16,8,9] linear code, and XOR key addition. An earlier edge crediting Rijndael/AES for this
    (on the basis that both are byte-oriented wide-trail SPNs) was removed as an unsupported "shared abstract
    paradigm" claim -- RFC 7801 cites no predecessor, and Biryukov/Perrin/Udovenko''s reverse-engineering of π found
    a hidden Feistel-like construction unrelated to how AES''s S-box is built (inversion in GF(2^8) plus an affine
    map), which argues against AES-specific lineage rather than for it.'
