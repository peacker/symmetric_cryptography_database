    relations:
    - variant_of
    note: 'Masta is described by Niu et al. ("SoK: FHE-Friendly Symmetric Ciphers and Transciphering", 2025) as "an Fp
      variant of the Z2 cipher Rasta," replacing Rasta''s bit-based full non-linear layer and binary matrix with a
      cube-map non-linear layer and a random matrix over a larger prime field.'
  notes: 'Masta is an Fp (modular-arithmetic) HE-friendly block cipher, replacing Rasta''s GF(2) structure with a
    cube-map non-linear layer, aiming for better arithmetic efficiency under FHE schemes that natively support Fp
    operations (BGV/BFV). Its linear layer is cheaper than a fully random matrix: multiplication by a random nonzero
    element of F_(t^n) (a structured, near-circulant matrix), needing only O(log M) random bits per encryption vs.
    Rasta''s O(log^2 M). Its quadratically-growing homomorphic plaintext-ciphertext multiplication cost (in block
    size) is a limitation later addressed by HERA (component-wise-multiplied randomized key schedule instead of a
    randomized linear layer) and by Pasta (Dobraunig, Grassi, Helminger, Rechberger, Schofnegger, Walch, 2023, not
    separately modeled in this database as a mode-tier family, though its Pasta-pi permutation is modeled as
    pasta_pi) -- Pasta''s own paper explicitly frames Masta as independent, concurrent work, not a predecessor it
    "succeeds," so no direct lineage edge is asserted between them. Local copy: references/[2020][masta][][].pdf.'
