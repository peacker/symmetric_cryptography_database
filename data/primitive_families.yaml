- id: rc5
  name: RC5
  notes: 'RC5 is a parameterized ARX block cipher distinguished by data-dependent rotations, originally designed by Ron Rivest
    and presented at FSE 1994; RFC 2040 (1996) later described common 32-bit-word profiles for use in CBC/CTS modes. Each
    round updates the two w-bit halves A, B in turn: A = ((A XOR B) <<< B) + S[2i], then B = ((B XOR A) <<< A) + S[2i+1]
    -- i.e. each half is transformed by an ARX round function keyed on the other half, a modified/non-classical Feistel
    structure (tagged here as plain ''feistel'', not ''balanced_feistel'', since both halves are updated per round rather
    than one half via a single F folded into the other and swapped). Rivest''s original paper never uses the word "Feistel"
    and frames the design purely around data-dependent rotations, so this structural classification is a curator judgment,
    not a cited claim.

    '
  construction_ids:
  - feistel
  - arx_permutation_network
  - data_dependent_rotation_arx
  - modadd_key_injection_arx
  - pure_arx_no_constants
  round_ids:
  - rc5_round
  target_applications:
  - software
  characteristics:
    components:
    - id: xor
    - id: rotation_variable
    - id: add_mod
      params:
        modulus: 4294967296
  reference_ids:
  - rivest_1994_rc5
  - baldwin_rivest_1996_rc5
  process_participations: []
  influences:
  - source_family_id: des
    relations:
    - related_to
    note: Rivest explicitly frames RC5 as a tunable, parameter-matched alternative to DES, proposing RC5-32/16/7 as an equivalent
      replacement with the same 64-bit block size, round count, and 56-bit key length, while its parameterization addresses
      DES's fixed, non-upgradable key size.
