    notes: A non-standard round count between Bernstein's original ChaCha12 and ChaCha20, not defined in Bernstein's
      own paper; adopted by the Calico AEAD family as its key-derivation and stream-generation primitive.
  - id: chacha12_block_function
    name: ChaCha12 Block Function
    type: update_function
