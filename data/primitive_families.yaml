    note: Concurrent "Gen II" arithmetization-oriented block cipher also built on a power-map non-linearity, per Roy,
      Steiner, and Trevisani's 3-generation AO classification (Arion, 2023).
  notes: 'HadesMiMC is the keyed block-cipher instantiation of the HADES design strategy (an SPN alternating full
    S-box rounds, for resistance to statistical attacks, with partial S-box rounds, for reduced cost) over GF(p),
    using a power-map S-box x^alpha (alpha the smallest integer >= 3 coprime to p-1, typically 3 or 5) and a Cauchy
