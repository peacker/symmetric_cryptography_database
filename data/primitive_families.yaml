  - digital_signatures
  - encryption
  - hardware
  - software
  influences:
  - source_family_id: rijndael
    relations:
    - improvement_of
    note: 'Kalyna is explicitly Rijndael-based. Main differences: 4 random S-boxes (vs. single algebraic AES S-box), 8×8 MDS
      (vs. 4×4), alternating XOR/mod-2^64 key injection, larger block/key sizes (up to 512 bits), and a new self-similar key
      schedule.'
  innovative_ideas:
  - id: kalyna_8x8_mds
    name: 8×8 MDS matrix (branch number 9) over GF(2^8)
    note: Kalyna replaces Rijndael's 4×4 MDS with an 8×8 MDS matrix, giving branch number BM=9. For every 2 consecutive rounds
      this guarantees ≥9 active S-boxes, yielding EDP≤2^{-230} for the 128-bit variant.
  - id: kalyna_dual_key_injection
    name: Alternating XOR and modulo 2^64 key injection
    note: Odd rounds inject the subkey via XOR (σ); even rounds via mod-2^64 word addition (χ). Pre- and post-whitening use
      mod-2^64 addition. This makes Kalyna a non-Markov cipher, complicating differential analysis and providing algebraic
      non-linearity.
  - id: kalyna_random_sboxes
    name: 4 randomly generated 8-bit S-boxes selected by DC/LC/degree criteria
    note: 'S-boxes were drawn from a hardware RNG and filtered to satisfy: max XOR DP ≤ 2^{-5}, max linear bias ≤ 2^{-3},
      algebraic degree=7. The degree criterion prevents XL/XSL algebraic attacks that potentially threaten the AES S-box.'
  - id: kalyna_self_similar_key_schedule
    name: Key schedule built from the cipher's own round function
    note: Round keys are generated by encrypting per-variant constants Ci with the master key KM using Kalyna's own round
      operations. This ensures key schedule security is tied to the cipher strength and provides resistance to related-key
      and slide attacks.
  process_participations:
  - process_id: ukrainian_national_cryptographic_competition_2007_2010
    stage_ids:
    - submission
    - finalist
    - winner
    status: winner
  reference_ids:
  - oliynykov_2010_ukraine_competition
  round_ids:
  - kalyna_round
  notes: Kalyna (competition design, 2007) was submitted by JSC Institute of Information Technologies (Kharkiv) to the Ukrainian
