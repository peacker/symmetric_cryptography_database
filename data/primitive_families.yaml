    name: 'σ-function message schedule (32-bit: SHA-224/256; 64-bit: SHA-384/512)'
    note: SHA-256 expands 16 words to 64 using σ0 = ROTR-7 ⊕ ROTR-18 ⊕ SHR-3 and σ1 = ROTR-17 ⊕ ROTR-19 ⊕ SHR-10. SHA-512
      uses 64-bit analogues (σ0 = ROTR-1 ⊕ ROTR-8 ⊕ SHR-7; σ1 = ROTR-19 ⊕ ROTR-61 ⊕ SHR-6) expanding to 80 words. The combination
      of rotations and shifts provides better diffusion than SHA-1's single ROTL.
  - id: sha2_prime_constants
    name: Round constants derived from fractional parts of cube roots of primes
    note: SHA-256 uses 64 constants K[0..63] (32-bit, cube roots of first 64 primes); SHA-512 uses 80 constants K[0..79] (64-bit).
