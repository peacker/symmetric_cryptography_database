    block_size_bits_max: 448
    rounds: 5
  reference_ids:
  - cho_et_al_2021_hera
  process_participations: []
  influences:
  - source_family_id: rasta
    relations:
    - related_to
    note: Like Rasta and Masta, HERA is a full-state-nonlinear-layer FHE-friendly cipher over Fp, but replaces their
      freshly-regenerated random matrix per round with a fixed MDS matrix, per Niu et al.'s SoK classification.
  - source_family_id: masta
    relations:
    - related_to
    note: HERA introduces randomness via a component-wise multiplication of the round key with a randomized vector in
      place of Masta's random matrix, reducing homomorphic plaintext-ciphertext multiplication cost from quadratic to
      linear in the block size, per Niu et al.'s SoK classification.
  notes: 'HERA is an Fp HE-friendly block cipher proposed alongside the RtF (Real-to-Finite-field) transciphering
    framework for approximate (CKKS) homomorphic encryption. Unlike Masta/Pasta, its linear layer is a fixed,
    AES-inspired MDS matrix (not randomized); randomness is instead introduced entirely via a randomized key schedule
    -- multiplying the round key component-wise with a fresh random nonzero vector per round, drawn from a
    nonce-seeded XOF -- reducing per-block homomorphic plaintext-ciphertext multiplications from quadratic to linear
    in the block size. The single name "HERA" is used, confirmed directly from the paper, for both the fixed-length
    keyed permutation and the overall counter-mode stream cipher built on it (no feed-forward step, unlike Rasta --
    the key enters only via the randomized key schedule, never as the permutation input). An algebraic attack
    exploiting round-key collisions (Liu, Kalam, Sarkar, Meier, 2024) breaks its 192/256-bit security claims but
    leaves the 128-bit claim intact. Local copy: references/[2020][hera][][].pdf.'
