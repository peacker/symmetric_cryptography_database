    - inspired_by
    note: 'NORX''s own paper: "The function G of NORX is inspired by the quarterround function of the stream cipher
      ChaCha... NORX adopts this core function almost one-to-one, with the only difference being the replacement of
      the integer addition by z=(x⊕y)⊕((x∧y)≪1)." The paper also names its column-step/diagonal-step round
      arrangement "as in BLAKE2" -- a naming-convention borrowing, distinct from the ChaCha-derived arithmetic itself.'
