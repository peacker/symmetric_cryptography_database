  - source_family_id: photon
    relations:
    - inspired_by
    note: CUBE's recursive, quasi-involutive MDS diffusion is built the same way as PHOTON's, using an iterative generalized-Feistel
      approach, differing only in that CUBE's underlying matrix is not a companion matrix.
  notes: CUBE Cipher is a family of quasi-involutive, easy-to-mask lightweight block ciphers (Berger, Francq, and Minier,
    C2SI 2015) organized as an n x n x n bit cube. Each round applies a subkey XOR, a layer of parallel involutive n-bit S-boxes,
    a quasi-involutive MDS diffusion layer, and one of two permutation choices (CUBE_AES or CUBE), with instantiations at
    n=4 (64-bit block, 128-bit key, 15 rounds), n=5, and n=6. Involutive components make decryption near-free to implement
    alongside encryption.
