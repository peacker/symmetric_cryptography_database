- id: salsa20
  name: Salsa20 Update Function
  notes: 'Bernstein''s 2005 specification formally defines three functions built up from bottom to top: the "Salsa20 hash
    function" (Section 8), a fixed 64-byte-to-64-byte transform Salsa20(x) = x + doubleround^10(x); despite the "hash" name
    this is not a cryptographic hash function -- it takes no variable-length input and offers no collision-resistance claim.
    It is a fixed-length, unkeyed permutation-plus-feedforward update function, structurally similar to a Davies-Meyer compression
    function (the output of an invertible transform is added back to its own input) though built from a public permutation
    rather than an externally-keyed block cipher. The "Salsa20 expansion function" (Section 9) invokes that same core with
    its 64-byte input populated from fixed constants, a 128- or 256-bit key, and a 16-byte nonce/counter block -- this is
    the actual per-block keystream generator, modeled here as the family''s instances. The variable-length "Salsa20 encryption
    function" (Section 10), which XORs the expansion function''s output stream with the plaintext, is the directly-usable
    stream cipher and lives at the mode tier (see salsa20_stream). The family paper (2007/2008) additionally defines the
    reduced-round Salsa20/8 and Salsa20/12 variants alongside the full Salsa20/20.

    '
  construction_ids:
  - arx_permutation_network
  - fixed_rotation_arx
  - pure_arx_no_constants
  round_ids:
  - salsa_quarterround
  target_applications:
  - software
  characteristics:
    state_size_bits: 512
    components:
