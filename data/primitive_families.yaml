    name: CS-Cipher-64
    type: block_cipher
    reference_ids:
    - cs_cipher_ref
    characteristics:
      block_size_bits: 64
      key_size_bits: 128
      output_size_bits: 64
      rounds: 8
    notes: CS-Cipher with representative 128-bit key; the paper allows any key length up to 128 bits, zero-padded.
