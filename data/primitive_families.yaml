  - bouvier_et_al_2025_skyscraper_v2
  process_participations: []
  influences:
  - source_family_id: reinforced_concrete
    relations:
    - related_to
    note: '"Replacing the SPN-based scheme with a Feistel network allows using non-invertible quadratic transformations,
      whereas the SPN would require power maps of degree 5 and higher [GKR+21]" -- GKR+21 is Reinforced Concrete,
      per the paper''s own reference-list context; Skyscraper''s Bars function is explicitly non-invertible, unlike
      Reinforced Concrete/Monolith/Tip5''s, which is why Skyscraper needs the surrounding Feistel network for overall
      invertibility.'
  - source_family_id: monolith
    relations:
    - related_to
    note: '"We have also learned from MiMC and Monolith [GKL+24] that the Feistel structure provides sufficient
      cryptographic strength if used with care, even though those designs do not employ the Montgomery technique
      for performance."'
  notes: 'Targets large prime fields (p >= 2^248) for elliptic-curve-based SNARKs, explicitly choosing a Feistel
    network over an SPN specifically to allow non-invertible nonlinear mappings. Alternates a low-degree "Square"
    round ((xL,xR) -> (xR + (xL)^2/sigma + gamma_i, xL), using Montgomery multiplication) with a lookup-based "Bars"
    round ((xL,xR) -> (xR + B''(xL) + gamma_i, xL), an 8-bit S-box per chunk then rotate); kappa >= 124-bit security,
    base state F_p^2 (n in {1,2,3}), extended to wider states via a Monolith-like Type-3-Feistel + MDS-matrix
    combination. A later eprint revision, "Skyscraper-v2," confirmed directly, raises the round count from 10 to 18
    ("we update the round number from 10 to 18, introducing 4 additional square rounds at the beginning and the end
    of the permutation") to defeat a rebound distinguisher (Bak, 2025) exploiting the original''s 2-Feistel-round
    middle section, raising the BLS12-381-scalar-field-pair hashing time from 135ns to 256ns. Both versions'' PDFs
    are now available locally. Local copies: references/[2025][skyscraper][][].pdf (original TCHES) and
    references/[2025][skyscraper][][v2].pdf (hardened revision).'
