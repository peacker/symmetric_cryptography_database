    256-, and 512-bit blocks and keys. The round function applies modular key addition, S-box layer, and 8×8 MDS multiplication.
    Initial/final whitening adds resistance to nR-style differential attacks. The key schedule derives round keys CS-Cipher-style
    by running the round function on the master key. No effective attacks were found, but Labyrinth—like AES—can be described
    by an overdefined system of degree-2 equations; absence of a full formal security proof led to its non-selection.
