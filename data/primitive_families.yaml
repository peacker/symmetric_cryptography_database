  reference_ids:
  - dobraunig_kales_rechberger_schofnegger_zaverucha_2022_rain
  - baum_et_al_2024_mandarain
  process_participations: []
  influences: []
  notes: 'A tailor-made one-way function introduced alongside the MPC-in-the-head-based signature scheme Rainier
    ("combining a new one-way function called Rain with a Banquet-like proof system," CCS 2022) -- "the first
    MPCitH-based signature scheme which can produce signatures that are less than 5 KB in size," per its own paper.
    A later VOLE-in-the-head scheme, MandaRain (ASIACRYPT 2024), is separately "based on ... Rain." Neither Rainier
    nor MandaRain is modeled as its own family here, since both are signature schemes/protocols built on this
    primitive rather than symmetric primitives in their own right. Confirmed directly: Rain is a keyed permutation
    over F_(2^n) ("we define a keyed permutation F_k(x) consisting of a nonlinear operation S and a constant addition
    ... together with a linear layer"), S(x)=x^(-1) (field inversion) plus a deliberately unstructured/dense random
    linear layer (not the paper''s own "compression function" -- that term is never used; it becomes a one-way
    function only via the generic block-cipher-to-OWF recipe f_x(k):=E_k(x), fixing the plaintext and treating the
    key as the OWF domain). "We emphasize again that Rain is not a classical block cipher, and is only intended to be
    used... for a MPCitH proof system." Rain3/Rain4 (3 or 4 rounds) over F_2^128/192/256. Local copy:
    references/[2021][rain][][].pdf.'
