      block_size_bits: 128
      key_size_bits: 128
      output_size_bits: 128
    notes: 32-bit-processor instance benchmarked against AES/Rijndael on ARM (RISC-32) in the original paper.
- id: iceberg
  name: ICEBERG
  construction_ids:
  - spn
