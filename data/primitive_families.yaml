- id: bksq
  name: BKSQ
  notes: 'BKSQ (Daemen, Rijmen, CARDIS 1998/LNCS 1820, 2000) is, per its own paper, "a generalisation of the Square
    cipher structure": Square''s round transformation only supports block lengths of 8n^2 bits (e.g. 128 bits for
    n=4), so BKSQ generalizes the round transformation to allow arbitrary block lengths of 8nm bits "by changing the
    linear layer in the round transformation", without sacrificing cryptographic strength or implementation
    efficiency. Designed especially for smart cards; its 96-bit block length was chosen specifically to make it usable
    as a 2nd-preimage-resistant one-way function -- large enough to be secure (unlike 64-bit block ciphers of the
    era) without the extra cost of a full 128-bit block.

    '
