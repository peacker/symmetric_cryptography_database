    note: Bleep64 is stated to be a slight improvement over its predecessor BeepBeep (FSE 2002), retaining its clock-controlled-LFSR-plus-nonlinear-filter
      architecture for embedded real-time systems.
  notes: 'Driscoll (Honeywell) 2019. Additive stream cipher + autokey product cipher for AEAD. Core: 127-bit LFSR (poly x^127+x^63+1,
    split as L0||L1, two 64-bit halves) + two 32-bit nonlinear state words x, y = 192 bits register storage. Key=128 bits
    (primary), nonce=96 bits, tag=64 bits (primary). Uses ones''-complement multiplication of 32-bit words as nonlinear filter.
    Processes two 32-bit words per iteration. See bleep64_aead for the AEAD mode built on this core. Per the official NIST
    LWC spec (Bleep64-spec.pdf, Sec. 2.1 and 2.4), the ones''-complement additions feeding the multiply''s inputs are mod
    2^32-1, and "this multiply operation has characteristics of an operation in a ring of size 2^32+1" -- a ring the spec
    itself notes is not prime (2^32+1 = 641 x 6700417, unlike IDEA''s prime 2^16+1), relying instead on the ones''-complement
    inputs to exclude the resulting non-uniformity''s main outlier. A third, ordinary two''s-complement add mod 2^32 combines
    the multiply-filter output with the LFSR value afterward.

    '
  instances:
  - id: bleep64_core
    name: Bleep64 Core Cipher
    type: update_function
    reference_ids:
    - driscoll_2019_bleep64
    characteristics:
      state_size_bits: 192
      key_size_bits: 128
      output_size_bits: 64
    notes: Additive stream cipher plus autokey product cipher core. 127-bit LFSR (poly x^127+x^63+1, split as two 64-bit halves
      L0||L1) plus two 32-bit nonlinear state words x, y; total register storage = 192 bits. Processes two 32-bit words (64
      bits) per iteration via ones'-complement multiplication as the nonlinear filter.
