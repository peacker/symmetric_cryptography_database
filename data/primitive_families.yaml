- id: chacha
  name: ChaCha Update Function
  notes: 'ChaCha is Bernstein''s 2008 ARX stream-cipher family, "a variant of Salsa20": it keeps Salsa20''s operation count
    and matrix-based data flow but reorders the quarter-round to double the diffusion rate per round. The original paper
    defines ChaCha8, ChaCha12, and ChaCha20 (analogous to Salsa20/8, Salsa20/12, Salsa20/20), each usable with a 128- or
    256-bit key and a 64-bit nonce plus 64-bit block counter, matching Salsa20''s own layout. RFC 7539 (2015, superseded
    by RFC 8439 in 2018) standardizes only the 256-bit-key, 20-round variant as "ChaCha20", and changes the nonce/counter
    split to a 96-bit nonce and 32-bit counter -- RFC 7539 itself notes: "The original algorithm also specified 128-bit
    keys and 8- and 12-round variants, but these are out of scope for this document."

    '
