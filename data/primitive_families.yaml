    name: Helix Block Function
    type: update_function
    reference_ids:
    - ferguson_et_al_2003_helix
    characteristics:
      key_size_bits: 256
      nonce_size_bits: 128
      state_size_bits: 160
      rounds: 20
      output_size_bits: 160
    notes: 'One block of the Helix state update (Fig. 2): 20 rounds processing the 160-bit active state, with two
      key words and one plaintext word injected per block.'
