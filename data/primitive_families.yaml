- id: curupira
  name: CURUPIRA-1
  notes: 'CURUPIRA-1 (Barreto, Simplício, SBRC 2007) is a 96-bit block cipher, organized as a 3x4 byte matrix, with
    a 48t-bit key (t in {2,3,4}, i.e. 96/144/192 bits) and a variable round count (Table 2 of the paper: 10-11 rounds
    for a 96-bit key, 14-17 for 144-bit, 18-23 for 192-bit), tailored for constrained platforms such as sensor
    networks and smart cards. The paper''s own abstract: "CURUPIRA-1 is an instance of the Wide Trail family of
    algorithms which includes the AES cipher, and displays both involutional structure, in the sense that the
    encryption and decryption modes differ only in the key schedule, and cyclic key schedule, whereby the round
    subkeys can be computed in-place in any order." Its round function rho[k] = sigma[k] o theta o pi o gamma applies
    four transforms per round -- nonlinear S-box layer gamma, byte permutation pi, GF(2^8) MDS diffusion theta, and
    key-xor sigma -- every one of which is individually self-inverse, so only the key schedule (not the round
    function) needs reversing for decryption; the very last round omits theta. The cyclic key schedule iterates a
    linear key-evolution function (row-cyclic-shift then GF(2^8) matrix multiplication, plus a schedule-constant
    xor) until it returns to the original key, so subkeys can be derived on the fly in any order with no storage,
    and a separate key-selection step substitutes only row 0 of each key stage through the same S-box to add
    nonlinearity to the schedule. CURUPIRA-2 (not modeled separately here) later replaced only the key-schedule
    algorithm with a faster one, keeping the same round structure.'
  construction_ids:
  - spn
  - full_sbox_layer
  - mds_linear_layer
  - self_reciprocal_spn
  round_ids:
  - curupira_round
  - curupira_key_round
  target_applications:
  - constrained_hardware
  - iot
  - hardware
  characteristics:
    block_size_bits: 96
    components:
    - id: sbox
      params:
        input_bits: 8
        output_bits: 8
    - id: field_matrix_mul
      params:
        field_size: 256
    - id: word_permutation
      params:
        word_size_bits: 8
    - id: xor
    - id: constant
  reference_ids:
  - barreto_simplicio_2007_curupira
  - simplicio_barreto_carvalho_margi_naslund_2008_curupira2
  process_participations: []
  influences:
  - source_family_id: anubis
    relations:
    - inspired_by
    note: 'The paper states directly: "The Curupira-1 S-box is the same one defined for the Anubis and Khazad
      ciphers [Barreto and Rijmen 2000a, Barreto and Rijmen 2000b]." A literal, primary-source-confirmed shared
      component (not a secondary reconstruction): the identical S-box, chosen for the same differential/linear/
      interpolation-resistance properties (delta=2^-5, lambda=2^-2, nu=7) and involutional by construction.'
  - source_family_id: khazad
    relations:
    - inspired_by
    note: 'Same primary-source statement as the Anubis edge on this family: "The Curupira-1 S-box is the same one
      defined for the Anubis and Khazad ciphers." Barreto co-designed both Anubis and Khazad, so this is a direct,
      first-party reuse of the earlier S-box, not an independent rediscovery.'
