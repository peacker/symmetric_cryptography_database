  - multi2_iso_iec_9979
  process_participations: []
  influences:
  - source_family_id: des
    relations:
    - inspired_by
    note: 'MULTI2''s inventors (Takaragi, Nakagawa, Sasaki of Hitachi) present it explicitly against DES''s substitution-box/permutation-table
      structure in the patent''s Background of the Invention (Figs. 11-13, labeled "PRIOR ART", reproduce DES''s extensional
      permutation table and S-box S1): "as compared with the conventional encipherment process in the DES algorithm, the
      number of processes for the substitution transformation and permutation transformation can be reduced, so that the
      encipherment process can be executed at a high speed." MULTI2''s own π1-π4 round structure keeps DES''s alternating
      substitution-transformation/permutation-transformation pattern but widens it from a bit-oriented S-box/permutation
      to 32-bit-word operations. Independently confirmed by ISO/IEC 9979 Register Entry No. 9: "MULTI2 is a symmetric
      block cipher algorithm based on the permutation-substitution calculation like DES."'
  - source_family_id: feal
    relations:
    - generalization_of
    note: 'The same patent Background explains FEAL processes plaintext on a byte (8-bit) unit basis, which was efficient
      on 8-bit microcomputers but "inefficient" once 32-bit microcomputers became the target platform, and states this
      is exactly why the invention was needed: "the encryption algorithm for fundamentally executing the processes on a
      4-byte unit basis which is suitable for the 32-bit microcomputer is demanded." MULTI2 generalizes FEAL''s per-unit
      processing granularity from 1 byte to 4 bytes (32-bit words) to reach that goal.'
  notes: MULTI2 (Takaragi, Nakagawa, and Sasaki of Hitachi; patented 1988/1991, ISO/IEC 9979 1994) is a 64-bit block cipher
    used for digital broadcasting content protection (ISDB/BSkyB). It uses a 64-bit plaintext key and a 256-bit system key.
    The recommended number of rounds is 8, but it is configurable. Its round function applies four operations (π1–π4)
    using addition, XOR, rotation, AND, and OR on two 32-bit words.
  instances:
