- id: newdes
  name: NewDES
  notes: 'NewDES is a 64-bit, 120-bit-key product cipher designed as a simpler alternative to DES. CORRECTION (this audit):
    previously misclassified as a classical Feistel network and reusing DES''s own round definition -- per its Wikipedia
    description, NewDES has no half-block split/swap at all; each of its 17 rounds instead XORs subkey material into each
    of the block''s eight 1-byte sub-blocks in sequence, feeding each through a fixed S-box whose output is XORed into
    the next byte. Its own Wikipedia article states explicitly: "Despite its name, it is not derived from DES and has
    quite a different structure." Retagged as generic spn pending a primary-source reclassification (Robert Scott,
