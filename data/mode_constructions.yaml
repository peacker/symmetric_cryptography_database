version: 1
mode_constructions:
- id: merkle_damgard
  name: Merkle–Damgård Construction
  abbreviation: MD
  typical_primitive_types:
  - hash_function
  placeholder_family_names:
  - MD4
  - MD5
  - HAVAL
  notes: 'An iterated hash construction that applies a fixed-input-length compression function to successive message blocks
    while carrying a chaining value, with strengthening padding encoding the message length.

    '
- id: sponge_construction
  name: Sponge Construction
  notes: 'A permutation-based mode that absorbs input into part of a fixed-size state (the rate, alongside an untouched
    capacity) interleaved with calls to a public permutation, then squeezes output the same way. Unidirectional/unkeyed by
    default (hash and XOF use); see duplex_construction for the keyed, bidirectional sibling construction. Level-1 root; families
    are tagged with a leaf below.

    '
- id: standard_sponge
  name: Standard Sponge
  special_case_of: sponge_construction
  typical_primitive_types:
  - hash_function
  placeholder_family_names:
  - SHA-3
  - SHAKE
  notes: 'The classical rate/capacity sponge: a constant permutation-round count per call, absorbing into (and squeezing
    from) only the rate portion of the state, with the capacity portion never directly touched by input/output.

    '
- id: belt_and_mill_construction
  name: Belt-and-Mill Construction
  abbreviation: Belt-and-Mill
  typical_primitive_types:
  - hash_function
  - stream_cipher
  placeholder_family_names:
  - PANAMA
  - RadioGatún
  notes: 'A permutation-driven mode historically predating the formal sponge/duplex terminology: a small nonlinear "mill"
    state is updated each round by a fixed sequence of transformations (typically a nonlinear layer, a bit-transposition,
    and a linear diffusion layer), coupled to a much larger linear-feedback "belt" that both feeds taps into the mill and
    is fed back from it. PANAMA and RadioGatún (both by Daemen) are the direct architectural precursors to the Keccak sponge
    construction, but are not themselves rate/capacity sponges. Level-1 root (families are tagged with this id directly;
    no further leaves defined given how few designs use this exact architecture).

    '
- id: duplex_construction
  name: Duplex Construction
  notes: 'A permutation-based mode that interleaves absorb and squeeze in a single call per operation, enabling stateful,
    session-like keyed processing (as needed for AEAD). Level-1 root; families are tagged with a leaf below.

    '
- id: standard_duplex
  name: Standard Duplex
  special_case_of: duplex_construction
  typical_primitive_types:
  - aead
  placeholder_family_names:
  - Keyak
  notes: 'The classical duplex construction (Bertoni, Daemen, Peeters, Van Assche): every duplexing call runs the full permutation
    for the same, constant number of rounds, whether it is the initialization call or a later data-processing call.

    '
- id: monkey_duplex
  name: MonkeyDuplex
  special_case_of: duplex_construction
  typical_primitive_types:
  - aead
  placeholder_family_names:
  - Ketje
  - Ascon
  notes: 'A duplex variant (Bertoni, Daemen, Peeters, Van Assche, "Keccak and the SHA-3 Standardization"; used first in Ketje/Keyak
    and subsequently in Ascon and many NIST LWC candidates) that runs a reduced number of permutation rounds for the repeated
    per-block duplexing calls, reserving the full round count for initialization and finalization only -- trading a proven
    security margin for significantly better throughput.

    '
- id: dry_sponge_duplex
  name: DrySponge
  special_case_of: duplex_construction
  typical_primitive_types:
  - aead
  placeholder_family_names:
  - DryGASCON
  notes: 'A duplex variant introduced by DryGASCON that separates cryptographic-strength concerns from side-channel/fault-robustness
    concerns: a "Core" round processes only the sponge''s secret capacity bits (the part that must resist cryptanalysis),
    while dedicated Mix/Accumulate steps -- outside the Core -- merge input into and extract output from the state, so that
    fault/side-channel countermeasures can be concentrated on the input/output-facing steps without hardening the Core round
    itself.

    '
- id: beetle_mode
  name: Beetle Mode
  special_case_of: duplex_construction
  typical_primitive_types:
  - aead
  placeholder_family_names:
  - PHOTON-Beetle
  notes: 'A duplex variant (Chakraborti, Datta, Nandi, Yasuda, CHES 2018/ToSC) that replaces the standard duplex''s direct
    rate-XOR ciphertext generation with a rho (shuffle-then-XOR) function, giving better security against nonce misuse and
    a smaller effective rate exposure than a standard duplex at the same state size.

    '
- id: parallel_duplex_construction
  name: Parallel Duplex Construction
  special_case_of: duplex_construction
  typical_primitive_types:
  - aead
  placeholder_family_names:
  - NORX
  notes: 'NORX''s own term (Aumasson, Jovanovic, Neves, "NORX: Parallel and Scalable AEAD"): "NORX relies on the monkeyDuplex
    construction..., enhanced by the capability of parallel payload processing"; Section 4 headers this "The Parallel
    Duplex Construction" and compares it to sponge tree-hashing. Splits payload processing across D parallel lanes
    (branching/merging phases around monkeyDuplex-style reduced-round data processing) while header/trailer data stay
    single-lane -- a specific named enhancement of monkeyDuplex, not an unrelated alternative to it.

    '
- id: binary_tree_hash
  name: Binary Tree Hash
  placeholder_family_names:
  - BLAKE3
  notes: 'A hash construction that splits the input into independent leaf blocks and combines them via a binary tree of
    the same compression function, rather than sequential (Merkle-Damgard) or state-based (sponge/duplex) iteration; unlike
    those, every subtree can be hashed independently and in parallel.

    '
- id: block_cipher_based
  name: Block-Cipher-Based Mode
  notes: 'A mode of operation whose confidentiality/authentication mechanism is built directly by invoking an underlying
    block cipher as a black box, rather than a dedicated permutation. Level-1 root; families are tagged with a leaf below.

    '
- id: ctr_mode
  name: Counter Mode (CTR)
  special_case_of: block_cipher_based
  typical_primitive_types:
  - stream_cipher
  placeholder_family_names:
  - AES-CTR
  notes: Converts a block cipher into a stream cipher by encrypting successive counter values and XORing the result with
    plaintext; allows parallel encryption and random access to ciphertext.
- id: cbc_mode
  name: Cipher Block Chaining (CBC)
  special_case_of: block_cipher_based
  typical_primitive_types:
  - block_cipher_mode
  placeholder_family_names:
  - AES-CBC
  notes: A block-cipher confidentiality mode where each plaintext block is XORed with the previous ciphertext block before
    encryption.
- id: ofb_mode
  name: Output Feedback Mode (OFB)
  special_case_of: block_cipher_based
  typical_primitive_types:
  - stream_cipher
  notes: Converts a block cipher into a synchronous stream cipher by repeatedly re-encrypting the cipher's own previous
    output (independent of plaintext/ciphertext), then XORing the resulting keystream with plaintext.
- id: cfb_mode
  name: Cipher Feedback Mode (CFB)
  special_case_of: block_cipher_based
  typical_primitive_types:
  - stream_cipher
  notes: Converts a block cipher into a self-synchronizing stream cipher by encrypting the previous ciphertext block to
    produce keystream, XORed with the next plaintext block.
- id: gcm_mode
  name: Galois/Counter Mode (GCM)
  special_case_of: block_cipher_based
  typical_primitive_types:
  - aead
  placeholder_family_names:
  - AES-GCM
  notes: A block-cipher AEAD mode combining CTR-mode encryption with a GHASH polynomial-evaluation MAC over GF(2^128).
- id: ocb_mode
  name: Offset Codebook Mode (OCB)
  special_case_of: block_cipher_based
  typical_primitive_types:
  - aead
  placeholder_family_names:
  - OCB
  notes: A single-pass, fully parallelizable block-cipher AEAD mode (Rogaway et al.; RFC 7253) that XORs each
    plaintext block with a per-block "offset" (derived from the nonce via a Gray-code-indexed sequence of
    doublings in GF(2^128)) before and after a single block-cipher encryption call ("whitened codebook" -- one
    block-cipher call per block does both encryption and authentication, unlike encrypt-then-MAC composites),
    then XORs a checksum of the plaintext blocks with a further offset and encrypts it once more to form the tag.
- id: siv_mode
  name: Synthetic IV (SIV) Construction
  typical_primitive_types:
  - aead
  placeholder_family_names:
  - HS1-SIV
  notes: 'Rogaway and Shrimpton''s deterministic, nonce-misuse-resistant AEAD construction: a PRF is first run
    over the associated data and plaintext to derive a "synthetic IV" (SIV) deterministically from the message
    itself, then that SIV seeds a second PRF/PRG pass that encrypts the plaintext. Because the SIV depends on the
    full message, encrypting the same (key, AD, plaintext) twice always produces the same ciphertext (revealing
    only that a repeat occurred, not the message contents) -- misuse resistance without requiring a fresh nonce.
    Primitive-agnostic: the two PRF passes can be built from a block cipher (Rogaway/Shrimpton''s own CMAC/CTR
    instantiation) or, as in HS1-SIV, from a universal hash paired with a stream cipher.'
- id: encrypt_mix_encrypt
  name: Encrypt-mix-Encrypt Online AEAD
  special_case_of: block_cipher_based
  typical_primitive_types:
  - aead
  placeholder_family_names:
  - AES-COPA
  - ELmD
  - COLM
  notes: An online, nonce-misuse-resistant block-cipher AEAD mode processing each plaintext block through two
    masked block-cipher-keyed calls with an intermediate linear mixing step between them (mix the first layer's
    outputs, e.g. via a running XOR chain, before the second layer) -- as opposed to OCB's single masked call per
    block. Two block-cipher-keyed calls per block trade OCB's raw speed for resistance to nonce reuse/misuse and
    full parallelizability. The AES-COPA/ELmD/COLM lineage (Andreeva, Bogdanov, Datta, Luykx, Mennink, Nandi,
    Tischhauser, Yasuda) is the canonical example, with COLM merging both predecessors -- though ELmD specifically
    uses the block cipher's *inverse* (decrypt) for its second layer rather than a second forward encryption
    (hence "Encrypt-Linear mix-Decrypt"), for a smaller combined hardware footprint; AES-COPA and COLM both use
    forward encryption for both layers.
- id: block_cipher_based_stream
  name: Block-Cipher-Based Stream Cipher (Other)
  special_case_of: block_cipher_based
  notes: 'A residual leaf for block-cipher-driven stream/keystream constructions that do not match a named NIST mode (CTR/CBC/OFB/CFB/GCM)
    -- e.g. bespoke state-update generators that reuse a block cipher''s internal components (S-box, round function) without
    invoking it as a black-box CTR/OFB-style oracle.

    '
- id: iterated_hash_kdf
  name: Iterated Hash-Based KDF
  typical_primitive_types:
  - pbkdf
  - kdf
  notes: >
    A key/password-derivation mode built by repeatedly invoking a hash
    function (directly, or as the compression step of a memory-hard
    scratchpad-filling loop) rather than a dedicated block-cipher- or
    permutation-based mode -- covering both plain iterated-hash PBKDFs
    (PBKDF2's repeated HMAC) and the many memory-hard Password Hashing
    Competition designs (Argon2, Catena, Lyra2, yescrypt, and similar) whose
    memory-filling step is itself built around a hash compression function.
- id: modular_squaring_kdf
  name: Modular Squaring KDF
  typical_primitive_types:
  - pbkdf
  placeholder_family_names:
  - Makwa
  notes: >
    A password-hashing mode whose sequential-cost mechanism is repeated
    modular squaring x -> x^2 mod N for a composite RSA-style modulus
    N = p*q, rather than a hash-iteration or memory-hard scratchpad. Makwa
    (Pornin, PHC candidate) is the canonical example: the squaring chain is
    inherently sequential (each step depends on the previous one) and, with
    the factorization of N as a trapdoor, can optionally be escrowed for
    faster verification by a party holding p and q.
- id: hmac_construction
  name: HMAC
  notes: A hash-based MAC construction combining a hash function with inner and outer key padding (RFC 2104).
- id: encrypt_then_mac
  name: Encrypt-then-MAC Composition
  notes: A generic AEAD composition that encrypts the plaintext with one primitive and authenticates the result with a separately-keyed
    MAC/universal hash.
- id: carter_wegman
  name: Carter-Wegman Construction
  abbreviation: CW-MAC
  typical_primitive_types:
  - mac
  placeholder_family_names:
  - Poly1305
  - AES-GCM
  notes: >
    Combines a universal hash function (keyed with its own hash key,
    bounded collision probability) with a single-use unpredictable value
    -- classically a one-time pad, in practice almost always a PRF/block
    cipher output keyed separately and indexed by a nonce -- to get a full
    MAC: tag = UHF_k1(m) + F_k2(nonce) (Wegman and Carter, "New Hash
    Functions and Their Use in Authentication and Set Equality," JCSS
    1981, building on Carter and Wegman, "Universal Classes of Hash
    Functions," STOC 1977/JCSS 1979). Poly1305 bakes this masking step
    into its own definition (the "+s" after the polynomial evaluation, s
    coming from an external PRF); GCM instead applies it one level up, at
    the GCM construction itself, XOR-masking GHASH's raw polynomial-hash
    output with a GCTR/CTR-mode-encrypted block.
- id: universal_hash
  name: Universal Hash Function Family
  typical_primitive_types:
  - mac
  - aead
  placeholder_family_names:
  - GHASH
  - Poly1305
  notes: >
    Root category for keyed function families with a provably bounded
    collision probability over the random choice of key (epsilon-almost-
    universal or epsilon-almost-XOR-universal), rather than full
    one-wayness -- see the universal_hash mode_type for the security
    property itself and how it is combined with a mask (carter_wegman) to
    form a MAC. This entry covers the *mechanism* used to build the hash;
    see polynomial_universal_hash and multiply_add_universal_hash for the
    two mechanisms tracked in this database.
- id: polynomial_universal_hash
  name: Polynomial Evaluation Universal Hash
  special_case_of: universal_hash
  typical_primitive_types:
  - mac
  - aead
  placeholder_family_names:
  - GHASH
  - Poly1305
  notes: >
    Treats the message, split into fixed-size blocks, as the coefficients
    of a polynomial and evaluates that polynomial at a secret point via
    Horner's rule (accumulator = accumulator*point + next_block, repeated
    over the blocks, reduced modulo a fixed modulus after every step) over
    a finite field -- a binary (characteristic-2) Galois field for GHASH
    (GF(2^128), reduction polynomial u^128+u^7+u^2+u+1, NIST SP 800-38D)
    or a large prime field for Poly1305 (GF(2^130-5), Bernstein, FSE
    2005). Collision probability is bounded by (message length in
    blocks)/(field size), the classical Horner-rule polynomial-hash
    security bound.
- id: multiply_add_universal_hash
  name: Multiply-Add Tree Universal Hash
  special_case_of: universal_hash
  typical_primitive_types:
  - mac
  placeholder_family_names:
  - UMAC
  - VMAC
  notes: >
    Builds the universal hash from a tree/chain of word-wise multiply-add
    operations over key material and message words (UMAC's NH function,
    RFC 4418) rather than a single large-field polynomial evaluation,
    trading a larger (reused, not one-time) hash key for cheaper per-word
    arithmetic on general-purpose CPUs. VMAC (Krovetz and Dai) is a
    related NH-based design not yet modeled separately in this database.
- id: native_keystream_generator
  name: Native Keystream Generator
  notes: A stream cipher whose keystream is produced directly by its own internal state-update generator, with no separable
    underlying block cipher wrapped by a generic mode of operation.
- id: filter_permutator
  name: Filter Permutator
  abbreviation: FP
  typical_primitive_types:
  - stream_cipher
  placeholder_family_names:
  - FLIP
  - FiLIP
  notes: A Goldreich-PRG-style keystream construction with no register/state update -- each output bit is produced by
    applying a fixed public random permutation to reorder the secret key bits, then evaluating a fixed non-linear Boolean
    filtering function on a subset of the permuted bits. A new permutation is drawn (from a public IV-seeded PRNG) for
    each output bit. Introduced by Meaux, Journault, Standaert, and Carlet ("Towards Stream Ciphers for Efficient FHE
    with Low-Noise Ciphertexts", EUROCRYPT 2016) specifically to keep the FHE noise growth of the keystream generator
    additive rather than multiplicative in the circuit depth, unlike classical LFSR/NLFSR-based stream ciphers.
- id: parallel_permutation_construction
  name: Parallel Permutation-Based Construction
  abbreviation: PPB
  typical_primitive_types:
  - mac
  - enc
  placeholder_family_names:
  - Kravatte
  - Farasha
  notes: 'Level-1 root: builds a keyed PRF (arbitrary-length input to arbitrary-length output) from a cryptographic
    permutation applied in parallel across several lanes -- a compression layer absorbing input across parallel
    permutation calls followed by an expansion layer producing output the same way -- rather than the sequential
    absorb/squeeze interleaving of a sponge or duplex. The permutation itself is never inverted. Introduced by
    Bertoni, Daemen, Hoffert, Peeters, Van Assche, and Van Keer, "Farfalle: parallel permutation-based cryptography"
    (IACR ToSC 2017(4)): "It has a compression layer and an expansion layer, each involving the parallel application
    of a permutation."

    '
- id: farfalle
  name: Farfalle
  abbreviation: Farfalle
  special_case_of: parallel_permutation_construction
  typical_primitive_types:
  - mac
  - enc
  placeholder_family_names:
  - Kravatte
  - Xoofff
  - Ciminion
  notes: 'The specific Farfalle construction (mask derivation + compression layer + expansion layer, each a parallel
    application of a permutation, linked by rolling functions), as opposed to the broader parallel-permutation-based
    root: Kravatte is Farfalle instantiated with Keccak-p[1600, nr=6] ("KRAVATTE is Farfalle[pb,pc,pd,pe,rollc,rolle]
    with pb=pc=pd=pe=KECCAK-p[1600,nr=6]"); Xoofff is Farfalle instantiated with Xoodoo[6] by the same core author
    team, designed specifically as a narrower-permutation alternative to Kravatte for low-end platforms
    ("XOOFFF is Farfalle[pb,pc,pd,pe,rollc,rolle]" with pb=pc=pd=pe=Xoodoo[6]); Ciminion explicitly modifies it
    ("our mode of operation resembles the Farfalle construction... we slightly modify Farfalle"); Hydra''s Megafono
    strategy is "inspired by Farfalle and Ciminion" but diverges further (its own paper hedges it as only
    "1/2 x Farfalle"-like) and is tagged with the parallel_permutation_construction root without this specific leaf.

    '
- id: farasha
  name: Farasha
  abbreviation: Farasha
  special_case_of: parallel_permutation_construction
  typical_primitive_types:
  - mac
  notes: 'A provably-secure Farfalle-like construction, not a literal Farfalle instance: "Farasha can be seen as a
    simple and provable Farfalle-like construction where the rolling functions in the compression and expansion
    phases of Farfalle are replaced by a uniform almost xor universal (AXU) function and a simple counter,
    respectively," and Farfalle''s intermediate permutations p_b/p_d are removed entirely. Introduced by Aaraj,
    Bellini, Jejurikar, Manzano, Rohit, and Salazar, "Farasha: A Provable Permutation-based Parallelizable PRF" (SAC
    2022), analyzed in the random-permutation model rather than proposing one fixed concrete permutation.

    '
