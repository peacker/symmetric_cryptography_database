  year: 2022
  venue: CRYPTO 2022
  organization: imec-COSIC, KU Leuven
  url: https://eprint.iacr.org/2022/818
  notes: 'No local copy. Used as a secondary source for PRINCE''s relationship to involution-based ciphers (Anubis,
    Khazad, Noekeon) because PRINCE''s own primary sources block automated fetching (https://eprint.iacr.org/2012/529
    -> 403; https://www.iacr.org/archive/asiacrypt2012/76580403/76580403.pdf -> 404; ResearchGate mirror -> 403).
