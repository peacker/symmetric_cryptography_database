    now kept only as a supplementary source). The paper confirms DESL replaces DES''s eight distinct S-boxes with a
    single redesigned S-box (Table 2) satisfying Kim et al.''s linear/differential/Davies-Murphy design criteria, and
    also omits DES''s Initial Permutation IP and its inverse IP^-1 entirely (they cost wiring but add no cryptographic
    strength); DESL-56 synthesizes to 1848 GE and DESXL to 2168 GE (both 144 clock cycles/block, Table 3). An earlier
    version of this work was presented at RFIDSec ''06 (non-proceedings workshop).'
