  notes: 'No local copy (fetched via WebFetch of the rfc-editor.org HTML). Defines POLYVAL, the universal hash used
    by AES-GCM-SIV, and its exact relationship to GHASH: "POLYVAL(H, X_1, X_2, ...) is equal to
