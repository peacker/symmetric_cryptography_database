    states: "Many traditional key-alternating ciphers also use involutions, i.e. self-inverse functions, as their
    components in order to keep the hardware implementation costs for encryption and decryption similar and to save
    area. The block ciphers ANUBIS, KHAZAD and NOEKEON are early examples of this strategy. [...] At ASIACRYPT 2012,
    Borghoff et al. introduced the block cipher PRINCE as an alternative approach to minimizing the overhead of
    supporting both efficient encryption and decryption."'
