  publisher: IACR
  url: https://eprint.iacr.org/2018/1098
  notes: 'Local copy: references/[2018][friday_hash,jarvis][][].pdf. Introduces Jarvis (a Rijndael-inspired block cipher over
    GF(2^n): inversion S-box x -> x^(2^n-2) + affine layer + round-key XOR) and Friday, confirmed directly: "Friday
    is a Merkle-Damgard based hash function instantiated with Jarvis as its compression function" -- precisely,
    Jarvis is first turned into a compression function via Miyaguchi-Preneel mode (H_i = E_{H_{i-1}}(m_i) xor
    H_{i-1} xor m_i with E=Jarvis), then iterated via Merkle-Damgard. Both were later broken by a Grobner-basis
    algebraic attack (Albrecht et al., ASIACRYPT 2019), motivating the redesign as Vision/Rescue
    (aly_et_al_2020_marvellous).'

