  publisher: Springer
  url: https://eprint.iacr.org/2022/180
  notes: 'Local copy: references/[2022][elisabeth][][].pdf. Confirmed directly: generalizes FiLIP''s Improved Filter
    Permutator (IFP, defined over F_2) to any group G, calling the result a "Group Filter Permutator" (GFP; "The XOR
    is replaced by the addition of G and the Boolean function by a function from G^n to G"). Elisabeth instantiates
    GFP over G = Z_16, motivated by TFHE''s native 4-bit negacyclic-LUT bootstrapping. Its filter is a direct sum of
    12 copies of a 5-to-1 inner function g built from two layers of eight fixed Z_16->Z_16 4-bit lookup tables
    ("NLUTs") -- a genuine fixed-size S-box-like component, unlike FLIP/FiLIP''s purely algebraic filters. Later
    broken (Elisabeth-4) by Gilbert et al., "Cryptanalysis of Elisabeth-4" (ASIACRYPT 2023); patched by Margrethe
    (hoffmann_meaux_standaert_2023_margrethe).'

- id: hoffmann_meaux_standaert_2023_margrethe
  kind: paper
  title: The Patching Landscape of Elisabeth-4 and the Mixed Filter Permutator Paradigm
  authors:
  - Clement Hoffmann
  - Pierrick Meaux
  - Francois-Xavier Standaert
  year: 2023
  venue: IACR Cryptology ePrint Archive (2023; venue not printed on the PDF itself)
  publisher: IACR
  url: ''
  notes: 'Local copy: references/[2023][margrethe][][].pdf. Responds to Gilbert et al.''s linearization attack on
    Elisabeth-4 (exploiting the small monomial count created by NLUTs + mod-16 addition) with three fixes; the
    headline one, Margrethe, introduces a new "Mixed Filter Permutator" (MFP) paradigm, confirmed directly: "The MFP
    paradigm differs from the GFP by the use of two (potentially) different groups" -- key elements are individual
    bits (G1=F_2) while the filter output is Z_16 (G2), unlike Elisabeth''s single-group (Z_16-keyed) GFP. Its filter
    is 14 copies of a genuine fixed-size 18-to-4-bit lookup-table S-box g: F_2^18 -> Z_16, summed with 4 extra raw
    key bits per copy. Quote: "Leaving the GFP paradigm, Margrethe-18-4 fixes the root of the issue... by mixing the
    key at the bit level."'

