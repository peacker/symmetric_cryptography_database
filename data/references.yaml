- id: dubrova_hell_2017_espresso
  kind: paper
  title: 'Espresso: A stream cipher for 5G wireless communication systems'
  authors:
  - Elena Dubrova
  - Martin Hell
  year: 2017
  venue: 'Cryptography and Communications, Vol. 9, No. 2, pp. 273-289'
  publisher: Springer
  url: https://doi.org/10.1007/s12095-015-0173-2
  notes: 'DOI 10.1007/s12095-015-0173-2 (the DOI slug reflects the 2015 online-first date; DBLP and the journal''s
    own volume/issue record it as Vol. 9, No. 2 (2017), pp. 273-289 -- 2017 is the correct citable year). Also
    available as a preprint: IACR eprint 2015/241 (https://eprint.iacr.org/2015/241). Confirmed from secondary
    sources (abstract/metadata; the full text is paywalled on SpringerLink and the eprint mirror blocks automated
    fetches): Espresso is a hardware-oriented stream cipher for 5G wireless systems combining a 256-bit
    non-linear feedback shift register (NLFSR) in the Galois configuration with a 20-variable, algebraic-degree-6
    non-linear output function; key size 128 bits, IV size 96 bits. The design methodology is presented as
    combining "the advantage of the Galois configuration of NLFSRs, short propagation delay, with the advantage
    of the Fibonacci configuration of NLFSRs, which can be analyzed formally," and the paper reports Espresso as
    the fastest stream cipher below 1500 GE among those compared, including Grain-128 and Trivium. As of this
    entry, Semantic Scholar records 73 citing papers (https://api.semanticscholar.org/graph/v1/paper/DOI:10.1007/s12095-015-0173-2),
    while the publisher''s own SpringerLink citation-metrics count is reported by the database maintainer as
    near-zero -- i.e. very little independent citation/adoption despite the 5G framing. The paper''s own framing
    that Espresso is suitable "for 5G wireless communication systems" is the authors'' own proposal, not evidence
    of independent consideration or adoption by any 5G standards body; this database does not attest to the exact
    wording of any specific in-paper claim about 5G standardization that could not be verified against the full
    text.'

- id: yao_parampalli_2021_espresso_like_cryptanalysis
  kind: paper
  title: Cryptanalysis of the class of maximum period galois NLFSR-based stream ciphers
  authors:
  - Ge Yao
  - Udaya Parampalli
  year: 2021
  venue: 'Cryptography and Communications, Vol. 13, pp. 847-864'
  publisher: Springer
  url: https://doi.org/10.1007/s12095-021-00511-0
  notes: 'DOI 10.1007/s12095-021-00511-0. This is the peer-reviewed journal version of the earlier preprint "Generalized
    NLFSR Transformation Algorithms and Cryptanalysis of the Class of Espresso-like Stream Ciphers" (Ge Yao, Udaya
    Parampalli, University of Melbourne; arXiv:1911.01002, submitted 2019-11-04, https://arxiv.org/abs/1911.01002),
    read directly from the arXiv PDF for this entry. Both versions analyze Espresso as the representative design of
    a class the authors call "Espresso-like stream ciphers": ciphers built from a single maximum-period Galois NLFSR.
    The arXiv preprint states verbatim: "Espresso is based on a 256-bit Galois NLFSR initialized by a 128-bit key.
    The 2^256-1 maximum period is assured because the Galois NLFSR is transformed from a maximum length LFSR. However,
    we propose a Galois-to-Fibonacci transformation algorithm and successfully transform the Galois NLFSR into a
    Fibonacci LFSR with a nonlinear output function. The transformed cipher is broken by the standard algebraic
    attack and the Rønjom-Helleseth attack with complexity O(2^68.44) and O(2^66.86) respectively... the transformation
    result shows that the Galois NLFSR used in any Espresso-like stream ciphers can be easily transformed back into
    the original Fibonacci LFSR. Therefore, this kind of design should be avoided in the future." The published 2021
    journal version reports the same class of result under the paper''s new title, with the Espresso cipher itself
    transformed to an LFSR filter generator and broken by a fast algebraic attack and a Rønjom-Helleseth attack
    (complexity figures reported in secondary sources as ~2^68.5 and ~2^48.6 respectively, not independently
    confirmed against the paywalled full text of the 2021 version). Directly on-topic for Espresso, not a generic
    benchmark comparison.'

