  publisher: IACR
  url: https://doi.org/10.13154/tosc.v2020.i3.46-86
  notes: 'Local copy: references/[2020][dasta][][].pdf. Confirmed directly: keeps Rasta''s full-state chi non-linear layer
    but splits the linear layer into a fixed linear transformation L (from a binary BCH-based code, giving a
    guaranteed branch number) and a small parameterized family of bit permutations P selected by the block counter,
    replacing Rasta''s freshly-generated random invertible matrix per round. The fixed-length building block
    B_i(k) = L o P_{r,i} o chi o ... o chi o L o P_{0,i}(k) + k (a Davies-Meyer-style feed-forward over a keyed
    permutation) is captioned only as "Generation of i-th block of Dasta" (Figure 2) -- the paper gives it no
    separate name. 200-400x faster keystream generation offline and 15-20% faster in HE (HElib) than Rasta, at the
    same AND-depth/AND-count.'

