- id: simplicio_barreto_carvalho_margi_naslund_2008_curupira2
  kind: paper
  title: 'The CURUPIRA-2 Block Cipher for Constrained Platforms: Specification and Benchmarking'
  authors:
  - Marcos A. Simplício Jr.
  - Paulo S. L. M. Barreto
  - Tereza C. M. B. Carvalho
  - Cintia B. Margi
  - Mats Näslund
  year: 2008
  venue: 'CEUR Workshop Proceedings, Vol-397 -- 1st Workshop on Privacy in Location-Based Applications (PiLBA), co-located
    with ESORICS 2008'
  url: https://ceur-ws.org/Vol-397/paper8.pdf
  notes: 'Local copy: references/2008-curupira2.pdf. Section 3 ("Overview of the Curupira-1 structure") reproduces the
    original Curupira-1 specification in detail, including its four self-inverse round transforms (nonlinear layer
    using an S-box "identical to that used in Anubis and Khazad", MDS linear diffusion layer, byte permutation layer,
    key addition layer) and its cyclical key schedule; also states "the cipher round structure is similar to the one
    in BKSQ [12], with the advantage of being involutional."'
