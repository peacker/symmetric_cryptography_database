  publisher: ''
  url: ''
  notes: 'Local copy: references/[2020][rescue_prime][][].pdf. Confirmed directly: "based on the original Rescue proposal...
    No scientific novelty is claimed... we do make use of the opportunity to apply three simplifications": (1) the
    order of the forward (x^alpha) and inverse (x^(1/alpha)) S-box steps within a round is flipped relative to
    original Rescue; (2) round constants are generated directly from a SHAKE-256-expanded seed string rather than via
