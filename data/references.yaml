- id: multi2_patent_us_4982429
  kind: patent
  title: Encipher Method and Decipher Method (US Patent 4,982,429)
  authors:
  - Kazuo Takaragi
  - Fusao Nakagawa
  - Ryoichi Sasaki
  year: 1991
  organization: Hitachi, Ltd. / Hitachi Control Systems, Inc.
  status: granted
  url: https://patents.google.com/patent/US4982429A/en
  notes: 'Local copy: references/[1988][multi2][patent][4982429+A].pdf. Filed 1989-04-27 (Japan priority application
    63-103919, 1988-04-28), granted 1991-01-01. This is the original design document for what became MULTI2, describing
    the substitution-transformation (P1-P4) / permutation-transformation (R1-R3) encipher method. The prior "multi2_ref"
    entry (a purported Miyaguchi paper "MULTI2: An Encryption Algorithm for Satellite Broadcasting," CRYPTO 1988, LNCS
    403) does not correspond to any real paper in that proceedings volume and has been removed; MULTI2''s actual
    inventors are Takaragi, Nakagawa, and Sasaki of Hitachi, not Miyaguchi. The patent''s Background of the Invention
    explicitly frames the design against both prior algorithms: it describes DES''s substitution-box/permutation-table
    process in detail (Figs. 11-13, labeled "PRIOR ART") and states that, compared with DES, "the number of processes
    for the substitution transformation and permutation transformation can be reduced, so that the encipherment process
    can be executed at a high speed" -- and separately explains that FEAL processes data on a byte-unit basis (efficient
    on 8-bit microcomputers but not 32-bit ones), concluding that "the encryption algorithm for fundamentally executing
    the processes on a 4-byte unit basis which is suitable for the 32-bit microcomputer is demanded" -- exactly the
    object the invention delivers. See the multi2 family''s influences[] for both edges.'
