- id: abdelraheem_et_al_2011_armadillo2_cryptanalysis
  kind: paper
  title: Cryptanalysis of ARMADILLO2
  authors:
  - Mohamed Ahmed Abdelraheem
  - Céline Blondeau
  - María Naya-Plasencia
  - Marion Videau
  - Erik Zenner
  year: 2011
  venue: 'Advances in Cryptology - ASIACRYPT 2011, Seoul, South Korea, pp. 308-326 (DOI 10.1007/978-3-642-25385-0_17)'
  url: https://inria.hal.science/inria-00619236
  notes: 'Fetched directly from inria.hal.science (eprint.iacr.org/2011/160 mirrors the same paper but blocks
    automated fetching). Meet-in-the-middle / parallel-matching-algorithm cryptanalysis: inverts the ARMADILLO2
    building block for a chosen public input given part of the output, yielding key-recovery attacks on the
    FIL-MAC and PRNG/stream-cipher modes and a (second)-preimage attack on the hash mode, all faster than
    exhaustive search (e.g. 2^208 time / 2^205 memory, or 2^249 time / 2^45 memory, for the 256-bit-output hash).
    Local copy: references/[2011][armadillo][][armadillo2+cryptanalysis].pdf.'
- id: naya_plasencia_peyrin_2012_armadillo2_practical_cryptanalysis
  kind: paper
  title: Practical Cryptanalysis of ARMADILLO2
  authors:
  - María Naya-Plasencia
  - Thomas Peyrin
  year: 2012
  venue: Fast Software Encryption (FSE) 2012
  url: https://www.iacr.org/archive/fse2012/75490147/75490147.pdf
  notes: 'Fetched directly from IACR''s own FSE 2012 proceedings archive (not eprint.iacr.org, which is
    Cloudflare-gated in this environment). Follow-up to abdelraheem_et_al_2011_armadillo2_cryptanalysis: exploits a
    parity-bit invariant preserved through all ARMADILLO2 internal permutations for a cheap stream-cipher
    distinguisher, then exploits weak diffusion under attacker-controlled Hamming weight for a practical free-start
    collision attack on the compression function, and introduces a new "local-linearization" technique for a
    practical semi-free-start collision attack on the hash function -- all experimentally verified, requiring "at
    most 2^10.2 operations for 256-bit output version and negligible memory," i.e. collisions found in under a
    second on ordinary hardware, plus a related-key recovery attack in the stream-cipher mode. Local copy:
    references/[2012][armadillo][][armadillo2+practical+cryptanalysis].pdf.'
