version: 1

# Catalogue of cryptographic building blocks.
#
# Every component definition records what *kind* of operation it is;
# parameterised components (e.g. field_matrix_mul, add_mod) list the
# parameters a family entry must supply when referencing the component.
#
# Categories
#   logical       – Boolean bitwise gates
#   register      – Feedback shift registers
#   substitution  – Non-linear lookup tables
#   permutation   – Fixed bit/word rearrangements
#   linear_layer  – Matrix-multiplication layers
#   shift_rotation – Shifts and rotations (fixed or variable amount)
#   arithmetic    – Modular integer arithmetic
#   constant      – Injection of design-time constant values

components:
  # ── Logical ──────────────────────────────────────────────────────────────

  - id: and
    name: Bitwise AND
    category: logical
    notes: >
      Two-input Boolean AND: outputs 1 only when both input bits are 1.
      Algebraic degree 2 as a function of its two inputs, making it the
      simplest available source of nonlinearity over GF(2) -- the "AND" in
      AND-RX/Boolean-operator-network designs (e.g. Simon, Keccak's chi
      step), used the way modular addition supplies nonlinearity in ARX.

  - id: or
    name: Bitwise OR
    category: logical
    notes: >
      Two-input Boolean OR: outputs 0 only when both input bits are 0.
      Nonlinear over GF(2) like AND, and related to it by De Morgan's law
      (a OR b = NOT((NOT a) AND (NOT b))), so a design mixing OR with
      AND/XOR/NOT (e.g. Gimli's T-function, KNOT's S-box) is still
      expressible with AND as the only "primitive" nonlinear gate -- OR is
      a modeling convenience, not a fundamentally different nonlinearity
      source.

  - id: xor
    name: Bitwise XOR
    category: logical
    notes: >
      The most common mixing operation in symmetric cryptography.
      XOR is its own inverse and has uniform difference distribution.

  - id: not
    name: Bitwise NOT
    category: logical
    notes: >
      Logical complement of a bit (flips 0 <-> 1). Affine (degree 1) over
      GF(2) -- equivalent to XOR with an all-ones constant -- so on its own
      it contributes no nonlinearity; used alongside AND/OR to build a
      small nonlinear layer (e.g. Keccak/Ascon/Xoodoo's chi step is
      XOR + AND + NOT) or to break fixed points/round-slide symmetry.

  # ── Feedback Shift Registers ─────────────────────────────────────────────

  - id: lfsr
    name: Linear Feedback Shift Register (LFSR)
    category: register
    parameters:
      - name: length
        description: "Register length in bits"
        type: integer
      - name: feedback_polynomial
        description: "Feedback polynomial in hex or algebraic notation"
        type: string
    notes: >
      A shift register whose input bit is a linear (XOR) combination of
      previous state bits. When the feedback polynomial is primitive the
      register produces a maximum-length sequence of period 2^n − 1.

  - id: nlfsr
    name: Non-Linear Feedback Shift Register (NLFSR)
    category: register
    parameters:
      - name: length
        description: "Register length in bits"
        type: integer
    notes: >
      A shift register whose feedback function is non-linear, producing
      sequences with higher algebraic complexity than an LFSR of the same
      length.  Used in Grain, Trivium, and various hardware-oriented ciphers.

  # ── Substitution ─────────────────────────────────────────────────────────

  - id: sbox
    name: Substitution Box (S-box)
    category: substitution
    parameters:
      - name: input_bits
        description: "Number of input bits (e.g. 4 for a 4-bit S-box, 8 for AES)"
        type: integer
      - name: output_bits
        description: "Number of output bits; often equals input_bits"
        type: integer
    notes: >
      A non-linear lookup table mapping n-bit inputs to m-bit outputs.
      Provides the confusion property.  May be defined algebraically
      (e.g. the AES S-box is the multiplicative inverse in GF(2^8) composed
      with an affine map) or tabulated directly.

  # ── Linear Layer (Matrix Multiplication) ─────────────────────────────────

  - id: field_matrix_mul
    name: Field Matrix Multiplication
    category: linear_layer
    parameters:
      - name: field_size
        description: >
          Number of elements in the finite field, e.g. 256 for GF(2^8) or
          16 for GF(2^4).  Must be a power of 2.
        type: integer
    notes: >
      Multiplication of a state vector by a matrix whose entries are elements
      of a finite extension field GF(2^n).  Provides MDS diffusion when an
      MDS matrix is used.  The canonical example is MixColumns in AES, which
      is multiplication over GF(2^8) (field_size = 256).

  - id: binary_matrix_mul
    name: Binary Matrix Multiplication
    category: linear_layer
    special_case_of: field_matrix_mul
    notes: >
      Multiplication of a state vector by a binary matrix over GF(2).
      Each output bit is the XOR of a subset of input bits determined by
      the matrix row.  Provides Maximum Distance Separable (MDS) diffusion
      when the matrix is an MDS matrix.

  # ── Permutation ───────────────────────────────────────────────────────────

  - id: word_permutation
    name: Word-wise Permutation
    category: permutation
    special_case_of: field_matrix_mul
    parameters:
      - name: word_size_bits
        description: "Size of each word in bits (e.g. 8 for byte-level)"
        type: integer
    notes: >
      A fixed rearrangement of whole words (bytes, nibbles, 32-bit words, …).
      Provides inter-column diffusion without mixing within a word.
      Example: ShiftRows in AES rearranges bytes within a 4×4 byte state.

  - id: bit_permutation
    name: Bitwise Permutation
    category: permutation
    special_case_of: word_permutation
    notes: >
      A fixed, key-independent rearrangement of individual bit positions.
      Provides diffusion at the bit level with very low hardware cost.
      Examples: the P-layer in PRESENT, the bit permutation in GIFT.

  - id: bit_reversal
    name: Bit Reversal
    category: permutation
    special_case_of: bit_permutation
    notes: >
      A bitwise permutation that reverses the order of all bits in a word.
      A special case of bit_permutation with the permutation π(i) = n−1−i.

  # ── Shift and Rotation ────────────────────────────────────────────────────

  - id: rotation_fixed
    name: Fixed Rotation
    category: shift_rotation
    special_case_of: bit_permutation
    parameters:
      - name: amount
        description: "Rotation distance in bits, fixed at design time"
        type: integer
    notes: >
      Cyclic rotation of a word by a constant number of bit positions.
      All bits are preserved; no information is lost.
      A core ARX operation; used in Salsa20, ChaCha20, BLAKE, Threefish.

  - id: shift_fixed
    name: Fixed Shift
    category: shift_rotation
    parameters:
      - name: amount
        description: "Shift distance in bits, fixed at design time"
        type: integer
    notes: >
      Logical (zero-filling) shift of a word by a constant number of bit
      positions.  Bits shifted out are discarded; the vacated positions are
      filled with zeros.

  - id: rotation_variable
    name: Variable Rotation
    category: shift_rotation
    notes: >
      Cyclic rotation of a word by an amount determined at run time from the
      data (data-dependent rotation).  Provides non-linearity because the
      rotation amount is itself a function of the state.
      Used in RC5, RC6, and related designs.

  - id: shift_variable
    name: Variable Shift
    category: shift_rotation
    notes: >
      Logical shift of a word by an amount determined at run time from the
      data.  Less common than variable rotation; used in some stream ciphers
      and hash functions.

  # ── Modular Arithmetic ────────────────────────────────────────────────────

  - id: add_mod
    name: Modular Addition
    category: arithmetic
    parameters:
      - name: modulus
        description: >
          The modulus as an integer, e.g. 4294967296 for addition mod 2^32
          or 18446744073709551616 for addition mod 2^64.
        type: integer
    notes: >
      Integer addition modulo a power of two.  Provides non-linearity with
      respect to XOR and is the "A" in ARX designs.
      Example: Salsa20 and ChaCha20 use addition mod 2^32.

  - id: sub_mod
    name: Modular Subtraction
    category: arithmetic
    parameters:
      - name: modulus
        description: "The modulus as an integer"
        type: integer
    notes: >
      Integer subtraction modulo a value.  Used as the inverse of modular
      addition in decryption, and occasionally as a mixing primitive itself.

  - id: mul_mod
    name: Modular Multiplication
    category: arithmetic
    parameters:
      - name: modulus
        description: >
          The modulus as an integer, e.g. 65537 for multiplication mod 2^16+1
          as used in IDEA.
        type: integer
    notes: >
      Integer multiplication modulo a value.  Provides very strong mixing
      but is significantly slower than XOR or addition on most platforms.
      The canonical example is IDEA, which multiplies mod 2^16 + 1.

  # ── Constants ─────────────────────────────────────────────────────────────

  - id: constant
    name: Constant Injection
    category: constant
    notes: >
      Injection of fixed design-time constants into the cipher state.
      Includes round constants (e.g. AES RCON, PRESENT/GIFT round constants),
      initialisation constants (e.g. the "expand 32-byte k" string in
      Salsa20/ChaCha20), and domain-separation constants.
      Prevents slide attacks and ensures distinct round transformations.

  - id: absg_decimation
    name: ABSG Decimation
    category: logical
    notes: >
      Alternating-step-style irregular decimation: a control register (or a
      Boolean function of one) decides, cycle by cycle, whether the current
      output bit of a data register is kept or discarded, so the effective
      output rate varies with the control sequence rather than being fixed
      one-bit-per-clock. Used by LILI-128 and DECIM as their irregular
      decimation rule, distinct from -- but in the same family as -- the
      two-register Shrinking Generator's decimation (see
      filtered_lfsr_with_decimation).

  - id: boolean_combiner
    name: Boolean Combiner
    category: logical
    notes: >
      A single nonlinear Boolean function taking one input bit from each of
      several independently-clocked LFSRs/NLFSRs and combining them into one
      output bit per cycle -- the classical "combination generator" model
      (as opposed to a filter generator, which reads several taps from a
      single register). Used by Achterbahn, whose output is the XOR of two
      such nonlinear combiner functions over its constituent NLFSRs.

  - id: boolean_filter
    name: Boolean Filter
    category: logical
    notes: >
      A single nonlinear Boolean function reading several tap positions of
      one register (as opposed to a boolean_combiner, which reads one tap
      from each of several registers) to produce the output bit -- the
      classical "filter generator" model. Used by Grain (filtering both its
      LFSR and NLFSR taps) and, alongside absg_decimation, by LILI-128 and
      DECIM.

  - id: counter
    name: Counter
    category: arithmetic
    notes: >
      A register that increments (typically modular addition by 1, or a
      similar deterministic update) once per cycle, used either directly as
      part of the keystream state (Rabbit's counter system supplies
      non-clock-driven diffusion between its inner state functions) or as a
      domain-separation / uniqueness input to a keyed permutation or
      compression function (Leviathan's whitening counter).

  - id: fcsr
    name: Feedback with Carry Shift Register (FCSR)
    category: register
    parameters:
      - name: length
        description: "Register length in bits"
        type: integer
    notes: >
      A shift register whose feedback is computed with carry propagation
      over the 2-adic numbers (arithmetic mod 2^n with carries), rather than
      the pure XOR feedback of an LFSR. Produces sequences with large
      2-adic span/complexity, giving resistance to the algebraic (Berlekamp
      -Massey-style) attacks that break plain LFSR-based generators. F-FCSR
      is the canonical example (filtered_fcsr).

  - id: inversion_sbox
    name: Inversion S-box
    category: substitution
    parameters:
      - name: field_size
        description: "Size of the finite field GF(2^n) the inversion is computed over"
        type: integer
    notes: >
      The specific S-box x -> x^(-1) (with 0 mapped to 0) over GF(2^n) --
      the multiplicative-inverse map, chosen for its provably low
      differential uniformity and linearity (AES's S-box is this map
      composed with an affine transform; Jarvis, Vision, and SFINKS use the
      inverse map directly, without AES's extra affine layer, as an
      arithmetization-oriented or algebraically simple nonlinear layer).

  - id: linear_filter
    name: Linear Filter
    category: linear_layer
    notes: >
      A linear (XOR-only, no genuine nonlinearity) function reading several
      state positions to produce a feedback or output value -- e.g. F-FCSR's
      linear output filter applied on top of its FCSR state, distinct from
      a boolean_filter (which is explicitly nonlinear).

  - id: linear_transform
    name: Linear Transform
    category: linear_layer
    notes: >
      A generic linear (GF(2)-affine, XOR-only) diffusion layer that isn't
      more specifically a byte/word matrix multiplication
      (field_matrix_mul/binary_matrix_mul) or a pure wiring permutation
      (bit_permutation/word_permutation) -- e.g. 3-Way's theta function,
      Kuznyechik's/SC2000's/ZUC's dedicated linear layers, or Subterranean's
      state-mixing step, each defined by its own family-specific formula
      rather than a named matrix or fixed rewiring.

  - id: lookup_table
    name: Lookup Table
    category: substitution
    notes: >
      A precomputed table (larger than a conventional fixed S-box, and
      sometimes itself key- or state-dependent, as in RC4-family designs)
      indexed by part of the running state to produce nonlinear output --
      e.g. WAKE's and SEAL's large keyed/derived lookup tables, HC-128/
      HC-256's state arrays used as their own nonlinear lookup source, and
      CMEA's/Oryx's fixed substitution tables.

  - id: permutation
    name: Permutation
    category: permutation
    notes: >
      A generic bijective rearrangement of the state used as a component
      reference when no more specific permutation type
      (bit_permutation/word_permutation/bit_reversal) or size parameter
      applies -- e.g. a reference to "the permutation step" of a design
      whose exact wiring is family-specific (Lucifer, MacGuffin, CLX,
      RC4-family designs).

  - id: permutation_vector
    name: Permutation Vector
    category: permutation
    notes: >
      A permutation drawn from a keyed or public pseudorandom source and
      applied to reorder secret bits before a Boolean filter reads them --
      the defining mechanism of a Filter Permutator construction (FLIP,
      FiLIP): a fresh permutation vector is generated per output bit
      (typically from a public IV-seeded PRNG) instead of maintaining an
      updated register state.

  - id: shift_register
    name: Shift Register
    category: register
    notes: >
      A generic register that shifts its contents by one position per
      cycle, used as a component reference when the feedback rule is not
      specifically linear (lfsr) or nonlinear (nlfsr) -- e.g. YAMB's
      shift-register-based state alongside its lookup table.

  - id: t_function
    name: T-Function
    category: arithmetic
    notes: >
      An operation (in the sense of Klimov and Shamir, "A New Class of
      Invertible Mappings," CHES 2002) in which output bit i depends only
      on input bits 0..i -- a "triangular" dependency that guarantees the
      whole map is a bijection on n-bit words by construction, regardless
      of which arithmetic/logical operations (addition, multiplication,
      AND, OR, XOR) are combined to build it, without needing a separate
      S-box or explicit permutation step to prove invertibility. VMPC uses
      one directly as a component; see the construction-tier `t_function`
      leaf in primitive_constructions.yaml for designs built entirely
      around this property.

  - id: nonlinear_filter
    name: Nonlinear Filter
    category: substitution
    notes: >
      A nonlinear Boolean (or word-oriented) function reading several state
      positions to produce an output or feedback value, used as a component
      reference when the underlying register is a general LFSR/state array
      rather than specifically a boolean_filter over a bit-level LFSR tap
      set -- e.g. WG's Welch-Gong nonlinear filter over GF(2^29), Dragon's
      and NLSv2's word-oriented nonlinear feedback functions, and
      CryptMT3's nonlinear filter over its Mersenne Twister state.

  - id: mix_columns
    name: MixColumns
    category: linear_layer
    notes: >
      The specific MDS diffusion layer introduced by Rijndael/AES: a
      binary_matrix_mul / field_matrix_mul instance that multiplies each
      column of the byte-state by a fixed 4x4 MDS matrix over GF(2^8).
      Recorded as its own component id (rather than a generic
      field_matrix_mul reference) when a design reuses AES's MixColumns
      matrix verbatim or near-verbatim (e.g. LEX, Cube Cipher), so that
      reuse is queryable directly rather than only inferable from matching
      parameters.

  - id: compression_function
    name: Compression Function
    category: logical
    notes: >
      A generic reference to "some externally-defined compression function"
      as a component of a larger construction, used when a design's
      internal memory-hardening or mixing step is explicitly built by
      invoking a hash compression function as a black box (e.g. Argon/
      Argon2's memory-filling permutation is built around BLAKE2b's
      compression function) rather than a bespoke permutation of its own.

  - id: power_map_sbox
    name: Power-Map S-box
    category: substitution
    parameters:
      - name: field_size
        description: >
          Size of the finite field the S-box operates over: a prime p for GF(p),
          or 2^n for a binary extension field GF(2^n).
        type: integer
      - name: exponent
        description: >
          The exponent d of the map x -> x^d (or x -> x^(1/d), i.e. the inverse
          of x -> x^d, when the design instead applies the low-degree inverse
          permutation).  Chosen coprime to the field's multiplicative-group
          order so the map is a permutation.
        type: integer
    notes: >
      A non-linear layer applying a single low-degree monomial permutation
      x -> x^d (or its inverse x -> x^(1/d)) to each element of a state defined
      natively over a large prime field GF(p) or binary extension field GF(2^n),
      rather than a tabulated lookup as in a byte/bit-oriented sbox. The
      workhorse S-box of arithmetization-oriented (AO) ciphers designed for
      SNARK/STARK/MPC/FHE settings, where cost is measured in field
      multiplications rather than gate count: e.g. x^3 in MiMC and GMiMC,
      x^3/x^(1/3) or x^5/x^(1/5) in Rescue/Rescue-Prime/HadesMiMC/Poseidon
      and Arion's GTDS.  See also inversion_sbox for the specific x -> x^(-1)
      case (differential uniformity 2 over GF(2^n) with n odd), used by Vision.

  - id: prime_field_matrix_mul
    name: Prime-Field Matrix Multiplication
    category: linear_layer
    parameters:
      - name: field_modulus
        description: "The prime p defining the field GF(p) the matrix operates over."
        type: integer
    notes: >
      Multiplication of a state vector by a matrix whose entries are elements
      of a large prime field GF(p), analogous to field_matrix_mul's role for
      binary extension fields.  Used as the linear/diffusion layer of
      arithmetization-oriented ciphers and permutations operating natively
      over GF(p) (MiMC, GMiMC, Rescue, HadesMiMC/Poseidon, Arion), typically
      instantiated as an MDS or near-MDS matrix to guarantee strong diffusion
      in as few rounds as possible.

  - id: cauchy_matrix
    name: Cauchy MDS Matrix
    category: linear_layer
    special_case_of: prime_field_matrix_mul
    notes: >
      An MDS matrix constructed as M[i][j] = 1/(x_i - y_j) for distinct field
      constants x_i, y_j, guaranteeing the MDS property by construction (any
      submatrix of a Cauchy matrix is invertible) rather than by search.  Used
      by HadesMiMC/Poseidon and Vision/Rescue.  Shown to have exploitable weak
      instances when the x_i are chosen from an additive subgroup of the field
      (Beyne, Canteaut, Dinur, Eichlseder, Leander, Leurent, Naya-Plasencia,
      Perrin, Sasaki, Todo, Wiemer, "Out of Oddity", CRYPTO 2020) -- a
      construction-specific pitfall distinct from the general MDS property.
