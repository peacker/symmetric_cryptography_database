- id: moe_step
  name: MOE step
  kind: step
  spec:
    component_flow:
    - component_id: xor
      params:
        note: key/round-constant addition K_2i
    - component_id: mul_mod
      params:
        modulus: 340282366920938463463374607431768211456
        note: A_3^-1, multiplication by the inverse of 3 mod 2^128
    - component_id: binary_matrix_mul
    - component_id: xor
      params:
        note: key/round-constant addition K_2i+1
    - component_id: mul_mod
      params:
        modulus: 340282366920938463463374607431768211456
        note: A_3, multiplication by 3 mod 2^128
    - component_id: binary_matrix_mul
    constant_injection: round_key
    state_model:
      state_bits: 128
  notes: 'MOE step i (of 4): step_i = M∘A3∘K_2i+1∘M∘A3^-1∘K_2i, i.e. key-add, multiply
    by 3^-1 mod 2^128, multiply by a fixed random invertible 128x128 GF(2) matrix M,
    key-add, multiply by 3 mod 2^128, multiply by M again. A final key addition K_8
    follows the 4th step. No S-box anywhere: the paper''s own Section 4.5 ("On the
    unsuitability of SPN constructions") explains that a wide-trail S-box-based SPN
    was deliberately rejected because it would need too many secret-sharing/recombination
    steps for the paper''s MPC-based Trojan-resilience goal.'
