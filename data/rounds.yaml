version: 1
rounds:
- id: uknit_bc_round
  name: uKNIT-BC heterogeneous round
  kind: full_round
  spec:
    component_flow:
    - component_id: xor
    - component_id: sbox
      params:
        input_bits: 4
        output_bits: 4
    - component_id: binary_matrix_mul
    state_model:
      state_bits: 64
      word_bits: 4
      branches: 16
    constant_injection: round_key
    round_variation:
      substitution_layers: 12_distinct_bit_transpositions_of_mantis_sbox
      linear_layers: 11_distinct_sparse_64x64_binary_matrices
      final_round_omits_linear_layer: true
  notes: Each round first adds a 64-bit round key, applies sixteen 4-bit S-boxes,
    then (except in round 12) applies that round's sparse binary linear layer. Every
    substitution and linear layer is independently specified; this entry represents
    the heterogeneous twelve-round sequence rather than one repeated transformation.
- id: sha0_round
  name: SHA-0 round
  kind: full_round
  spec:
    component_flow:
    - component_id: and
    - component_id: or
    - component_id: not
    - component_id: xor
    - component_id: rotation_fixed
    - component_id: add_mod
      params:
        modulus: 4294967296
    - component_id: constant
    state_model:
      state_bits: 160
      word_bits: 32
      branches: 5
    constant_injection: scheduled_message_word_and_round_constant
  notes: SHA-0 uses the SHA-1 compression step and four Boolean-function phases,
    but its expanded message words are XORs of earlier words without SHA-1's added
    one-bit rotation.
- id: a5_1_clock_step
  name: A5/1 irregular clock step
  kind: step
  spec:
    component_flow:
    - component_id: and
    - component_id: or
    - component_id: lfsr
    - component_id: xor
    state_model:
      state_bits: 64
      register_lengths:
      - 19
      - 22
      - 23
    constant_injection: none
  notes: Compute the majority of the three designated clock bits; clock each LFSR
    whose clock bit equals the majority, then XOR the three output bits.
- id: a5_2_clock_step
  name: A5/2 controlled clock step
  kind: step
  spec:
    component_flow:
    - component_id: and
    - component_id: or
    - component_id: lfsr
    - component_id: xor
    state_model:
      state_bits: 81
      register_lengths:
      - 19
      - 22
      - 23
      - 17
    constant_injection: none
  notes: The fourth 17-bit register controls irregular clocking of the other three;
    the output applies additional majority functions to selected state bits.
- id: tcast_round
  name: tCAST trapdoor Feistel round
  kind: full_round
  spec:
    component_flow:
    - component_id: sbox
      params:
        input_bits: 8
        output_bits: 32
    - component_id: xor
    constant_injection: subkey
  notes: CAST-style Feistel round using four expanding S-boxes that share a hidden
    output relation. The base form uses 8-to-32-bit S-boxes; the paper's 80-bit
    example uses 10-to-40-bit S-boxes.
- id: tloki_round
  name: tLOKI trapdoor Feistel round
  kind: full_round
  spec:
    component_flow:
    - component_id: sbox
      params:
        input_bits: 12
        output_bits: 8
    - component_id: bit_permutation
    - component_id: xor
    state_model:
      state_bits: 64
      branch_bits: 32
    constant_injection: subkey_before_expansion
  notes: LOKI91-style round using four overlapping expanded inputs to the same 12-to-8-bit
    S-box. Coordinated nonlinear relations across the four calls create the trapdoor.
- id: bea1_round
  name: BEA-1 round
  kind: full_round
  spec:
    component_flow:
    - component_id: xor
    - component_id: sbox
      params:
        input_bits: 10
        output_bits: 10
    - component_id: word_permutation
      params:
        word_size_bits: 10
    - component_id: binary_matrix_mul
    state_model:
      state_bits: 80
      word_bits: 10
      branches: 8
    constant_injection: round_key
  notes: AddRoundKey, eight parallel 10-bit substitutions cycling through four S-boxes,
    ShiftRows-like bundle permutation, and two 40-bit linear MixColumns applications.
    The final round omits MixColumns and ends with an additional round key.
- id: paterson_trapdoor_round
  name: Paterson DES-like trapdoor round
  kind: full_round
  spec:
    component_flow:
    - component_id: linear_transform
    - component_id: xor
    - component_id: sbox
      params:
        input_bits: 6
        output_bits: 4
        count: 8
    - component_id: bit_permutation
    - component_id: xor
    state_model:
      state_bits: 64
      branch_bits: 32
    constant_injection: 48_bit_round_key
  notes: DES Feistel round P(S(E(R) XOR k)) using Paterson's replacement S-boxes;
    E and P are the original DES mappings.
- id: parity_check_des_round
  name: Parity-check DES-like round
  kind: full_round
  spec:
    component_flow:
    - component_id: linear_transform
    - component_id: xor
    - component_id: sbox
      params:
        input_bits: 6
        output_bits: 4
        count: 8
    - component_id: bit_permutation
    - component_id: xor
    state_model:
      state_bits: 64
      branch_bits: 32
    constant_injection: des_round_key
  notes: Standard DES-like Feistel round with each S-box modified so one output
    coordinate is the parity check of the other three.
- id: cham_round
  name: CHAM round
  kind: full_round
  spec:
    state_model:
      words: 4
      word_bits: 16_or_32
      state_bits: 64_or_128
    component_flow:
    - component_id: xor
    - component_id: rotation_fixed
    - component_id: add_mod
    - component_id: rotation_fixed
    constant_injection: round_counter_and_subkey
  notes: Original CHAM ARX round over four words. Even and odd rounds alternate one-
    and eight-bit rotations; the word size determines the addition modulus.
- id: cham_revised_round
  name: Revised CHAM round
  kind: full_round
  spec:
    state_model:
      words: 4
      word_bits: 16_or_32
      state_bits: 64_or_128
    component_flow:
    - component_id: xor
    - component_id: rotation_fixed
    - component_id: add_mod
    - component_id: rotation_fixed
    constant_injection: round_counter_and_subkey
  notes: Revised CHAM retains the original alternating ARX round structure and uses
    increased round counts for all three parameter sets.
- id: saecham_round
  name: SAECHAM round
  kind: full_round
  spec:
    state_model:
      words: 4
      word_bits: 16
      state_bits: 64
    component_flow:
    - component_id: rotation_fixed
    - component_id: xor
    - component_id: add_mod
      params:
        modulus: 65536
    constant_injection: round_counter_and_subkey
  notes: SAECHAM's CHAM-RXA-derived round restructures the order of rotation, XOR,
    and 16-bit modular addition. Even and odd rounds use distinct fixed rotations.
- id: rijndael_aes_round
  name: Rijndael/AES Full Round
  kind: full_round
  spec:
    state_model:
      layout: 4x4_bytes
      state_bits: 128
    component_flow:
    - component_id: sbox
      params:
        input_bits: 8
        output_bits: 8
    - component_id: word_permutation
      params:
        word_size_bits: 8
    - component_id: field_matrix_mul
      params:
        field_size: 256
    - component_id: xor
    constant_injection: round_constant
  notes: 'Canonical AES-like round: SubBytes, ShiftRows, MixColumns, AddRoundKey.
    Shared by Rijndael/AES variants modulo round count and first/last-round details.

    '
- id: salsa_quarterround
  name: Salsa Quarterround
  kind: quarterround
  spec:
    state_model:
      word_bits: 32
      words_touched: 4
    component_flow:
    - component_id: add_mod
      params:
        modulus: 4294967296
    - component_id: xor
    - component_id: rotation_fixed
    rotation_constants:
    - 7
    - 9
    - 13
    - 18
    constant_injection: none
  notes: 'Salsa quarterround over four 32-bit words with fixed rotation constants
    7, 9, 13, 18.

    '
- id: chacha_quarterround
  name: ChaCha Quarterround
  kind: quarterround
  spec:
    state_model:
      word_bits: 32
      words_touched: 4
    component_flow:
    - component_id: add_mod
      params:
        modulus: 4294967296
    - component_id: xor
    - component_id: rotation_fixed
    rotation_constants:
    - 16
    - 12
    - 8
    - 7
    constant_injection: none
  notes: 'ChaCha quarterround over four 32-bit words with fixed rotation constants
    16, 12, 8, 7.

    '
- id: present_round
  name: PRESENT Full Round
  kind: full_round
  spec:
    state_model:
      state_bits: 64
    component_flow:
    - component_id: xor
    - component_id: sbox
      params:
        input_bits: 4
        output_bits: 4
    - component_id: bit_permutation
    constant_injection: round_counter
  notes: 'PRESENT round with addRoundKey, 4-bit S-box layer, and P-layer.

    '
- id: gift_round
  name: GIFT Full Round
  kind: full_round
  spec:
    state_model:
      state_bits_options:
      - 64
      - 128
    component_flow:
    - component_id: sbox
      params:
        input_bits: 4
        output_bits: 4
    - component_id: bit_permutation
    - component_id: xor
    constant_injection: round_constant
  notes: 'GIFT round with nibble S-box layer, bit permutation layer, and key/constant
    injection.

    '
- id: des_round
  name: DES Feistel Round
  kind: full_round
  spec:
    state_model:
      state_bits: 64
      branch_bits: 32
    component_flow:
    - component_id: bit_permutation
    - component_id: xor
    - component_id: sbox
      params:
        input_bits: 6
        output_bits: 4
    - component_id: bit_permutation
    constant_injection: none
  notes: 'DES Feistel round with expansion, subkey XOR, S-box substitution, and P-permutation.

    '
- id: desl_round
  name: DESL Feistel Round
  kind: full_round
  spec:
    state_model:
      state_bits: 64
      branch_bits: 32
    component_flow:
    - component_id: bit_permutation
    - component_id: xor
    - component_id: sbox
      params:
        input_bits: 6
        output_bits: 4
    - component_id: bit_permutation
    constant_injection: none
  notes: 'Identical round shape to DES''s Feistel round (expansion, subkey XOR, S-box, P-permutation), but with a
    single redesigned 6-to-4 S-box used in place of all eight of DES''s distinct S-boxes S1..S8, per Leander, Paar,
    Poschmann, Schramm, "New Lightweight DES Variants" (FSE 2007) -- chosen to satisfy Kim et al.''s design criteria
    for resistance to linear/differential cryptanalysis and the Davies-Murphy attack despite the reduced S-box
    diversity.

    '
- id: desxl_round
  name: DESXL whitening
  kind: other
  spec:
    component_flow:
    - component_id: xor
  notes: 'The DESX-style pre-/post-whitening XOR that DESXL adds around the DESL core (see desl_round for DESL''s
    own Feistel round), mirroring how desx_round represents only DESX''s whitening addition around DES.

    '
- id: blowfish_round
  name: Blowfish Feistel Round
  kind: full_round
  spec:
    state_model:
      state_bits: 64
      branch_bits: 32
    component_flow:
    - component_id: add_mod
      params:
        modulus: 4294967296
    - component_id: sbox
      params:
        input_bits: 8
        output_bits: 32
    - component_id: xor
    constant_injection: none
  notes: 'Blowfish Feistel round using key-dependent S-boxes and ARX mixing in F.

    '
- id: idea_round
  name: IDEA Round
  kind: full_round
  spec:
    state_model:
      state_bits: 64
      word_bits: 16
    component_flow:
    - component_id: add_mod
      params:
        modulus: 65536
    - component_id: mul_mod
      params:
        modulus: 65537
    - component_id: xor
    constant_injection: none
  notes: 'IDEA round using mixed-group operations (mod 2^16 addition, mod 2^16+1 multiplication,
    XOR).

    '
- id: tea_round
  name: TEA Round Pair
  kind: full_round
  spec:
    state_model:
      state_bits: 64
      word_bits: 32
    component_flow:
    - component_id: add_mod
      params:
        modulus: 4294967296
    - component_id: xor
    - component_id: shift_fixed
      params:
        amount: 4
    - component_id: shift_fixed
      params:
        amount: 5
    - component_id: constant
    constant_injection: delta_constant
  notes: 'One TEA cycle (two Feistel rounds) with delta constant accumulation.

    '
- id: raiden_round
  name: Raiden Round
  kind: full_round
  spec:
    state_model:
      state_bits: 64
      branches: 2
    component_flow:
    - component_id: add_mod
      params:
        modulus: 4294967296
    - component_id: sub_mod
      params:
        modulus: 4294967296
    - component_id: xor
    - component_id: rotation_variable
    constant_injection: evolved_key_schedule
  notes: Classical Feistel round using the genetically evolved Raiden round
    function and key schedule over 32-bit words.
- id: xtea_round
  name: XTEA Round Pair
  kind: full_round
  spec:
    state_model:
      state_bits: 64
      word_bits: 32
    component_flow:
    - component_id: add_mod
      params:
        modulus: 4294967296
    - component_id: xor
    - component_id: shift_fixed
      params:
        amount: 4
    - component_id: shift_fixed
      params:
        amount: 5
    - component_id: constant
    constant_injection: delta_constant
  notes: 'One XTEA cycle (two Feistel rounds) with revised key schedule.

    '
- id: twofish_round
  name: Twofish Round
  kind: full_round
  spec:
    state_model:
      state_bits: 128
    component_flow:
    - component_id: sbox
      params:
        input_bits: 8
        output_bits: 8
    - component_id: field_matrix_mul
      params:
        field_size: 256
    - component_id: xor
    - component_id: rotation_fixed
    constant_injection: subkeys
  notes: 'Twofish round with key-dependent S-boxes, MDS mixing, pseudo-Hadamard transform,
    and rotations.

    '
- id: serpent_round
  name: Serpent Round
  kind: full_round
  spec:
    state_model:
      state_bits: 128
    component_flow:
    - component_id: xor
    - component_id: sbox
      params:
        input_bits: 4
        output_bits: 4
    - component_id: binary_matrix_mul
    constant_injection: round_key
  notes: 'Serpent round with key mixing, bitslice 4x4 S-box layer, and linear transformation.

    '
- id: camellia_round
  name: Camellia Feistel Round
  kind: full_round
  spec:
    state_model:
      state_bits: 128
      branch_bits: 64
    component_flow:
    - component_id: xor
    - component_id: sbox
      params:
        input_bits: 8
        output_bits: 8
    - component_id: binary_matrix_mul
    - component_id: xor
    constant_injection: subkeys
  notes: 'Camellia Feistel round using F-function S-box/linear layer; FL/FLINV layers
    are inserted every six rounds.

    '
- id: piccolo_round
  name: Piccolo Round
  kind: full_round
  spec:
    state_model:
      state_bits: 64
      branches: 4
    component_flow:
    - component_id: sbox
      params:
        input_bits: 4
        output_bits: 4
    - component_id: field_matrix_mul
      params:
        field_size: 16
    - component_id: xor
    - component_id: word_permutation
      params:
        word_size_bits: 16
    constant_injection: round_key
  notes: Piccolo generalized-Feistel round with two nonlinear F-functions and
    a 16-bit-word round permutation.
- id: simon_round
  name: SIMON Round
  kind: full_round
  spec:
    state_model:
      state_bits_options:
      - 32
      - 48
      - 64
      - 96
      - 128
    component_flow:
    - component_id: rotation_fixed
    - component_id: and
    - component_id: xor
    - component_id: constant
    constant_injection: z_sequence
  notes: 'SIMON Feistel round using AND/XOR and rotations with round constants.

    '
- id: simeck_round
  name: Simeck Round
  kind: full_round
  spec:
    state_model:
      state_bits_options:
      - 32
      - 48
      - 64
    component_flow:
    - component_id: rotation_fixed
    - component_id: and
    - component_id: xor
    - component_id: constant
    constant_injection: lfsr_sequence
  notes: 'Simeck Feistel round, a modified SIMON round with different rotation amounts (0, 5, 1 vs SIMON''s 1, 8, 2)
    per the Simeck paper (Yang, Zhu, Suder, Aagaard, Gong, CHES 2015); round constants are also LFSR-generated but
    from a simpler sequence than SIMON''s.

    '
- id: speck_round
  name: SPECK Round
  kind: full_round
  spec:
    state_model:
      state_bits_options:
      - 32
      - 48
      - 64
      - 96
      - 128
    component_flow:
    - component_id: rotation_fixed
    - component_id: add_mod
      params:
        modulus: 4294967296
    - component_id: xor
    constant_injection: round_key
  notes: 'SPECK ARX round using opposite-direction rotations, modular addition, and
    XOR with round key.

    '
- id: prince_round
  name: PRINCE Core Round
  kind: full_round
  spec:
    state_model:
      state_bits: 64
    component_flow:
    - component_id: sbox
      params:
        input_bits: 4
        output_bits: 4
    - component_id: binary_matrix_mul
    - component_id: xor
    - component_id: constant
    constant_injection: round_constant
  notes: 'PRINCE forward/backward core round with S-layer and linear mixing.

    '
- id: led_round
  name: LED Step Round
  kind: step
  spec:
    state_model:
      state_bits: 64
    component_flow:
    - component_id: sbox
      params:
        input_bits: 4
        output_bits: 4
    - component_id: word_permutation
      params:
        word_size_bits: 4
    - component_id: field_matrix_mul
      params:
        field_size: 16
    - component_id: xor
    constant_injection: step_constant
  notes: 'LED step transformation (SubCells, ShiftRows, MixColumnsSerial, AddConstants/AddRoundKey).

    '
- id: katan_round
  name: KATAN Update Round
  kind: step
  spec:
    state_model:
      state_bits_options:
      - 32
      - 48
      - 64
    component_flow:
    - component_id: lfsr
    - component_id: nlfsr
    - component_id: and
    - component_id: xor
    - component_id: constant
    constant_injection: irregular_sequence
  notes: 'KATAN round as coupled shift-register updates with non-linear taps.

    '
- id: ktantan_round
  name: KTANTAN Update Round
  kind: step
  spec:
    state_model:
      state_bits_options:
      - 32
      - 48
      - 64
    component_flow:
    - component_id: lfsr
    - component_id: nlfsr
    - component_id: and
    - component_id: xor
    - component_id: constant
    constant_injection: irregular_sequence
  notes: 'KTANTAN hardware-embedded-key update round; structurally related to KATAN.

    '
- id: cast128_round
  name: CAST-128 Feistel Round
  kind: full_round
  spec:
    state_model:
      state_bits: 64
      branch_bits: 32
    component_flow:
    - component_id: add_mod
      params:
        modulus: 4294967296
    - component_id: sub_mod
      params:
        modulus: 4294967296
    - component_id: xor
    - component_id: sbox
      params:
        input_bits: 8
        output_bits: 32
    - component_id: rotation_variable
    constant_injection: subkeys
  notes: 'CAST-128 round family uses key-dependent choice of F-function type (add/sub/xor
    + data-dependent rotate + S-box mix) in a Feistel structure.

    '
- id: cast256_round
  name: CAST-256 Quad-Round
  kind: full_round
  spec:
    state_model:
      state_bits: 128
      branch_bits: 32
      branches: 4
    component_flow:
    - component_id: add_mod
      params:
        modulus: 4294967296
    - component_id: sub_mod
      params:
        modulus: 4294967296
    - component_id: xor
    - component_id: sbox
      params:
        input_bits: 8
        output_bits: 32
    - component_id: rotation_variable
    constant_injection: subkeys
  notes: 'CAST-256 uses CAST-style round functions arranged in a 4-branch generalized
    Feistel schedule.

    '
- id: rc5_round
  name: RC5 Data-Dependent Round
  kind: full_round
  spec:
    state_model:
      state_bits_options:
      - 32
      - 64
      - 128
    component_flow:
    - component_id: xor
    - component_id: rotation_variable
    - component_id: add_mod
      params:
        modulus: 4294967296
    constant_injection: subkeys
  notes: 'RC5 round core with XOR, data-dependent rotation, and modular addition.

    '
- id: seed_round
  name: SEED Feistel Round
  kind: full_round
  spec:
    state_model:
      state_bits: 128
      branch_bits: 64
    component_flow:
    - component_id: xor
    - component_id: sbox
      params:
        input_bits: 8
        output_bits: 8
    - component_id: add_mod
      params:
        modulus: 4294967296
    - component_id: sub_mod
      params:
        modulus: 4294967296
    - component_id: rotation_fixed
    constant_injection: subkeys
  notes: 'SEED 16-round Feistel structure with keyed round function over two 32-bit
    words, using S-box layers and modular arithmetic.

    '
- id: aria_round
  name: ARIA Round
  kind: full_round
  spec:
    state_model:
      state_bits: 128
    component_flow:
    - component_id: xor
    - component_id: sbox
      params:
        input_bits: 8
        output_bits: 8
    - component_id: binary_matrix_mul
    constant_injection: round_keys
  notes: 'ARIA alternates two substitution layers and a linear diffusion layer; round
    count depends on key length.

    '
- id: rc4_ksa
  name: RC4 Key Scheduling Algorithm
  kind: other
  spec:
    description: Initializes 256-byte permutation from variable key
  notes: 'RC4 KSA initializes a 256-byte permutation array from a variable-length
    key (1–256 bytes), applying swap operations in a deterministic sequence. Essential
    for producing a key-dependent initial state before PRGA.

    '
- id: rc4_prga
  name: RC4 Pseudo-Random Generation Algorithm
  kind: other
  spec:
    description: Generates keystream bytes from permutation state
  notes: 'RC4 PRGA generates one byte of keystream per iteration by advancing two
    state indices, performing a swap, and extracting an output byte. This update is
    applied repeatedly to generate arbitrary keystream lengths.

    '
- id: rc6_round
  name: RC6 Round
  kind: full_round
  spec:
    state_model:
      state_bits: 128
      word_bits: 32
    component_flow:
    - component_id: xor
    - component_id: mul_mod
      params:
        modulus: 4294967296
    - component_id: rotation_variable
    - component_id: add_mod
      params:
        modulus: 4294967296
    constant_injection: subkeys
  notes: 'RC6 ARX-style round with data-dependent rotation and integer multiplication.

    '
- id: sm4_round
  name: SM4 Round
  kind: full_round
  spec:
    state_model:
      state_bits: 128
      word_bits: 32
    component_flow:
    - component_id: xor
    - component_id: sbox
      params:
        input_bits: 8
        output_bits: 8
    - component_id: rotation_fixed
    - component_id: xor
    constant_injection: round_constants
  notes: 'SM4 32-round update with tau non-linear substitution and linear diffusion.

    '
- id: kasumi_round
  name: KASUMI Round
  kind: full_round
  spec:
    state_model:
      state_bits: 64
      branch_bits: 32
    component_flow:
    - component_id: xor
    - component_id: and
