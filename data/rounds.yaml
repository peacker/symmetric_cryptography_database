- id: lea_round
  name: LEA round
  kind: full_round
  spec:
    component_flow:
    - component_id: add_mod
      params:
        modulus: 4294967296
    - component_id: xor
    - component_id: rotation_fixed
    constant_injection: subkey
    state_model:
      state_bits: 128
      word_bits: 32
  notes: 'LEA ARX round: 32-bit modular add, XOR, and fixed rotations on four 32-bit
    words. Retagged from the generic/unspecified generalized_feistel leaf to
    type3_generalized_feistel: confirmed directly against the LEA paper ([2013][lea][][].pdf)
    that it never calls its own structure "Feistel" or "generalized" anywhere (the
    word "Feistel" appears only once, describing TEA/XTEA for comparison, not LEA
    itself) and against Hoang-Rogaway''s "On Generalized Feistel Networks"
    ([2010][bear_lion,cast256,mars,rc6,skipjack][][generalized_feistel].pdf, Fig. 1) that LEA''s round matches the Type-3 GFN
    shape by structural inspection, not by citation: three of the four 32-bit words
    are each replaced by a keyed, rotated combination of two adjacent input words
    (X_{i+1}[0]=ROL_a((X_i[0]^RK0)+(X_i[1]^RK1)), and similarly for words 1 and 2),
    while the fourth is simply the old first word carried into the last position --
    the same "shift branches, combine an adjacent pair into a new branch" skeleton
    as Type-3 GFN''s Y_i = F_i(X_i) XOR X_{i+1}. One genuine difference from the
    strict Type-3 definition: LEA''s "F" step combines a PAIR of adjacent branches
    via keyed modular addition rather than transforming a single branch and XORing
    it into the next, so this is a generalization of Type-3 GFN''s shape rather than
    a byte-for-byte instance of the original Zheng-Matsumoto-Imai/Hoang-Rogaway
    definition. Each of the three word updates only reads the *previous* round''s
    words, so, despite Type-3''s chained-looking figure, all three are independent/
    parallel within a round (also noted on LEA''s own influences edge to salsa20).'
