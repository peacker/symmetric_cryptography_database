      word_bits: 32
      state_words: 624
    component_flow:
    - component_id: and
      notes: 'mask state word x_k to its upper w-r=1 bits (UPPER_MASK=0x80000000) and x_{k+1} to its lower r=31 bits
        (LOWER_MASK=0x7fffffff), concatenate'
    - component_id: shift_fixed
      params: {amount: 1}
      notes: shift the concatenated 32-bit value right by 1
    - component_id: xor
      notes: XOR with x_{k+m} (m=397) and, conditionally on the shifted-out bit, with the constant vector a=0x9908B0DF
        (the "twist" matrix multiplication, implemented via a 2-entry lookup on the low bit rather than full matrix
        multiply) to produce the new state word x_{k+n}
    - component_id: shift_fixed
      params: {amount: 11}
      notes: 'tempering step 1: y = x XOR (x >> u), u=11'
    - component_id: xor
    - component_id: shift_fixed
      params: {amount: 7}
      notes: 'tempering step 2: y = y XOR ((y << s) AND b), s=7, b=TEMPERING_MASK_B=0x9d2c5680'
    - component_id: and
    - component_id: xor
    - component_id: shift_fixed
      params: {amount: 15}
      notes: 'tempering step 3: y = y XOR ((y << t) AND c), t=15, c=TEMPERING_MASK_C=0xefc60000'
    - component_id: and
    - component_id: xor
    - component_id: shift_fixed
      params: {amount: 18}
      notes: 'tempering step 4 (output): z = y XOR (y >> l), l=18'
    - component_id: xor
  notes: 'One MT19937 step: (1) the linear state-transition recurrence over GF(2), x_{k+n} := x_{k+m} XOR ((x_k^u |
    x_{k+1}^l) A), producing one new 32-bit state word from the 624-word (19937-bit) state (n=624, m=397, r=31, twist
    matrix A=0x9908B0DF -- Matsumoto & Nishimura 1998, Section 2/3); (2) the tempering transform z = xT (a regular,
    invertible GF(2) matrix, Section 5.2, applied to the *output* only, not fed back into the state) using shift/mask
    parameters (u,s,b,t,c,l) = (11, 7, 0x9d2c5680, 15, 0xefc60000, 18), given explicitly in the paper''s own reference
    C implementation (Appendix / Nishimura''s mt19937.c listing). Tempering does not affect the period (2^19937-1,
    since T is regular) but improves the generator''s k-dimensional equidistribution.'
