- id: hight_round
  name: HIGHT round
  kind: full_round
  spec:
    component_flow:
    - component_id: xor
    - component_id: rotation_fixed
    - component_id: add_mod
      params:
        modulus: 256
    constant_injection: subkey
    state_model:
      state_bits: 64
      word_bits: 8
      branches: 8
  notes: 'HIGHT GFN round: XOR, rotation, and 8-bit modular addition with subkeys. The round function''s two rotation-XOR
    sub-functions are F0(x) = (x<<<1) ^ (x<<<2) ^ (x<<<7) and F1(x) = (x<<<3) ^ (x<<<4) ^ (x<<<6) (Hong et al., CHES 2006;
    IETF draft-kisa-hight-00) -- the same general shape as Ascon''s per-word linear layer (a word XORed with two rotated
    copies of itself), just over 8-bit words with three nonzero rotation terms rather than Ascon''s identity-plus-two-rotations
    over 64-bit words. Unlike Keccak/Xoodoo''s theta step, which diffuses via column/lane parity across the whole state,
    F0/F1 are self-contained per-branch functions with no cross-branch mixing of their own -- that mixing comes from
    the surrounding Type-2 GFN structure instead. No citation or shared-authorship link to Ascon/Keccak/Xoodoo is known;
    this is a structural resemblance only, not a claimed influence.'
- id: helix_round
  name: Helix round
  kind: full_round
  spec:
    state_model:
      state_bits: 160
      word_bits: 32
      branches: 5
    component_flow:
    - component_id: add_mod
      params:
        modulus: 4294967296
    - component_id: xor
    - component_id: rotation_fixed
    rotation_constants:
    - 9
    - 10
    - 15
    - 17
    - 20
    - 25
    - 30
    - 11
    - 5
    - 13
    constant_injection: none
  notes: 'One round adds (or, at the two key-mixing/MAC points in each block, XORs) one active state word into
    the next in a helical pattern across the five 32-bit words, then rotates the just-updated word by a fixed
    amount. Twenty such rounds make up one block (Fig. 2 of the Helix and Phelix papers), during which two words
    of key material and one word of plaintext/ciphertext are also injected via XOR/addition at fixed points. The
    Helix and Phelix block functions are identical (Phelix''s own paper, Sect. 2: "the block functions of the two
    ciphers are identical, except for the keystream output function"), so this round definition is shared by both
    families'' primitive-tier entries rather than duplicated.'
