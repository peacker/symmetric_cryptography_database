- id: kalyna_round
  name: Kalyna round
  kind: full_round
  spec:
    component_flow:
    - component_id: xor
    - component_id: add_mod
      params:
        modulus: 18446744073709551616
    - component_id: sbox
    - component_id: word_permutation
    - component_id: field_matrix_mul
      params:
        field_size: 256
        matrix_rows: 8
        matrix_cols: 8
    state_model:
      state_bits: null
      word_bits: 64
      branches: variable (2/4/8 columns)
    constant_injection: round_key_xor_and_mod_add
  notes: 'Kalyna round: odd rounds use XOR round key injection; even rounds use modulo
    2^64 word addition. Each round applies SubBytes (4 random 8-bit S-boxes with max
    DP=2^-5), ShiftRows (byte-level cyclic shift per row), and MixColumns (8×8 MDS
    matrix over GF(2^8) with irreducible polynomial x^8+x^4+x^3+x^2+1, branch number=9).
    Pre- and post-whitening via modulo 2^64 addition.'
- id: mukhomor_round
  name: Mukhomor round
  kind: full_round
  spec:
    component_flow:
    - component_id: add_mod
      params:
        modulus: 4294967296
    - component_id: sbox
    - component_id: field_matrix_mul
      params:
        field_size: 256
        matrix_rows: 4
        matrix_cols: 4
    - component_id: xor
    state_model:
      state_bits: null
      word_bits: 32
      branches: 4
    constant_injection: round_key_mod_add
  notes: 'Mukhomor (extended Lai-Massey) round: the round function M-64 applies modulo
    2^32 key addition, then 3 applications of the SL-transformation (S-box layer using
    Kalyna''s 4 random S-boxes + 4×4 MDS from Rijndael). Outputs are combined via
    an OR-Feistel step (identity round function). Initial and final whitening included.'
- id: ade_round
  name: ADE round
  kind: full_round
  spec:
    component_flow:
    - component_id: xor
    - component_id: sbox
    - component_id: word_permutation
    - component_id: field_matrix_mul
      params:
        field_size: 256
    state_model:
      state_bits: 128
      word_bits: 8
      branches: 16
    constant_injection: subkey
  notes: 'ADE round: all three main operations are key-dependent. ByteSub applies
    S(a) = M·(a·γ)^-1 + β where γ is a byte from the current round key. ShiftRows
    shifts each row by 2-bit pairs from the round key. MixColumn multiplies by a key-dependent
    MDS matrix parameterised by byte s from the round key. Key schedule is identical
    to AES/Rijndael.'
- id: labyrinth_round
  name: Labyrinth round
  kind: full_round
  spec:
    component_flow:
    - component_id: add_mod
    - component_id: sbox
    - component_id: field_matrix_mul
      params:
        field_size: 256
        matrix_rows: 8
        matrix_cols: 8
    state_model:
      state_bits: null
      word_bits: 8
      branches: variable
    constant_injection: round_key_mod_add
  notes: 'Labyrinth 16-round Feistel round function: modular key addition (modulo
    block-half size), S-box layer (same S-box as encryption), 8×8 MDS matrix multiplication
    (similar to Kalyna''s; branch number 9). Initial and final whitening use modular
    key addition, S-boxes, and byte permutation layers. Key schedule is CS-Cipher-inspired.'
- id: rsb_round
  name: RSB round
  kind: other
  spec:
    component_flow:
    - component_id: sbox
    - component_id: xor
  notes: RSB was eliminated early in the competition due to poor encryption speed
    and potentially weak statistical properties. Its full specification was not published
    in open literature; details are limited.
- id: zorro_round
  name: ZORRO partial-SPN round
  kind: full_round
  spec:
    component_flow:
    - component_id: sbox
      params: {input_bits: 8, output_bits: 8}
    - component_id: constant
    - component_id: word_permutation
    - component_id: field_matrix_mul
    - component_id: xor
    state_model: {state_bits: 128, word_bits: 8, branches: 16}
    constant_injection: round_constant_and_round_key_every_four_rounds
  notes: Applies four byte S-boxes to one state row, adds constants, then uses AES-like ShiftRows and MixColumns; key addition occurs every four rounds.
- id: joltik_bc_round
  name: Joltik-BC tweakable SPN round
  kind: full_round
  spec:
    component_flow:
    - component_id: sbox
      params: {input_bits: 4, output_bits: 4}
    - component_id: word_permutation
    - component_id: field_matrix_mul
    - component_id: xor
    state_model: {state_bits: 64, word_bits: 4, branches: 16}
    constant_injection: round_tweakey
  notes: AES-like nibble SPN round with SubCells, ShiftRows, MixNibbles, and a scheduled tweakey addition.
- id: scream_tbc_round
  name: Scream tweakable LS-design round
  kind: full_round
  spec:
    component_flow:
    - component_id: sbox
      params: {input_bits: 8, output_bits: 8}
    - component_id: constant
    - component_id: binary_matrix_mul
    - component_id: xor
    state_model: {state_bits: 128, word_bits: 8, branches: 16}
    constant_injection: round_constant_and_tweakey_every_two_rounds
  notes: Bitsliced TLS-design round; two rounds form a step followed by tweakey addition.
- id: blake3_round
  name: BLAKE3 compression round
  kind: full_round
  spec:
    component_flow:
    - component_id: add_mod
      params: {modulus: 4294967296}
    - component_id: xor
    - component_id: rotation_fixed
    - component_id: word_permutation
    state_model: {state_bits: 512, word_bits: 32, branches: 16}
    constant_injection: message_words
  notes: Eight BLAKE2s-derived G functions arranged as column and diagonal steps, followed by the fixed BLAKE3 message permutation.
- id: warp_round
  name: WARP generalized-Feistel round
  kind: full_round
  spec:
    component_flow:
    - component_id: sbox
      params: {input_bits: 4, output_bits: 4}
    - component_id: xor
    - component_id: word_permutation
    state_model: {state_bits: 128, word_bits: 4, branches: 32}
    constant_injection: alternating_half_key_and_round_constant
  notes: Updates the odd nibble branches from S-box outputs of even branches, then applies the optimized 32-branch permutation.
- id: forro_round
  name: Forró ARX round
  kind: full_round
  spec:
    component_flow:
    - component_id: add_mod
      params: {modulus: 4294967296}
    - component_id: xor
    - component_id: rotation_fixed
    state_model: {state_bits: 512, word_bits: 32, branches: 16}
    round_variation: {rotation_distances: [10, 27, 8]}
  notes: Four pollinating subrounds serialize dependencies between ARX operations to improve diffusion over Salsa and ChaCha.

- id: mimc_round
  name: MiMC round
  kind: full_round
  spec:
    state_model: {state_words: 1}
    component_flow:
    - component_id: xor
    - component_id: constant
    - component_id: power_map_sbox
      params: {exponent: 3}
  notes: 'Each round XORs the (repeated) round key and a round constant into the single field-element state, then applies
    F(x) = x^3 over GF(2^n) with n odd (Albrecht, Grassi, Rechberger, Roy, Tiessen, ASIACRYPT 2016); r = ceil(n/log2(3))
    rounds. The MiMC-p/p variant over a prime field GF(p) uses add_mod in place of xor for the key/constant addition.
    The minimal-multiplicative-complexity round function that founded the arithmetization-oriented cipher family.'

- id: gmimc_round
  name: GMiMC round
  kind: full_round
  spec:
    component_flow:
    - component_id: add_mod
    - component_id: constant
    - component_id: power_map_sbox
      params: {exponent: 3}
    - component_id: add_mod
  notes: A Feistel-style round function applies MiMC's cube-map round function F(x) = (x + k_i + c_i)^3 to one branch,
    then adds the result into one or more of the remaining branches before a cyclic branch rotation -- expanding (GMiMC-erf),
    contracting (GMiMC-crf), or balanced two-branch (Feistel-MiMC), depending on the instance.

- id: hadesmimc_full_round
  name: HadesMiMC/Poseidon full round
  kind: full_round
  spec:
    component_flow:
    - component_id: power_map_sbox
      params: {exponent: 5}
    - component_id: cauchy_matrix
    - component_id: constant
  notes: A full round of the HADES strategy applies the power-map S-box to every word of the state (unlike a partial
    round), followed by a Cauchy MDS matrix multiplication and round-constant addition. HadesMiMC/Poseidon place R_f
    full rounds at the start and end of the permutation.

- id: hadesmimc_partial_round
  name: HadesMiMC/Poseidon partial round
  kind: full_round
  spec:
    component_flow:
    - component_id: power_map_sbox
      params: {exponent: 5}
    - component_id: cauchy_matrix
    - component_id: constant
  notes: A partial round of the HADES strategy applies the power-map S-box to only a single word of the state (the rest
    pass through unchanged), followed by the same Cauchy MDS matrix multiplication and round-constant addition as a full
    round. HadesMiMC/Poseidon place R_p partial rounds in the middle of the permutation, between the leading and trailing
    full rounds, to reduce the total S-box count while resisting algebraic attacks.

- id: vision_round
  name: Vision round
  kind: full_round
  spec:
    component_flow:
    - component_id: inversion_sbox
    - component_id: cauchy_matrix
    - component_id: constant
  notes: An SPN round over GF(2^n) applying the field-inversion S-box x -> x^(-1) (differential uniformity 2 for n odd)
    to every word of the state, followed by a Cauchy MDS matrix and round-constant addition.

- id: rescue_round
  name: Rescue round
  kind: full_round
  spec:
    component_flow:
    - component_id: power_map_sbox
      params: {exponent: 5}
    - component_id: prime_field_matrix_mul
    - component_id: constant
    - component_id: power_map_sbox
    - component_id: prime_field_matrix_mul
    - component_id: constant
  notes: Each Rescue round consists of two half-rounds over GF(p) -- a forward power map x -> x^d followed by an MDS
    matrix and constant addition, then the inverse power map x -> x^(1/d) followed by another MDS matrix and constant
    addition -- so that both a low-degree map and its (typically high-degree) inverse are applied every round, unlike
    MiMC/GMiMC which apply only the forward map.

- id: arion_round
  name: Arion round
  kind: full_round
  spec:
    component_flow:
    - component_id: power_map_sbox
    - component_id: power_map_sbox
      params: {exponent: -1}
    - component_id: prime_field_matrix_mul
    - component_id: add_mod
  notes: The Generalized Triangular Dynamical System (GTDS) round applies a low-degree univariate permutation to all
    but the last branch and a high-degree inverse permutation to the last branch, with feedback from later branches
    into earlier ones (triangular structure), followed by a circulant MDS matrix (an efficiently-evaluable instance of
    prime_field_matrix_mul) and round-key addition.

- id: kreyvium_round
  name: Kreyvium round
  kind: other
  spec:
    component_flow:
    - component_id: and
    - component_id: xor
    - component_id: nlfsr
  notes: Shares Trivium's three-NLFSR update structure (see trivium_round) with two additional 128-bit registers carrying
    the key and IV through the full keystream generation to raise the security level from Trivium's 80 bits to 128 bits.

- id: rasta_round
  name: Rasta round
  kind: full_round
  spec:
    component_flow:
    - component_id: and
    - component_id: xor
    - component_id: binary_matrix_mul
    - component_id: xor
      params: {}
  notes: A full-state quadratic (chi-like) non-linear layer over GF(2) is followed by a freshly-generated random invertible
    affine (binary matrix) layer and round-constant XOR, with a new random matrix drawn deterministically per round from
    the public key/IV -- unlike LowMC, which reuses the same style of random matrices but only in a partial S-box layer.

- id: flip_round
  name: FLIP filter-permutator step
  kind: step
  spec:
    component_flow:
    - component_id: permutation_vector
    - component_id: boolean_filter
  notes: To produce one keystream bit, a fresh public random permutation (drawn from a PRNG seeded by a public IV) reorders
    the secret key bits, and a fixed non-linear Boolean filtering function is evaluated on a subset of the permuted bits
    -- no internal register state is updated between output bits, unlike LFSR/NLFSR-based stream ciphers.

- id: masta_round
  name: Masta round
  kind: full_round
  spec:
    component_flow:
    - component_id: power_map_sbox
      params: {exponent: 3}
    - component_id: prime_field_matrix_mul
    - component_id: add_mod
  notes: The Fp analogue of Rasta's round -- a full cube-map non-linear layer over GF(p) followed by a freshly-generated
    random invertible matrix and round-key/constant addition, incurring quadratically many plaintext-ciphertext multiplications
    per block when evaluated homomorphically due to the random (non-fixed) matrix.

- id: hera_round
  name: HERA round
  kind: full_round
  spec:
    component_flow:
    - component_id: power_map_sbox
      params: {exponent: 3}
    - component_id: prime_field_matrix_mul
    - component_id: mul_mod
    - component_id: add_mod
  notes: A cube-map non-linear layer over GF(p) followed by a fixed (not randomly regenerated) MDS matrix; randomness
    is instead introduced via a component-wise multiplication of the round key with a randomized vector before addition,
    reducing the homomorphic plaintext-ciphertext multiplication cost from quadratic (Masta/Pasta) to linear in the
    block size.

- id: printcipher_round
  name: PRINTcipher round
  kind: full_round
  spec:
    state_model:
      state_bits: 48
    component_flow:
    - component_id: xor
      notes: xor the state with the round-invariant subkey sk1 (identical in every round)
    - component_id: bit_permutation
      notes: 'fixed linear diffusion layer pLayer: bit i moves to position 3*i mod (b-1), and bit (b-1) is fixed'
    - component_id: constant
      notes: xor the round constant RC_i, generated by an affine LFSR-based shift-register counter
    - component_id: bit_permutation
      notes: key-dependent permutation of each S-box's 3 input bits, picked per S-box from one of 4 fixed permutations
        using 2 bits of the second subkey sk2
    - component_id: sbox
      params:
        input_bits: 3
        output_bits: 3
    constant_injection: subkey_and_round_constant
  notes: 'PRINTcipher-48/-96 round, explicitly re-examining PRESENT''s structure for IC-printing: xor with a single
    subkey sk1 reused unchanged in every round (no key schedule/flip-flops needed), PRESENT-style fixed bit permutation,
    xor with an LFSR-counter-derived round constant, a key-dependent 3-bit permutation on each S-box''s inputs (chosen
    from 4 options via sk2 -- the source of the extra 2/3*b key bits beyond the b-bit subkey), then a layer of b/3
    parallel 3-to-3-bit S-boxes. PRINTcipher-48 runs 48 rounds over a 48-bit state; PRINTcipher-96 runs 96 rounds over
    a 96-bit state (see the printcipher_96 instance).'

- id: sea_round
  name: SEA round
  kind: full_round
  spec:
    state_model:
      branches: 2
      notes: Balanced Feistel over n-bit blocks split into L, R halves of n/2 bits each, further divided into n_b = n/(2b)
        b-bit words.
    component_flow:
    - component_id: word_permutation
      notes: 'word rotation R: cyclic left rotation of the left branch by one word position'
    - component_id: xor
      notes: xor with the round subkey K_i
    - component_id: add_mod
      params:
        modulus_bits: b
      notes: modular addition (mod 2^b) of the round subkey, in place of a second xor, for extra non-linearity and
        to prevent structural (complementation-style) distinguishers
    - component_id: sbox
      params:
        input_bits: 3
        output_bits: 3
      notes: recursively-defined 3-bit S-box (S_T = {0,5,6,7,4,3,1,2}), applied in parallel across all n_b/3 word-triples
    - component_id: rotation_fixed
      notes: 'bit rotation r: 1-bit right rotation on the first word of each triple, 1-bit left rotation on the third,
        the middle word unrotated -- provides low-cost intra-word diffusion matched to the bitslice S-box'
    constant_injection: evolved_key_schedule
  notes: 'SEA_{n,b} is a parametric (plaintext/key size n, processor word size b) Feistel cipher. Its round function F
    combines word rotation R, xor and mod-2^b addition of the subkey, the 3-bit S-box S, and bit rotation r; an
    identical F (parameterised by a round counter C(i) instead of a data-derived subkey) drives the key schedule, which
    runs the master key half-forward/half-backward so the round-key sequence is a palindrome (K_0, K_1, ..., K_0),
    letting encryption and decryption reuse the same key-expansion code. The number of rounds n_r is parametric,
    is required to be odd, and is chosen from linear/differential security bounds (>= 3n/4) plus enough rounds for
    full diffusion (n_b + floor(b/2)).'

- id: iceberg_round
  name: ICEBERG round
  kind: full_round
  spec:
    state_model:
      state_bits: 64
    component_flow:
    - component_id: sbox
      params:
        input_bits: 4
        output_bits: 4
      notes: 'non-linear layer gamma = S0 o P8 o S1 o P8 o S0: two layers of 16 parallel 4-bit involutions (S0, S1),
        separated by an 8-bit wire-crossing P8, equivalently viewable as 8 identical 8x8 involutions'
    - component_id: bit_permutation
      notes: p8, the 8-bit wire-crossing sitting between the S0 and S1 layers inside gamma
    - component_id: bit_permutation
      notes: P64, the opening bit permutation of the linear layer epsilon_K, chosen to disturb byte alignment
    - component_id: field_matrix_mul
      params:
        field_size: 16
      notes: diffusion boxes D, parallel multiplication by the 4x4 involutional binary matrix V over GF(2); byte
        branch number 4 (a deliberately sub-optimal, hardware-cheap choice, not MDS)
    - component_id: xor
      notes: affine round-key addition sigma_K
    - component_id: bit_permutation
      notes: P4, a closing 4-bit permutation added purely so the encryption and decryption round functions differ
        only in the key schedule (not in the data path)
    constant_injection: round_key
  notes: 'ICEBERG''s round rho_K = epsilon_K o gamma operates on a 64-bit state and is fully involutional: every
    component (S-boxes, bit permutations, matrix M) is its own inverse, so encryption and decryption use the identical
    round function and differ only in which round key is selected. The standard number of rounds is R = 16.'

- id: iceberg_key_round
  name: ICEBERG key round
  kind: other
  spec:
    component_flow:
    - component_id: shift_variable
      notes: 'shift layer tau_C: cyclic byte shift of the 128-bit key register, left if round constant C=1, right if
        C=0'
    - component_id: bit_permutation
      notes: P128, a 128-bit wire-crossing
    - component_id: sbox
      params:
        input_bits: 4
        output_bits: 4
      notes: substitution layer S prime, parallel application of the s0 4-bit involution only (not s1)
    - component_id: bit_permutation
      notes: second application of P128
    constant_injection: round_constant
  notes: 'Key expansion round beta_C driving K^(i+1) = beta_C(K^i) over the 128-bit key register (tau_C, P128, S'',
    P128). After expansion, a compression function E selects 64 of the 128 bits (odd-indexed key bytes), and a
    keyed selection layer phi_sel (built from 4-bit multiplexer-like selection functions X_sel) derives the 64-bit
    round key RK, with sel=1 for the first half of the rounds and sel=0 for the second half. Choosing the first
    R/2 round constants C=0 (shift left) and the rest C=1 (shift right) makes the round-key sequence a palindrome
    (K^0, K^1, ..., K^7, K^8, K^7, ..., K^0 for R=16), which is what lets ICEBERG derive round keys "on the fly" in
    both encryption and decryption with no round-key storage.'

- id: splight_round
  name: Splight round
  kind: full_round
  spec:
    state_model:
      state_bits: 64
      branches: 2
    component_flow:
    - component_id: sbox
      params:
        input_bits: 4
        output_bits: 4
      notes: first S-layer, 8 parallel copies of the same 4-bit S-box applied to the left branch's 8 nibbles
    - component_id: field_matrix_mul
      params:
        field_size: 16
      notes: linear layer L, the same 4x4 GF(2)-structured nibble-mixing matrix M applied in parallel to each of the
        two 4-nibble halves of the left branch (entries are restricted to identity/zero so mixing needs only nibble
        XORs, no true GF(2^4) multiplication)
    - component_id: xor
      notes: XOR with the 32-bit round key K_{i-1}
    - component_id: sbox
      params:
        input_bits: 4
        output_bits: 4
      notes: second S-layer, completing the "S-P-S" sandwich that doubles the number of active S-boxes per round
        compared to a traditional single-S-layer SP round
    - component_id: xor
      notes: XOR the S-P-S round function's output with the right-branch state
    - component_id: rotation_fixed
      params:
        amount_bits: 8
      notes: 'SHI^2: an 8-bit (2 half-byte) left cyclic shift of the XORed value, which becomes the new left branch;
        the old left branch becomes the new right branch (standard Feistel swap)'
    constant_injection: round_key
  notes: 'Splight''s round function f(X^l,K) = S(L(S(X^l)) xor K) is an S-P-S sandwich (S-box, linear layer, S-box)
    rather than the traditional Feistel SP round, explicitly to double the number of active S-boxes per round. The
    left branch passes through f, is XORed with the right branch, and is left-rotated by 8 bits before becoming the
    next round''s left branch (with the old left branch becoming the next right branch), giving full-state iteration
    every round rather than updating only half the state. 32 rounds total; full diffusion is reached within 6 rounds
    per the paper''s own MILP-based analysis.'

- id: splight_key_round
  name: Splight key round
  kind: other
  spec:
    component_flow:
    - component_id: sbox
      params:
        input_bits: 4
        output_bits: 4
      notes: two parallel 4-bit S-boxes (the same S-box used in encryption) applied to only 2 of the 4 nibbles of
        the first 32-bit key branch k0 -- a partial S-box layer, deliberately different from encryption's full
        8-nibble S-layer
    - component_id: rotation_fixed
      params:
        amount_bits: 4
      notes: 'SHI^1: a 4-bit (1 half-byte) left cyclic shift'
    - component_id: xor
      notes: the shifted/substituted branch is XORed with key branch k1 and with the 5-bit round constant C_{i-1}=i
    constant_injection: round_constant
  notes: 'Splight''s key expansion is a 4-branch generalized-Feistel structure over the 128-bit master key (four
    32-bit branches k0..k3), producing round key K_{i-1}=k0^i each round via k0^i = f''(k0^{i-1}) xor k1^{i-1} xor
    (0^27||C_{i-1}), then rotating branches (k1^i=k2^{i-1}, k2^i=k3^{i-1}, k3^i=k0^{i-1}). The round constant is a
    plain counter (C_{i-1}=i, no LFSR). The paper states this structure was deliberately chosen to maximize the
    structural difference from the encryption round function.'

- id: quad_round
  name: QUAD keystream-generation step
  kind: other
  spec:
    component_flow:
    - component_id: nonlinear_filter
      notes: evaluate the fixed, public multivariate quadratic system S = (Q_1,...,Q_kn) (kn quadratic forms in the
        n GF(q)-element state) on the current state x
    constant_injection: none
  notes: 'Each iteration evaluates S(x) = (Q_1(x),...,Q_kn(x)) on the n-element state x, then splits the kn outputs
    into the first n, S_it(x) = (Q_1(x),...,Q_n(x)), which becomes the next state, and the remaining (k-1)n,
    S_out(x) = (Q_{n+1}(x),...,Q_kn(x)), which are released as keystream (added with the plaintext over GF(q) for
    encryption). S, along with the two systems S0/S1 used only during key/IV setup (see quad_key_iv_setup), are
    fixed, public, and (for the security proof) modeled as randomly chosen; the entire construction has no other
    moving part -- there is no separate permutation, rotation, or key-xor layer, since all of the state update''s
    diffusion and nonlinearity come from evaluating the quadratic system itself. Recommended parameters: q=2 (GF(2)),
    n=160, k=2 (so kn=320 equations, 160 keystream bits per iteration).'
- id: quad_key_iv_setup
  name: QUAD key/IV setup
  kind: other
  spec:
    component_flow:
    - component_id: nonlinear_filter
      notes: for each IV bit, evaluate S0 (if the bit is 0) or S1 (if the bit is 1) -- two further fixed, public,
        n-equation-in-n-unknowns quadratic systems, independent of S -- on the current state
    constant_injection: none
  notes: 'The state x is initialised to the n-element key K (zero/periodically extended if the key is shorter than
    n, e.g. the recommended 80-bit key repeated to fill a 160-bit GF(2) state), then updated once per IV bit by
    applying S0 or S1 according to that bit''s value. After all |IV| bits are consumed, the cipher is clocked a
    further |IV| times using the ordinary keystream-generation step (quad_round) but without releasing any output,
    as an additional security-margin runup before encryption begins.'

- id: ghash_round
  name: GHASH block step
  kind: other
  spec:
    component_flow:
    - component_id: xor
      notes: XOR the running output Y_{i-1} (Y_0 = the all-zero block) with the current 128-bit input block X_i
    - component_id: nonlinear_filter
      notes: 'multiply the XORed value by the hash subkey H in GF(2^128) (Algorithm 1: a 128-step add-and-reduce
        loop using the fixed reduction constant R = 11100001 || 0^120, i.e. modulus u^128+u^7+u^2+u+1), replacing
        the running value with this product'
    constant_injection: none
  notes: 'GHASH_H(X_1 || ... || X_m) computes Y_i = (Y_{i-1} xor X_i) . H for i=1..m and returns Y_m -- a Horner''s-rule
    evaluation of the input blocks as polynomial coefficients at the secret point H, equivalent to X_1.H^m xor
    X_2.H^(m-1) xor ... xor X_m.H. H = CIPH_K(0^128), the block cipher applied to the all-zero block; this is
    GHASH''s only use of the underlying block cipher; it does not otherwise reuse the S-box/round structure of
    whichever block cipher provides its key schedule.'
- id: poly1305_round
  name: Poly1305 block step
  kind: other
  spec:
    component_flow:
    - component_id: xor
      notes: read the next 16-byte message block as a little-endian number and add a single 1 bit above its top
        byte (equivalent to adding 2^128 for a full 16-byte block, or a smaller power of two for a shorter final
        block), then add this value to the running accumulator
    - component_id: mul_mod
      params:
        modulus: 1361129467683753853853498429727072845819
      notes: 'multiply the updated accumulator by the clamped key half r and reduce modulo p = 2^130-5: Acc =
        ((Acc+block)*r) mod p'
    constant_injection: none
  notes: 'poly1305_mac(msg, key) splits the 256-bit one-time key into r (the first 128 bits, clamped: r[3],r[7],
    r[11],r[15] have their top 4 bits forced to 0, r[4],r[8],r[12] have their bottom 2 bits forced to 0) and s (the
    last 128 bits, added at the end, never multiplied); the message is split into 16-byte blocks and folded into the
    accumulator one at a time via Acc = ((Acc+block)*r) mod p, p = 2^130-5; the tag is (Acc+s) mod 2^128 serialized
    little-endian. r and s together must be unpredictable per invocation -- RFC 8439 Sec. 2.6 derives them from a
    ChaCha20 block keyed with the session key and nonce, generalising Bernstein''s original AES-based derivation
    ("There is nothing special about AES here").'

- id: polyval_round
  name: POLYVAL block step
  kind: other
  spec:
    component_flow:
    - component_id: xor
      notes: XOR the running state S_{j-1} (S_0 = 0) with the current 128-bit input block X_j
    - component_id: nonlinear_filter
      notes: 'apply dot(a, H) = a * H * x^-128 to the XORed value in GF(2^128) (standard binary polynomial
        multiplication by the hash subkey H, then by the fixed constant x^-128 = x^127+x^124+x^121+x^114+1, then
        reduced modulo x^128+x^127+x^126+x^121+1), replacing the running state with the result'
    constant_injection: none
  notes: 'POLYVAL(H, X_1,...,X_s) computes S_j = dot(S_{j-1} + X_j, H) for j=1..s and returns S_s -- the same
    Horner''s-rule polynomial-evaluation structure as GHASH (see ghash_round), but over a different field element
    ordering: POLYVAL treats bit/byte strings as little-endian polynomial coefficients (LSB of the first byte =
    coefficient of x^0) where GHASH treats them as big-endian, and folds an extra multiplication by x into the "dot"
    operator rather than plain field multiplication. RFC 8452 states the exact relationship: "POLYVAL(H, X_1, X_2,
    ...) is equal to ByteReverse(GHASH(ByteReverse(H) * x, ByteReverse(X_1), ByteReverse(X_2), ...))" -- this
    reordering exists purely so that software carryless-multiply instructions (e.g. x86 PCLMULQDQ) can be used
    without the extra bit-reflection GHASH needs, not for any security reason.'

- id: umac_nh_round
  name: UMAC NH (L1-HASH) step
  kind: other
  spec:
    component_flow:
    - component_id: add_mod
      params:
        modulus: 4294967296
      notes: pairwise-add each of 4 message-word/key-word pairs (M_i+K_i mod 2^32, M_{i+4}+K_{i+4} mod 2^32, offset
        by 8 words per step)
    - component_id: mul_mod
      params:
        modulus: 18446744073709551616
      notes: multiply each of the 4 pairs' sums together mod 2^64
    - component_id: add_mod
      params:
        modulus: 18446744073709551616
      notes: accumulate all 4 products into the running 64-bit sum Y
    constant_injection: none
  notes: 'NH is UMAC''s namesake nonlinear hash: over a 1024-byte (256-word) message chunk and an equally long key,
    Y = sum_i ((M_i+K_i mod 2^32) * (M_{i+4}+K_{i+4} mod 2^32) mod 2^64), summed mod 2^64 -- a multiply-add tree
    rather than a large-field polynomial evaluation (contrast ghash_round/poly1305_round/polyval_round), trading a
    much larger hash key (reused, unlike Poly1305''s one-time key) for arithmetic that maps directly onto ordinary
    32x32->64-bit integer multiply-add instructions. L1-HASH applies NH to each 1024-byte chunk of the (possibly
    much longer) message, producing one 8-byte output per chunk.'

- id: umac_hash_layers_round
  name: UMAC L2/L3 finishing layers
  kind: other
  spec:
    component_flow:
    - component_id: mul_mod
      notes: 'L2-HASH: Horner-rule polynomial evaluation of L1''s 8-byte-per-chunk outputs, y = (k*y+m) mod p, over
        prime(64) or prime(128) depending on message length -- the same polynomial-hash mechanism as GHASH/Poly1305/
        POLYVAL, just applied one layer up, compressing NH''s outputs rather than the raw message'
    - component_id: mul_mod
      notes: 'L3-HASH: an inner-product hash over prime(36) -- L2''s 16-byte output is split into 2-byte chunks,
        each multiplied by a corresponding 8-byte key word and summed mod prime(36), then masked with a 4-byte
        pseudorandom value to produce the final short hash'
    - component_id: xor
      notes: XOR the L3 output with a pad (a PRF/block-cipher output keyed and indexed by the nonce) to form the tag
    constant_injection: none
  notes: 'UHASH (the composite hash inside UMAC) chains NH (umac_nh_round/L1) into a polynomial layer (L2) and then
    a small inner-product layer (L3) to compress the message down to as few bytes as the desired tag length needs;
    Tag = Pad xor UHASH(message), the Carter-Wegman masking step, with Pad derived from the nonce via a separately
    keyed PRF (a block cipher in the original design). Longer tags run L1/L2/L3 multiple times in parallel with
    independent keys/pads.'

- id: poseidon2_round
  name: Poseidon2 round
  kind: full_round
  spec:
    component_flow:
    - component_id: power_map_sbox
    - component_id: prime_field_matrix_mul
    - component_id: constant
  notes: HADES-strategy full/partial rounds as in HadesMiMC/Poseidon (hadesmimc_full_round/hadesmimc_partial_round),
    but with an extra linear layer applied before the first round and, per Poseidon2's own paper, two different
    linear layers used for external vs. internal rounds at state width t >= 4, and only one round constant added per
    internal round rather than the full-width addition HadesMiMC/Poseidon use. Exact S-box exponent and precise
    external/internal round counts were not confirmed from the sources read for this database.

- id: neptune_round
  name: Neptune round
  kind: full_round
  spec:
    component_flow:
    - component_id: power_map_sbox
    - component_id: prime_field_matrix_mul
    - component_id: constant
  notes: HADES-strategy full/partial rounds as in HadesMiMC/Poseidon, with a non-linear layer redesigned around the
    paper's own invertible-quadratic-map analysis to reduce multiplications relative to Poseidon. Exact state widths
    and round counts were not confirmed from the sources read for this database.

- id: grendel_round
  name: Grendel round
  kind: full_round
  spec:
    component_flow:
    - component_id: sbox
      notes: 'S(x) = x^d * chi_p(x), chi_p the Legendre/quadratic-character symbol of F_p, applied to every word of
        the state (full S-box layer)'
    - component_id: field_matrix_mul
    - component_id: constant
  notes: A SHARK-strategy-style SPN round -- full S-box layer (the Legendre-symbol S-box S(x) = x^d * chi_p(x)) then
    a linear diffusion layer and round-constant addition. Exact field size, state width, and round count were not
    confirmed from the sources read for this database.

- id: griffin_round
  name: GRIFFIN round
  kind: full_round
  spec:
    component_flow:
    - component_id: power_map_sbox
      notes: 'The "Horst" branches: (x,y) -> (y*G(x)+F(x), x), a Feistel-style update extended with a multiplication'
    - component_id: power_map_sbox
      notes: 'Remaining "Fluid-SPN" branches use invertible low-degree power maps; per the paper, for state width t
        the non-linear layer''s output is described by 2 equations of degree d and t-2 equations of degree 3'
    - component_id: field_matrix_mul
    - component_id: constant
  notes: Combines a Feistel-style "Horst" update (2 of the t branches) with an SPN-style "Fluid-SPN" non-linear
    layer (remaining branches) over a prime field, followed by a linear layer and constant addition. Exact
    state-width instances and round counts were not confirmed from the sources read for this database.

- id: anemoi_round
  name: ANEMOI round
  kind: full_round
  spec:
    component_flow:
    - component_id: sbox
      notes: 'The "Flystel" S-box, a butterfly-structure construction, over GF(p) or GF(2^n)'
    - component_id: field_matrix_mul
    - component_id: constant
  notes: A classical SPN round using the novel "Flystel" S-box in place of a power-map or inversion S-box. Exact
    state-width options and round counts were not confirmed from the sources read for this database.

- id: reinforced_concrete_round
  name: Reinforced Concrete round (Bricks-Concrete-Bars)
  kind: full_round
  spec:
    component_flow:
    - component_id: power_map_sbox
      notes: 'Bricks: a low-degree power map x -> x^d, d the smallest value with gcd(p-1,d)=1'
    - component_id: field_matrix_mul
      notes: 'Concrete: multiply the state by a 3x3 MDS matrix and add round constants'
    - component_id: lookup_table
      notes: 'Bars: decomposes each field element into several smaller-domain lookup transformations and recomposes
        the result -- the round''s actual lookup-table nonlinear layer'
    - component_id: constant
  notes: A sponge over F_p^3 (a "modified 7-round SP network" per secondary documentation) whose three named
    components -- Bricks, Concrete, Bars -- were reused verbatim by name in Monolith and discussed structurally by
    Skyscraper. Exact round count/ordering beyond "7 rounds" was not independently confirmed against the primary
    paper text in this database (paper PDF unobtainable).

- id: tip5_round
  name: Tip5/Tip4/Tip4' round
  kind: full_round
  spec:
    state_model: {field: 'p = 2^64 - 2^32 + 1 (Goldilocks)'}
    component_flow:
    - component_id: lookup_table
      notes: 'Split-and-lookup S-box S on the first state elements (part of the rate): decomposes a field element
        into 8-bit-ish chunks, applies a lookup table L: F_(2^8+1) -> F_(2^8+1), x -> (x+1)^3 - 1, and recomposes'
    - component_id: power_map_sbox
      params: {exponent: 7}
      notes: Power-map S-box T applied to the remaining state elements
    - component_id: field_matrix_mul
      notes: Circulant MDS matrix, structured for O(k log k) evaluation
    - component_id: constant
  notes: 5 rounds for all three variants (Tip5, Tip4, Tip4'), inspired by the SHARK strategy of interleaving full
    S-box layers with MDS layers, and by Reinforced Concrete's lookup approach. Tip5 uses state width 16/rate 10/
    capacity 6 (160-bit security); Tip4 uses state width 16/rate 12/capacity 4 (128-bit); Tip4' uses state width
    12/rate 8/capacity 4 (128-bit, 8 power maps per round instead of 12).

- id: monolith_round
  name: Monolith round (Bars-Bricks-Concrete)
  kind: full_round
  spec:
    component_flow:
    - component_id: lookup_table
      notes: 'Bars: the "Kintsugi" nonlinear layer -- splits a field element into smaller bit arrays and applies
        constant-time-friendly S-boxes using Daemen''s chi function, then recomposes'
    - component_id: power_map_sbox
      params: {exponent: 2}
      notes: 'Bricks: a Feistel Type-3 construction with square (x -> x^2) mappings, degree-2 constraints per element'
    - component_id: field_matrix_mul
      notes: 'Concrete: multiplication by a circulant MDS matrix'
    - component_id: constant
  notes: 'Round R_i(.) = c^(i) + Concrete(Bricks(Bars(.))), uniformly 6 rounds for every parameter set. Two field
    families: Goldilocks p = 2^64-2^32+1 (state width 8 or 12) and Mersenne p = 2^31-1 (state width 16 or 24).
    Explicitly adopts Reinforced Concrete''s naming convention while redesigning Bars for constant-time-friendly
    native implementation.'

- id: skyscraper_square_round
  name: Skyscraper "Square" round
  kind: half_round
  spec:
    component_flow:
    - component_id: power_map_sbox
      params: {exponent: 2}
      notes: '(xL,xR) -> (xR + (xL)^2/sigma + gamma_i, xL), a degree-2 Feistel round using Montgomery multiplication
        (sigma a Montgomery constant) instead of plain squaring'
    - component_id: constant
  notes: One of two alternating Feistel round types in Skyscraper (see skyscraper_bars_round); low-degree, cheap in
    the clear.

- id: skyscraper_bars_round
  name: Skyscraper "Bars" round
  kind: half_round
  spec:
    component_flow:
    - component_id: lookup_table
      notes: "(xL,xR) -> (xR + B'(xL) + gamma_i, xL); B' decomposes the field element into 8-bit chunks, applies an
        8-bit S-box to each, rotates, and recomposes -- unlike Reinforced Concrete/Monolith/Tip5, this Bars function
        is NOT required to be invertible, since the surrounding Feistel network supplies invertibility"
    - component_id: constant
  notes: The other of two alternating Feistel round types in Skyscraper (see skyscraper_square_round); 10 total
    Feistel rounds for p >= 2^248, kappa >= 124-bit security, n in {1,2,3} (state F_p^(2n)); for t=2n>2 the squaring
    round is replaced by a Monolith-like Type-3-Feistel-plus-MDS-matrix combination. Chosen over an SPN specifically
    to allow non-invertible nonlinear mappings.

- id: polocolo_round
  name: Polocolo round
  kind: full_round
  spec:
    component_flow:
    - component_id: lookup_table
      notes: 'S(x) = x^(-1) * T[(x/p)_m]: the field inverse of x multiplied by a small lookup table T indexed by the
        m-th-power-residue class of x (the m-th power residue takes m+1 distinct values)'
    - component_id: field_matrix_mul
      notes: A new MDS matrix proposed specifically for Polocolo's linear layer
    - component_id: constant
  notes: Targets the PlonKup lookup argument. Exact field/prime and round count were not confirmed from the sources
    read for this database; state widths t=3 and t=8 both appear in the paper's own efficiency comparisons.

- id: vsh_compression_step
  name: VSH compression step
  kind: step
  spec:
    state_model:
      modulus_bits_options:
      - 1024
      - 2048
    component_flow:
    - component_id: mul_mod
      notes: 'x_{j+1} = x_j^2 * prod_{i=1}^k p_i^{m_{j*k+i}} mod n: square the accumulator x_j, then multiply in
        one factor of the i-th prime p_i (p_1=2, p_2=3, ...) for each set bit of the current k-bit message chunk --
        both the squaring and the per-prime multiplications are plain modular multiplications.'
  notes: 'k, the block length processed per step, is the largest integer such that the product of the first k
    primes is < n. The final k-bit "block" is not message data: it encodes the message''s own bit-length in binary,
    each bit selecting whether the corresponding prime is included -- appended (not prepended, per an earlier ePrint
    revision the paper explicitly disavows) to prevent a padding-collision issue. Whether n is a hard-to-factor RSA-type
    composite (basic VSH, reducing to VSSR/factoring) or a safe prime p (VSH-DL, reducing to a discrete-log-flavored
    problem the paper calls VSDL) does not change this step''s shape, only the modulus and the hardness assumption.

    '
- id: sinsemilla_round
  name: Sinsemilla incremental step
  kind: step
  spec:
    state_model: {group: Pallas curve, window_bits: 10}
    component_flow:
    - component_id: lookup_table
      notes: 'S(j) = GroupHash_P("z.cash:SinsemillaS", I2LEOSP_32(j)), a per-window base drawn from a table of
        2^10 = 1024 precomputed generators, selected by the 10-bit message piece'
    - component_id: permutation
      notes: 'Incomplete elliptic-curve point addition: Acc <- (Acc + S(m_i)) + Acc'
  notes: Windowed incremental hashing over the Pallas curve; message split into 10-bit pieces, accumulator seeded
    by Acc = Q(D) = GroupHash_P("z.cash:SinsemillaQ", D). Collision-resistant only for fixed-length input (per
    personalization domain D), reduced to the Discrete Logarithm Problem; not designed for preimage resistance.

- id: pedersen_hash_zcash_step
  name: Zcash Pedersen hash incremental step
  kind: step
  spec:
    state_model: {group: Jubjub curve, window_bits: 3}
    component_flow:
    - component_id: lookup_table
      notes: 'enc(m_j) = (1-2*s2)*(1+s0+2*s1) encodes each 3-bit chunk s0,s1,s2 of the message as a scalar'
    - component_id: permutation
      notes: 'PedersenHashToPoint(D,M) := sum over windows i of [<M_i>] I(D,i), I(D,i) := FindGroupHash(D,i-1) a
        distinct generator per 3*c-bit segment -- a fixed-base-per-segment scalar multiplication and sum'
  notes: Windowed scalar-multiplication-based hashing over the Jubjub curve, used for Sapling note commitments and
    the Sapling Merkle tree; collision-resistant only for fixed-length input, reduced to the Discrete Logarithm
    Problem; not designed for preimage resistance. Superseded by Sinsemilla in Orchard.

- id: pasta_pi_round
  name: Pasta-pi round
  kind: full_round
  spec:
    component_flow:
    - component_id: field_matrix_mul
      notes: 'Affine layer A_j: block matrix [[2I,I],[I,2I]] composed with per-round pseudorandom invertible matrices
        M_j,L, M_j,R and round constants, all generated from a SHAKE128 XOF seeded by nonce and block counter'
    - component_id: sbox
      notes: "S_feistel(x) = S'(xL) || S'(xR); S' over F_p^t is defined word-by-word as S'(y)_0 = y_0, S'(y)_l =
        y_l + (y_(l-1))^2 for l>0 -- applied in all rounds but the last"
  notes: "Pasta-pi(x,N,i) = A_r . S_cube . A_(r-1) . S_feistel . ... . A_1 . S_feistel . A_0 (x); the final round's
    S-box is S_cube(x) = x0^3 || x1^3 || ... instead of S_feistel. An SPN-like structure over F_p (full affine layer
    every round, not a literal two-branch Feistel network despite S_feistel's name). Pasta-3 (3 rounds, 256 key
    words, 128 plain/cipher words) and Pasta-4 (4 rounds, 64 key words, 32 plain/cipher words) both target 128-bit
    security; the Pasta family of stream ciphers truncates Pasta-pi's output under a nonce and block counter to
    produce keystream."

- id: armadillo_round
  name: ARMADILLO transposition step
  kind: step
  spec:
    state_model: {register_bits: '2k, k = c+m (chaining bits c, message-block bits m)'}
    component_flow:
    - component_id: bit_permutation
      notes: 'A data-dependent choice, at each of J=k steps, between two fixed base bit permutations sigma_0/sigma_1,
        selected bit-by-bit from X_inter = C||U -- the sole source of nonlinearity, with no algebraic S-box at all'
    - component_id: xor
      notes: 'Output V_c||V_t := S xor X_inter, S the rightmost k bits after all J transposition steps'
  notes: Related to the Zemor-Tillich group-based hash construction (a semi-group homomorphism from {0,1}* to a
    permutation group). Used, per the paper's own Section 2, for three applications -- a FIL-MAC, a hash/signature
    scheme (via strengthened Merkle-Damgard chaining on V_c), and a PRNG/PRF/stream cipher -- rather than a single
    fixed primitive type.

- id: poseidon2b_round
  name: Poseidon(2)b round
  kind: full_round
  spec:
    state_model: {field: binary extension field GF(2^n)}
  notes: A binary-extension-field analogue of the Poseidon2/Poseidon round structure (see poseidon2_round), designed
    to inherit the circuit-friendly properties of the prime-field version for use with binary-field proving systems
    such as Binius. Exact S-box and round-count parameters were not confirmed from the sources read for this
    database (would require a full read of the downloaded PDF beyond confirming it is a valid file).

- id: ciminion_round
  name: Ciminion round
  kind: other
  spec: {}
  notes: Nonlinearity comes from a Toffoli-gate-based mechanism (not a small table-lookup or power-map S-box) over
    large binary or prime fields, combined with a lightweight linear layer -- a Farfalle-like construction. Whether
    this is evaluated as one wide nonlinear map or several narrower gates per round was not confirmed from the
    sources read for this database; no component-level breakdown is asserted here pending a direct read of the
    primary paper (unobtainable as a PDF in this session).

- id: hydra_round
  name: Hydra round
  kind: other
  spec: {}
  notes: Combines the HADES strategy (alternating full/partial S-box rounds, as in hadesmimc_full_round/
    hadesmimc_partial_round) with generalized versions of the Lai-Massey scheme, inside the "Megafono" keyed
    extendable-PRF framework. Exact S-box form, state width, and round counts were not confirmed from the sources
    read for this database.

- id: cryptodarkmatter_round
  name: CryptoDarkMatter round
  kind: other
  spec:
    component_flow:
    - component_id: linear_transform
      notes: A secret mod-2 linear map applied to the input
    - component_id: linear_transform
      notes: A public mod-3 linear map applied to the mod-2 map's output -- together implementable as a depth-2
        ACC0 circuit
  notes: No small S-box or table lookup at all -- nonlinearity comes entirely from mixing linear maps defined over
    different small moduli (mod 2 then mod 3), described by the paper as a "deterministic variant of Learning Parity
    with Noise." A secondary depth-3 strong-PRF variant using a similar mod-mixing approach also exists; not
    separately modeled here.

- id: rain_round
  name: Rain round
  kind: full_round
  spec:
    component_flow:
    - component_id: xor
      notes: Add round key and round constant before the S-box
    - component_id: inversion_sbox
      notes: S(x) = x^(2^n-2) = x^(-1) for x != 0, else 0 -- field inversion in F_(2^n)
    - component_id: field_matrix_mul
      notes: Multiplication by a randomly chosen, deliberately unstructured/dense n x n matrix over F_2 (chosen for
        diffusion, explicitly contrasted with the structured affine layers of MiMC/Jarvis/Vision)
  notes: 'Confirmed directly from the paper (Dobraunig, Kales, Rechberger, Schofnegger, Zaverucha, "Shorter
    Signatures Based on Tailor-Made Minimalist Symmetric-Key Crypto," 2022): R_i(x) = M_i(S(x+k+c^(i))) for i<r; the
    last round instead computes R_r(x) = k+S(x+k+c^(r)). Rain3/Rain4 (3 or 4 rounds) over F_2^128/192/256.'

- id: aim_round
  name: AIM round
  kind: other
  spec: {}
  notes: The paper's own text positions AIM against "recent MPCitH-friendly ciphers ... designed using simple
    algebraic S-boxes operating on a large field," proposing AIM instead for higher resistance to algebraic attacks;
    secondary reporting (not independently confirmed against the primary text) describes AIM's S-boxes as Mersenne-exponent
    power maps (x^(2^e-1)). Flagged as unverified pending a direct read; no component_flow is asserted from this
    database without stronger confirmation.

- id: dasta_round
  name: Dasta block-generation step
  kind: other
  spec:
    component_flow:
    - component_id: field_matrix_mul
      notes: Fixed linear transformation L, derived from a binary BCH-based [2n,n,d] code (guarantees a branch number),
        reused unchanged across all rounds
    - component_id: bit_permutation
      notes: A per-round, counter-selected bit permutation P_{j,i} drawn from a small parameterized family (powers of
        1-2 fixed base permutations), replacing Rasta's freshly-random matrix
    - component_id: and
      notes: chi, the same full-state quadratic non-linear layer as Rasta
  notes: 'B_i(k) = L.P_{r,i}.chi. ... .chi.L.P_{0,i}(k) + k -- a Davies-Meyer-style feed-forward over a keyed
    permutation, captioned only as "Generation of i-th block of Dasta" (Figure 2 of Hebborn and Leander, "Dasta --
    Alternative Linear Layer for Rasta," ToSC 2020(3)); no separate name is given to this fixed-length building
    block. No round constants are used.'

- id: chaghri_round
  name: Chaghri step
  kind: other
  spec:
    component_flow:
    - component_id: sbox
      notes: 'pi = B o G: G(x) = x^(2^32+1), a cheap "Gold exponent" power map (1 Frobenius automorphism + 1
        multiplication under BGV); B a sparse F_2-linearized affine polynomial chosen so the Dickson matrix is
        non-singular (a permutation)'
    - component_id: field_matrix_mul
      notes: 3x3 MDS matrix over F_(2^63)
    - component_id: xor
      notes: Subkey injection
  notes: 8 rounds, each made of 2 identical steps (16 step-applications total), over a 3-word F_(2^63) state
    (189-bit block); N=1.5*max(security_level,5) per the Marvellous-strategy safety formula. Key schedule iterates
    the decryption-direction round function on the master key with round constants substituted for subkeys.

- id: rubato_round
  name: Rubato round
  kind: full_round
  spec:
    component_flow:
    - component_id: xor
      notes: ARK -- add round key, component-wise multiplied by a fresh random nonzero value per round (HERA-style
        randomized key schedule)
    - component_id: sbox
      notes: 'Feistel(x) = (x1, x2+x1^2, x3+x2^2, ..., xn+x_(n-1)^2), a quadratic Feistel non-linear layer reused
        directly from Pasta''s S_feistel'
    - component_id: field_matrix_mul
      notes: MixRows/MixColumns, v x v circulant MDS matrices (v in {4,6,8} depending on parameter set), HERA-style
  notes: 'Final round additionally truncates (Tr_(n,l), drops n-l words) then applies AGN ("Adding Gaussian Noise"):
    samples e ~ D_(alpha*q) and outputs x_i+e_i for each retained word -- the sole element making Rubato "noisy"
    rather than deterministic. Reuses HERA''s linear-layer/key-schedule style and Pasta''s Feistel S-box.'

- id: rescue_xlix_round
  name: Rescue-XLIX round
  kind: full_round
  spec:
    component_flow:
    - component_id: power_map_sbox
      notes: Forward power map x -> x^alpha (order flipped relative to original Rescue, where the inverse map came
        first)
    - component_id: prime_field_matrix_mul
    - component_id: constant
    - component_id: power_map_sbox
      notes: Inverse power map x -> x^(1/alpha)
    - component_id: prime_field_matrix_mul
    - component_id: constant
  notes: Same alternating forward/inverse-power-map structure as Rescue (rescue_round), reordered (inverse-then-forward
    in original Rescue, forward-then-inverse here) so the STARK "folding" arithmetization technique applies uniformly
    across the whole permutation. Round constants generated directly by expanding a seed string
    "Rescue-XLIX(%i,%i,%i,%i)" via SHAKE-256, rather than via a block-cipher-style key schedule. Round count set via
    a Grobner-basis-attack-complexity formula times 1.5 (for a reduced 50% security margin vs. original Rescue's
    100%), floored at 5 rounds.

- id: kravatte_round
  name: Kravatte round (Keccak-p[1600,nr=6])
  kind: other
  spec: {}
  notes: Kravatte reuses the standard Keccak-p[1600] round function (see the keccak family's own round definition),
    reduced to 6 of the full 24 rounds; no separate round definition is introduced here to avoid duplicating that
    definition -- see the keccak primitive family for the theta/rho/pi/chi/iota round.

- id: farasha_round
  name: Farasha round
  kind: other
  spec: {}
  notes: Analyzed in the random-permutation model; no single fixed concrete permutation is proposed (a concrete
    instance "Farasha-wLFSR" uses a word-based LFSR for its AXU rolling function, but the underlying permutations
    P/P' remain generic). No component_flow is asserted here since no fixed round structure exists to record.

- id: filip_round
  name: FiLIP filter evaluation
  kind: other
  spec:
    component_flow:
    - component_id: permutation_vector
      notes: A larger key register (N >= 2n) than FLIP's, permuted per output bit by the same IV-seeded-PRNG
        mechanism, plus an XOR whitening step before the filter (both new vs. FLIP)
    - component_id: boolean_filter
      notes: A direct-sum-of-monomials (DSM) function, or an XOR-threshold/XOR-majority function -- purely algebraic,
        no lookup-table S-box, same as FLIP
  notes: 'The Improved Filter Permutator (IFP) paradigm, an explicit generalization of FLIP''s filter permutator: "we
    first introduce improved filter permutators that allow better security analyses, instances and implementations
    than the previously proposed FLIP family of stream ciphers." Over F_2.'

- id: elisabeth_round
  name: Elisabeth filter evaluation
  kind: other
  spec:
    component_flow:
    - component_id: permutation_vector
      notes: Group Filter Permutator (GFP) generator over G=Z_16 -- XOR replaced by addition mod 16
    - component_id: sbox
      notes: 'The 5-to-1 inner function g: G^5 -> G, built from two layers of eight fixed Z_16->Z_16 4-bit lookup
        tables ("NLUTs"), then adding the 5th input word for balance -- a genuine fixed-size lookup-table component,
        unlike FLIP/FiLIP''s purely algebraic filters'
  notes: 'f(x_1,...,x_60) = direct sum (mod 16) of 12 copies of g. "The XOR is replaced by the addition of G and the
    Boolean function by a function from G^n to G." Motivated by TFHE''s native 4-bit negacyclic-LUT bootstrapping.
    Later shown vulnerable to a linearization attack (Gilbert et al., ASIACRYPT 2023) exploiting the small monomial
    count the NLUT+mod-16-addition structure creates; patched by Margrethe.'

- id: margrethe_round
  name: Margrethe filter evaluation
  kind: other
  spec:
    component_flow:
    - component_id: permutation_vector
      notes: Mixed Filter Permutator (MFP) generator -- key register over G1=F_2 (individual bits), filter output
        over G2=Z_16, unlike Elisabeth's single-group (Z_16-keyed) design
    - component_id: sbox
      notes: 'g: F_2^18 -> Z_16, a genuine fixed-size 18-to-4-bit lookup table (not negacyclicity-constrained, unlike
        Elisabeth''s NLUTs)'
  notes: 'f = sum (mod 16) of 14 copies of [g(22-bit chunk) + (4 remaining key bits read as a nibble)]. "The MFP
    paradigm differs from the GFP by the use of two (potentially) different groups." Introduced specifically to fix
    Elisabeth-4''s linearization weakness by mixing key material at the bit level rather than the Z_16-element level.'

- id: diversify_hash_step
  name: DiversifyHash / GroupHash step
  kind: other
  spec:
    component_flow:
    - component_id: sbox
      notes: BLAKE2s-256 keyed by a domain-separator/personalization string, applied to the diversifier input to
        produce a field element
    - component_id: permutation
      notes: Decompress-or-reject the field element to a curve point (try-and-increment-style), then clear the
        cofactor by scalar multiplication -- a hash-to-curve map, not a scalar-multiplication sum over the input
  notes: 'DiversifyHashSapling maps into the Jubjub curve, DiversifyHashOrchard into the Pallas curve; both are direct
    applications of the underlying GroupHash primitive. Used to derive per-address generators g_d for diversified
    payment addresses (pk_d = [ivk].g_d). Distinct mechanism from Sinsemilla/PedersenHash''s windowed
    scalar-multiplication-sum: this hashes the diversifier directly to a curve point.'

- id: pholkos_round
  name: Pholkos step (paired AES rounds + TWEAKEY-style tweakey addition)
  kind: full_round
  spec:
    state_model:
      word_bits: 128
      word_count_parameterized: true
    component_flow:
    - component_id: sbox
      params:
        input_bits: 8
        output_bits: 8
    - component_id: word_permutation
      params:
        word_size_bits: 8
    - component_id: field_matrix_mul
      params:
        field_size: 256
    - component_id: xor
    - component_id: word_permutation
      params:
        word_size_bits: 128
    constant_injection: tweakey_xor
  notes: 'A Pholkos step chains two unmodified AES rounds (SubBytes, ShiftRows, MixColumns, AddRoundKey) applied in
    parallel to each 128-bit substate (2 substates for Pholkos-256, 4 for Pholkos-512), then applies a fixed byte
    permutation across substates for full-state diffusion. Round tweakeys are derived from the key and tweak via a
    TWEAKEY-style schedule: parallel word-permutation-plus-update key/tweak lanes (tau for the tweak, kappa for the
    key) combined by XOR (gamma) each round.'

- id: vistrutah_round
  name: Vistrutah step (two AES rounds per slice + cell-shuffle mixing layer)
  kind: full_round
  spec:
    state_model:
      word_bits: 128
      word_count_parameterized: true
    component_flow:
    - component_id: sbox
      params:
        input_bits: 8
        output_bits: 8
    - component_id: word_permutation
      params:
        word_size_bits: 8
    - component_id: field_matrix_mul
      params:
        field_size: 256
    - component_id: xor
    - component_id: word_permutation
      params:
        word_size_bits: 8
    constant_injection: round_constant
  notes: 'Vistrutah''s "2R" step chains two unmodified AES rounds (SubBytes, ShiftRows, MixColumns, AddRoundKey)
    applied in parallel to each 128-bit slice of the state (2 slices for Vistrutah-256, 4 for Vistrutah-512), then
    applies a state-wide cell-shuffle mixing layer -- omitted only after the cipher''s last step. The 256-bit
    version reuses ASURA''s byte shuffle verbatim; the 512-bit version uses a dedicated tube-based permutation.
    Round keys alternate a fixed value with one updated via fixed per-slice permutations (rho0/rho1) each step, an
    "inline" schedule computed on the fly rather than precomputed and stored.'

- id: espresso_round
  name: Espresso clock step
  kind: full_round
  spec:
    state_model:
      state_bits: 256
    component_flow:
    - component_id: nlfsr
      params:
        length: 256
    - component_id: and
    - component_id: xor
    - component_id: boolean_filter
      params:
        inputs: 20
        degree: 6
    constant_injection: key_iv_mixing
  notes: 'Espresso state-update abstraction: a single 256-bit non-linear feedback shift register (NLFSR) in the
    Galois configuration (feedback applied at multiple stages, each combining AND/XOR nonlinear terms, rather than
    only at the last stage as in a Fibonacci-configuration NLFSR), read each clock by a separate 20-variable,
    algebraic-degree-6 non-linear Boolean filter function to produce 1 keystream bit. Unlike Grain/Trivium''s
    paired LFSR+NLFSR structure, Espresso uses a single register whose Galois-configuration feedback is
    constructed (per Dubrova''s prior transformation methodology) to be equivalent to a maximum-length LFSR,
    guaranteeing period 2^256-1.'
- id: mambo_round
  name: Mambo Round
  kind: full_round
  spec:
    state_model:
      layout: 4x4_words
      word_bits: 32
      state_bits: 512
    component_flow:
    - component_id: and
    - component_id: or
    - component_id: xor
    - component_id: rotation_fixed
    constant_injection: round_counter
  notes: 'The Mambo round applies the nonlinear bijection Q(x0,x1,x2,x3) -- built from AND, OR, NAND, NOR, XOR,
    and fixed rotations -- to each row and then each column of the 4x4 32-bit-word state, followed by a
    checkerboard-pattern key/round-counter XOR injection.

    '
- id: stribob_pi_round
  name: STRIBOBr2 pi Round
  kind: full_round
  spec: {}
  notes: 'Same SubBytes/ShiftColumns/MixRows layer structure as the Whirlpool cipher round (renamed S/P/L),
    reused unkeyed as a sponge permutation.

    '
- id: cbeam_mx_round
  name: CBEAM mx Round
  kind: full_round
  spec: {}
- id: pi_function_round
  name: pi-Cipher pi Function Round
  kind: full_round
  spec: {}
- id: wheesht_fullround
  name: Wheesht FullRound
  kind: full_round
  spec: {}
- id: panda_round_func
  name: PANDA RoundFunc
  kind: full_round
  spec: {}
- id: proest_round
  name: Prøst Round
  kind: full_round
  spec: {}
  notes: 'AddConstants-ShiftPlanes-MixSlices-SubRows; borrows Keccak''s row/column/lane terminology but is a
    distinct S-box-based SPN round, not a parametrization of Keccak''s theta/rho/pi/chi/iota.

    '
- id: artemia_round
  name: Artemia Round
  kind: full_round
  spec: {}
  notes: 'A nested SBox (the AES S-box) plus recursive-MDS diffusion layer (via XOR and shift, not field
    multiplication), in the style of PHOTON/LED''s serial diffusion -- not a parametrization of Keccak''s round.

    '
- id: minalpher_p_round
  name: Minalpher-P Round
  kind: full_round
  spec: {}
  notes: 'A 4-bit-nibble SPN round (S-box layer, binary-matrix mixing, word permutation, round-constant XOR);
    unrelated to Keccak''s round despite both being permutations.

    '
- id: xoofff_round
  name: Xoofff round (Xoodoo[6])
  kind: other
  spec: {}
  notes: Xoofff reuses the standard Xoodoo round function (see the xoodoo family's own round definition,
    xoodoo_permutation_round), reduced to 6 of Xoodoo's rounds; no separate round definition is introduced here
    to avoid duplicating that definition.

