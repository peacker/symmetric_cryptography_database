- id: turtle_round
  name: Turtle recursive Feistel round
  kind: full_round
  spec:
    component_flow:
    - component_id: sbox
      params:
        input_bits: 8
        output_bits: 8
        note: 'models one keyed "random function" f_i on a w-bit word (w=8 for the canonical Turtle 8/64 instance);
          at the base case f_i is a literal keyed lookup table, not an algebraic S-box, but sbox is the closest
          existing component for a keyed word-to-word substitution table'
    - component_id: xor
    constant_injection: none
    state_model:
      state_bits: 64
      branch_bits: 32
      note: 'figures for the canonical Turtle 8/64 (w=8, n=64) instance; block size is recursively extensible to any
        2^k * w bits'
  notes: 'Turtle(X): if length(X) = w, return the next keyed random function f_n(X) (base case). Otherwise split X
    into equal L/R halves and apply a standard 4-round balanced-Feistel network whose four round functions are each
    a recursive call to Turtle on the half-size block: "R = R XOR Turtle(L); L = L XOR Turtle(R); R = R XOR
    Turtle(L); L = L XOR Turtle(R); return R|L" (Blaze 1996, Section 3). This is the recursive/nested-Feistel
    structure the paper itself compares to MISTY (see misty1_round): "Turtle''s recursive structure provides a
    natural mechanism for extending its block length to whatever is required. (The recent MISTY cipher, while not
    based on RFNs or a variable block length, also employs a recursive structure)."'
