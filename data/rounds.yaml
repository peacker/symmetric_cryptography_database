- id: newdes_round_forward
  name: NewDES forward half-round
  kind: half_round
  spec:
    state_model:
      state_bits: 64
      word_bits: 8
    component_flow:
    - component_id: xor
      notes: byte i (0-3) XORed with a subkey byte
    - component_id: sbox
      params:
        input_bits: 8
        output_bits: 8
    - component_id: xor
      notes: S-box output XORed into byte i+4
    constant_injection: subkey
  notes: 'Confirmed directly against a reference implementation (funet.fi rpem/newdes.c; primary source Robert
    Scott, "Wide Open Encryption Design Offers Flexible Implementations," Cryptologia 9(1), Jan 1985, pp. 75-90 --
    not available locally). Updates the upper 4 bytes (B4..B7) of the 8-byte state from the lower 4 (B0..B3):
    B4^=S(B0^k), B5^=S(B1^k), B6^=S(B2^k), B7^=S(B3^k), each against its own subkey byte k, using a single shared
    256-byte S-box ("rotor") for every lookup -- no bit-level permutation anywhere in NewDES, only byte-level XOR
    and substitution. Paired with newdes_round_backward (see its notes for the alternation and the 17-round count,
    and for the special case on byte B2).'
- id: newdes_round_backward
  name: NewDES backward half-round
  kind: half_round
  spec:
    state_model:
      state_bits: 64
      word_bits: 8
    component_flow:
    - component_id: xor
      notes: byte i (4-7, or B4^B5 for the one exception -- see notes) XORed with a subkey byte (except that exception)
    - component_id: sbox
      params:
        input_bits: 8
        output_bits: 8
    - component_id: xor
      notes: S-box output XORed into one of bytes B0-B3
    constant_injection: subkey
  notes: 'The other half of one NewDES round pair (see newdes_round_forward). Updates the lower 4 bytes from the
    upper 4: B1^=S(B4^k), B3^=S(B6^k), B0^=S(B7^k) each against a subkey byte, but B2^=S(B4^B5) is the one
    exception -- it combines two upper bytes directly with no subkey material, confirmed directly from the
    reference implementation, not a simplification (so this half-round consumes 3 subkey bytes, not 4). NewDES
    applies newdes_round_forward and newdes_round_backward alternately, 8 times each (16 half-rounds total,
    consuming 4+3=7 subkey bytes per forward+backward pair, 56 total), followed by one final newdes_round_forward
    with no matching backward half (4 more subkey bytes, 60 total per block) -- 17 half-rounds total, matching the
    cipher''s own "17 rounds" description (each of those 17 is one of these half-rounds, not one forward+backward
    pair). The existing DB description of "each round XORs subkey into a byte, feeds it through an S-box, and XORs
    the output into the next byte, in sequence around all eight bytes" was an approximation; the actual per-round
    footprint is 4 bytes updated from the other 4 in one shot (not a single byte-to-next-byte chain), alternating
    direction each round, with the B2 exception above.'
- id: legendre_prf_round
  name: Legendre PRF evaluation step
  kind: step
  spec:
    component_flow:
    - component_id: add_mod
    - component_id: power_map_sbox
      notes: 'x^((p-1)/2) mod p computes the Legendre symbol directly (Euler''s criterion): result is 1, 0, or
        p-1 (i.e. -1 mod p), mapped to {1, 0, -1}.'
    state_model:
      state_bits: 0
    constant_injection: none
  notes: 'Not an iterated round -- Legendre PRF is a single algebraic evaluation, L_k(x) = ((x+k)/p): add the key
    k to the input x mod p, then evaluate the Legendre symbol (via Euler''s criterion, exponentiation to the power
    (p-1)/2 mod p). Modeled with kind "step" rather than full_round/half_round since there is no repeated round
    structure to speak of. state_bits left at 0 since the field size (and therefore the bit-width of every value
    here) is a free parameter of the chosen prime p, not a fixed constant of the design.'
