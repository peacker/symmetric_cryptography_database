- id: treyfer_round
  name: TREYFER round
  kind: full_round
  spec:
    state_model:
      state_bits: 64
      branches: 8
    component_flow:
    - component_id: add_mod
      params:
        modulus: 256
      notes: byte[i] + key[i] (mod 256), for i = 0..7
    - component_id: sbox
      params:
        input_bits: 8
        output_bits: 8
    - component_id: add_mod
      params:
        modulus: 256
      notes: S-box output is added into byte[i+1] (mod 256), with byte[8] aliased to byte[0] for wraparound
    - component_id: rotation_fixed
      params:
        amount_bits: 1
      notes: 1-bit left rotation of the updated byte[i+1]
    constant_injection: key_bits
  notes: 'One round chains all 8 plaintext bytes through a single shared 8-bit S-box: for i = 0..7, byte[i+1] <-
    ROL1(byte[i+1] + S(byte[i] + key[i] mod 256)), with byte[8] initialised from byte[0] to close the chain. The
    8-byte key is reused unmodified in every round -- there is no key schedule. 32 rounds are specified, well past
    the ~5 rounds the original paper''s avalanche experiments found sufficient for the worst-case bit to diverge.
    The S-box itself is deliberately not a designed component: the paper''s reference implementation "steals" whatever
    byte values happen to sit in adjacent non-cryptographic ROM, falling back to the first 256 primes mod 256 if
    nothing else is available.'
