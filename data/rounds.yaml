  notes: 'Rounds 1-4 of each of Orthros''s two parallel branches (Branch1/Branch2): "R = AddConstant ◦ AddRoundKey ◦
    matrixMul ◦ bit-permutation ◦ S-box." Each branch uses its own dedicated bit permutation (Pbr1 for Branch1,
    Pbr2 for Branch2) and the same 4-bit S-box; matrixMul is a 4x4 binary near-MDS matrix over nibbles (branch
    number 4), identical in form to Midori''s MixColumn matrix. See orthros_round_nibble_perm for rounds 5-12.'
